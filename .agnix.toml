severity = "Warning"

# Excluded trees. The first four are the CORPUS and its derived output — they are
# ingested research material and generated artifacts, not agent documentation, so
# validating them as instruction files is a category error (and they are the
# source of every XML-001 "unclosed tag" in this repo: prose that mentions
# `<uri>` or `<task>` inline).
exclude = [
  "node_modules/**",
  ".git/**",
  ".venv/**",
  ".agent/**",
  # Corpus + derived graph output.
  "sources/**",
  "raw/**",
  "graphify-out/**",
  # graphify: vendored third-party skill installed by `graphify install
  # --project`. Its SKILL.md is 714 lines (over agnix's AS-012 500-line cap)
  # and its reference docs carry hard-coded `~/.graphify/` paths — both
  # upstream-controlled, regenerated by the installer, never hand-edited.
  # Same carve-out as md_budget's DEFAULT_EXCLUDED_PREFIXES.
  ".claude/skills/graphify/**",
]
tools = ["claude-code"]
max_files_to_validate = 10000

# Per-file rule suppressions for by-design patterns. Scoped by path so a stray
# hard-coded path or bad pattern in NEW code still flags. Rule IDs verified via
# `agnix --verbose .`.

[[overrides]]
# CLAUDE.md and the eager rule files are hierarchical reference docs FOR a
# Claude Code repo, which is precisely what these four heuristics misread:
#  - XP-003 "hard-coded `.claude/` path": naming `.claude/rules/…` and
#    `.claude/skills/…` is the POINT — these docs exist to tell an agent where
#    that config lives. Rewording them to satisfy a portability check would
#    delete the fact the sentence exists to state.
#  - CC-MEM-006 "negative instruction without positive alternative": the whole
#    genre here is invariants (`do-not.md`, "never bare `graphify install`").
#    Each one DOES carry its alternative in the adjacent clause — the rule
#    matches the negation token, not the paragraph.
#  - PE-001 "critical keyword in the 40-60% lost-in-middle zone" and PE-004
#    "ambiguous term": prompt heuristics for a single task prompt, applied to
#    a reference document with headed sections.
#
# CC-MEM-009 "Token Count Exceeded" is a different case, and is disabled on
# EVIDENCE rather than on judgment. It asserts a ~1,500-token ceiling and names
# <https://code.claude.com/docs/en/memory> as its source. That figure is not on
# that page, nor anywhere in Anthropic's corpus. Control-armed over the full
# corpus (code.claude.com/docs/llms-full.txt, 6,360,175 B, fetched 2026-07-25):
#
#     \b1,?500\b   ->  0 hits
#     "200 lines"  -> 13 hits      <- so the probe DOES discriminate
#
# This is the same shape as the misattributed 12,000-char figure documented in
# `.claude/rules/md-size-budgets.md` and `kb_setup.md_budget`: a real-looking
# number travelling with a citation that does not contain it. The ONE documented
# figure — "target under 200 lines per CLAUDE.md file" — IS enforced here, by the
# `md_size_budget` hk step; CLAUDE.md sits at 198/200. Approved by Ray with this
# evidence, 2026-07-25. Re-check if agnix ever cites a primary source for 1,500.
paths = ["CLAUDE.md", "**/CLAUDE.md", ".claude/rules/*.md"]
disabled_rules = ["XP-003", "CC-MEM-006", "PE-001", "PE-004", "CC-MEM-009"]

[[overrides]]
# CC-HK-025 is an upstream agnix bug. It tests the RAW matcher string (e.g.
# "startup|resume") against the SessionStart enum {startup,resume,clear,compact}
# WITHOUT splitting on '|'/',' — but the official Claude Code hooks docs
# (code.claude.com/docs/en/hooks) parse a matcher containing only
# [A-Za-z0-9_ -,|] as a LIST of exact values split on '|'/','. So our
# `startup|resume` correctly fires on both; agnix is wrong. Version-pinning
# (VER-001) does not fix it — the enum is a compile-time constant. Scoped to
# settings.json so a genuinely-bad matcher elsewhere still flags. Sibling
# precedent upstream fixed: agent-sh/agnix#1052 (CC-SK-008 whitespace split).
# Remove this override once an equivalent CC-HK-025 fix ships upstream.
paths = [".claude/settings.json", "**/settings.json"]
disabled_rules = ["CC-HK-025"]

[[overrides]]
# VER-001 ("No Tool/Spec Versions Pinned", Severity LOW / BEST_PRACTICE / info)
# nudges us to pin `[tool_versions] claude_code = "<ver>"`. We deliberately do
# NOT: Claude Code auto-updates and is not a mise-managed dep, so any pinned
# value goes stale within days — after which agnix would validate our config
# against a CC version we no longer run. Unpinned, agnix uses its latest-known
# schema, which MATCHES us. Info-level so it never fails (--strict escalates
# warnings, not info) — disabled only to keep the output clean.
paths = [".agnix.toml"]
disabled_rules = ["VER-001"]

[rules]
skills = true
hooks = true
agents = true
memory = true
plugins = true
xml = true
mcp = true
imports = true
agents_md = true
prompt_engineering = true
frontmatter_validation = true
xml_balance = true
import_references = true
disabled_rules = []
disabled_validators = []

[files]
include_as_memory = []
include_as_generic = []
exclude = []
