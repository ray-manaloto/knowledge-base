[project]
name = "kb-setup"
version = "0.1.0"
description = "Thin helpers for the knowledge-base graphify substrate"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
kb-setup = "kb_setup.cli:main"

[project.optional-dependencies]
# DELIBERATELY a floor and not an `==`, unlike the dev group below — this is the
# one dependency table that REACHES A CONSUMER. dotfiles installs this package as
# a SHA-pinned git dependency (`dotfiles/python/pyproject.toml:37`), so an exact
# pin here would force that exact trafilatura on a repo with its own resolution
# to satisfy, and turn any conflict there into an unresolvable one. Applying
# CLAUDE.md's "exact pins" rule literally here would export our preference as
# someone else's constraint. Reproducibility for us is `uv.lock`, which records
# 2.1.0 regardless.
# Article-body extraction for the rendered-page fetch path (kb_setup.fetch).
# Apache-2.0 — the same licence as graphify, which matters: graphify removed
# html2text purely on copyleft grounds (PR #586), so a GPL extractor would be
# unproposable upstream. Optional because the upstream-source path needs no
# extractor at all.
fetch = ["trafilatura>=2.0"]

[dependency-groups]
# trafilatura is in dev too so `ty` can resolve the optional import rather than
# reporting an unresolved module (this repo forbids inline suppressions).
#
# EXACT pins, per CLAUDE.md's "no floating ranges". The ranges these replace were
# badly stale — `ruff>=0.11` against a resolved 0.15.22, `pytest>=8` against
# 9.1.1 — so the declared floor described a toolchain nobody had run in months,
# and a fresh clone could resolve a different linter than the one every gate here
# was verified against. `ty` matters most: it is pre-1.0, so `>=0.0.1a1` admitted
# every future breaking release by construction.
#
# Safe to pin exactly BECAUSE this is a `[dependency-groups]` table (PEP 735):
# dev groups are not installed by consumers, so an `==` here binds nobody but us.
# Contrast `[project.optional-dependencies]` below, which IS exported.
dev = ["ruff==0.16.2", "ty==0.0.69", "pytest==9.1.1", "trafilatura==2.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package source lives under python/src/ (repo layout), but this is the ONE
# pyproject.toml at the repo root — it aggregates project metadata + ruff + ty +
# pytest so every python surface (python/src AND the root-level tests/) resolves
# the same config. `uv run` (no --project) uses it.
[tool.hatch.build.targets.wheel]
packages = ["python/src/kb_setup"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Docstring rule pairs ruff itself flags as mutually exclusive (Google style).
  "D203",
  "D211",
  "D212",
  "D213",
  # Formatter conflicts (ruff docs: ignore when using `ruff format`).
  "COM812",
  "ISC001",
  # subprocess is the core mechanism of this graphify-driver tool; tools resolve
  # via mise shims on $PATH, so full paths (S607) would break, and every
  # subprocess call (S603) is an intentional, trusted graphify/git invocation.
  "S603",
  "S607",
  # print IS the user interface — these are CLI progress/output helpers.
  "T201",
  # Lazy imports inside the CLI dispatch are intentional (fast startup, optional
  # heavy deps like graphify only when that subcommand runs).
  "PLC0415",
  # Exception-message style rules — noise for a small tool.
  "TRY003",
  "EM101",
  "EM102",
  # Runtime-vs-type-checking import placement — a micro import-time optimization
  # irrelevant to a CLI; keeps imports in one obvious place.
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert IS the mechanism (S101), self-describing names (D103), magic
# values (PLR2004), private-member probing is the point (SLF001), fixture args
# are untyped by pytest convention (ANN), and the dir is an implicit package (INP001).
"tests/**/*.py" = [
  "S101",
  "D103",
  "PLR2004",
  "SLF001",
  "ANN001",
  "ANN201",
  "INP001",
  "ARG001",
]
# Intentional catch-all fail-open: a crashed PreToolUse guard must NEVER brick Bash.
"python/src/kb_setup/hook_guard.py" = ["BLE001"]
# Same fail-safe rationale, opposite direction: the eval runner catches whatever a
# repo-supplied probe or control arm raises and RECORDS it as that case's failure.
# Narrowing this would let one bad case abort the whole run, which is the failure
# mode the runner exists to prevent — a harness that stops early reports fewer
# cases, and fewer cases reads as green.
"python/src/kb_setup/evals.py" = ["BLE001"]
# Best-effort report block (BLE001); `G` is the standard NetworkX graph name (N806).
"python/src/kb_setup/_merge_docs.py" = ["BLE001", "N806"]
# The CLI main() is a flat command dispatch — branchy by nature, not complex logic.
"python/src/kb_setup/cli.py" = ["C901", "PLR0911", "PLR0912"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# _merge_docs.py runs ONLY under graphify's bundled interpreter (it imports
# graphify.build/cluster/export/... which are absent from the KB uv env), so ty
# cannot resolve those imports here. It is a foreign-interpreter script driven via
# `mise run kb-merge` — ruff still lints it; ty legitimately cannot type-check it.
exclude = ["**/_merge_docs.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
