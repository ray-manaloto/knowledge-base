[project]
name = "kb-setup"
version = "0.1.0"
description = "Thin helpers for the knowledge-base graphify substrate"
requires-python = ">=3.14"
# Runtime dependencies are exported:
# dotfiles installs kb-setup as a SHA-pinned git dependency, so anything here
# lands in a tree with its own resolution to satisfy. Chosen deliberately, and
# the reasoning is in docs/research/reports/2026-08-10-logging-library-selection.md
# rather than summarised here.
#
# Three facts made it affordable. structlog is pure Python and declares ZERO
# runtime dependencies on py>=3.11 (its only entry is a typing-extensions marker
# for older interpreters), so the export is one package and not a tree. It is an
# EVENT layer, not a logging system: it owns no sinks, which is what lets §2.5's
# human-rendering sink stay a `logging.Formatter` subclass in kb_setup where it
# is reviewed like any other module. And it was the only candidate of six that
# passed R10 liveness while leaving report rendering with us.
#
# A FLOOR, not an `==`, for the same reason the fetch extra below is: an exact
# pin here is exported as someone else's constraint. Reproducibility for us is
# uv.lock. SkillOpt is the deliberate exception: its current public surface is
# 180 commits past the still-current 0.2.0 release, so only the reviewed VCS SHA
# can identify it; the contract below rejects any other origin or revision.
dependencies = [
  # The vendor's own typed client for `GET /v1/models`, which `kb_setup.model_limits`
  # uses as its authoritative source. Declared rather than left transitive (it
  # arrived via graphifyy) because a dependency we import must be one we name.
  # A subscription-minted CLAUDE_CODE_OAUTH_TOKEN authorizes that endpoint —
  # verified 2026-08-17, 200 for a real model against 404 for a bogus one.
  "anthropic>=1.0.0",
  "graphifyy[all]==0.9.53",
  "httpx2>=2.12.0",
  "msgspec==0.21.1",
  "skillopt @ git+https://github.com/microsoft/SkillOpt@93bdf3d770b99128daf35278218e5a666fe392f3",
  "structlog>=26.1",
]

[project.scripts]
kb-setup = "kb_setup.cli:main"
aggregated-research = "kb_setup.research.cli:main"

[project.optional-dependencies]
# DELIBERATELY a floor and not an `==`, unlike the dev group below — this is the
# one dependency table that REACHES A CONSUMER. dotfiles installs this package as
# a SHA-pinned git dependency (`dotfiles/python/pyproject.toml:37`), so an exact
# pin here would force that exact trafilatura on a repo with its own resolution
# to satisfy, and turn any conflict there into an unresolvable one. Applying
# CLAUDE.md's "exact pins" rule literally here would export our preference as
# someone else's constraint. Reproducibility for us is `uv.lock`, which records
# 2.1.0 regardless.
# Article-body extraction for the rendered-page fetch path (kb_setup.fetch).
# Apache-2.0 — the same licence as graphify, which matters: graphify removed
# html2text purely on copyleft grounds (PR #586), so a GPL extractor would be
# unproposable upstream. Optional because the upstream-source path needs no
# extractor at all.
fetch = ["trafilatura>=2.0"]

[dependency-groups]
# trafilatura is in dev too so `ty` can resolve the optional import rather than
# reporting an unresolved module (this repo forbids inline suppressions).
#
# EXACT pins, per CLAUDE.md's "no floating ranges". The ranges these replace were
# badly stale — `ruff>=0.11` against a resolved 0.15.22, `pytest>=8` against
# 9.1.1 — so the declared floor described a toolchain nobody had run in months,
# and a fresh clone could resolve a different linter than the one every gate here
# was verified against. `ty` matters most: it is pre-1.0, so `>=0.0.1a1` admitted
# every future breaking release by construction.
#
# Safe to pin exactly BECAUSE this is a `[dependency-groups]` table (PEP 735):
# dev groups are not installed by consumers, so an `==` here binds nobody but us.
# Contrast `[project.optional-dependencies]` below, which IS exported.
#
# `pytest-xdist` is here for WALL CLOCK, and the number that bought it is worth
# keeping: `mise run kb-gates` measured 249s on a 12-core M-series host, of which
# `test` alone was 219.2s — 88%. Parallelising the four GATES therefore has a
# ceiling of 12%, which is why #248's premise was re-scoped by its own
# measurement rather than implemented as written. The suite is 2,059 tests over
# 71 files with a long tail (the 20 slowest sum to 94s), which is the shape that
# parallelises well; a suite dominated by one slow test would not have been.
dev = [
  "ruff==0.16.5",
  "ty==0.0.77",
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "trafilatura==2.2.0",
  "mcp2cli==3.7.0",
]

codegen = ["datamodel-code-generator[protobuf]==0.76.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package source lives under python/src/ (repo layout), but this is the ONE
# pyproject.toml at the repo root — it aggregates project metadata + ruff + ty +
# pytest so every python surface (python/src AND the root-level tests/) resolves
# the same config. `uv run` (no --project) uses it.
[tool.hatch.build.targets.wheel]
packages = ["python/src/kb_setup"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Docstring rule pairs ruff itself flags as mutually exclusive (Google style).
  "D203",
  "D211",
  "D212",
  "D213",
  # Formatter conflicts (ruff docs: ignore when using `ruff format`).
  "COM812",
  "ISC001",
  # subprocess is the core mechanism of this graphify-driver tool; tools resolve
  # via mise shims on $PATH, so full paths (S607) would break, and every
  # subprocess call (S603) is an intentional, trusted graphify/git invocation.
  "S603",
  "S607",
  # print IS the user interface — these are CLI progress/output helpers.
  "T201",
  # Lazy imports inside the CLI dispatch are intentional (fast startup, optional
  # heavy deps like graphify only when that subcommand runs).
  "PLC0415",
  # Exception-message style rules — noise for a small tool.
  "TRY003",
  "EM101",
  "EM102",
  # Runtime-vs-type-checking import placement — a micro import-time optimization
  # irrelevant to a CLI; keeps imports in one obvious place.
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert IS the mechanism (S101), self-describing names (D103), magic
# values (PLR2004), private-member probing is the point (SLF001), fixture args
# are untyped by pytest convention (ANN), and the dir is an implicit package (INP001).
"tests/**/*.py" = [
  "S101",
  "D103",
  "PLR2004",
  "SLF001",
  "ANN001",
  "ANN201",
  "INP001",
  "ARG001",
]
# Intentional catch-all fail-open: a crashed PreToolUse guard must NEVER brick Bash.
"python/src/kb_setup/hook_guard.py" = ["BLE001"]
# Same fail-open contract, one event later and in the other client: a crashed
# codex PostToolUse hook must never cost a lane its turn. Codex reads a non-zero
# exit plus stderr as BLOCKING feedback, so a leaked exception here would not
# merely lose the diagnostics — it would replace the lane's tool result with a
# traceback. The catch-all is what keeps a bug in this hook cheaper than the
# problem it exists to report.
"python/src/kb_setup/edit_check.py" = ["BLE001"]
# The graph-size gate calls graphify's OWN `security._max_graph_file_bytes()`.
# Private, and the lesser risk by a wide margin: the alternative is a second
# parser for a suffix convention where `GB` means GiB (1024**3), so a
# reimplementation would agree on the string `"1GB"` and be 7% wrong about the
# number — reporting headroom this repo does not have, in the gate whose entire
# job is headroom. `test_the_gate_reads_graphifys_own_cap` fails loudly if the
# name moves, which is what makes depending on it recoverable rather than silent.
"python/src/kb_setup/graph_size.py" = ["SLF001"]
# `kb-manifest-audit` reads `graph.py`'s four `_EXPECTED_*` registries directly
# (the alternative — a public re-export just for this one reader — would be a
# second name for the same tuples) and reuses `graphify_sdk`'s own private
# zero-node review predicates (`_package_manifest_item_is_reviewed`,
# `_json_metadata_item_is_reviewed`, `_sha256_file`) rather than restating their
# three-way error/nodes/edges condition, which is exactly the duplication
# `use-tool-builtins.md` and spec REVISION 2 §C2 warn against.
"python/src/kb_setup/manifest_audit.py" = ["SLF001"]
# Same fail-safe rationale, opposite direction: the eval runner catches whatever a
# repo-supplied probe or control arm raises and RECORDS it as that case's failure.
# Narrowing this would let one bad case abort the whole run, which is the failure
# mode the runner exists to prevent — a harness that stops early reports fewer
# cases, and fewer cases reads as green.
"python/src/kb_setup/evals.py" = ["BLE001"]
# Best-effort report block (BLE001); `G` is the standard NetworkX graph name (N806).
"python/src/kb_setup/_merge_docs.py" = ["BLE001", "N806"]
# The CLI main() is a flat command dispatch — branchy by nature, not complex
# logic. PLR0915 (statement count) joined this list 2026-08-26 (#276): `_run`
# grows one `if cmd == ...` arm — two statements, a lazy import and a return —
# per subcommand by design, so the LENGTH of this function is the intended
# shape, not an accident to refactor away. The BODY complexity these ignore
# (C901/PLR0911/PLR0912/PLR0915) is real but architectural: one flat dispatch
# beats N smaller ones a reader has to chase across files.
"python/src/kb_setup/cli.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
# `archive()`'s six keyword-only parameters are a FIXED external interface
# (session-review-report-always spec §3b): each mirrors one CLI flag
# (`--run-json`/`--report-dir`/`--handoff`/`--date`/`--dry-run`) 1:1, so
# bundling them into a request object would only rename this same information
# rather than reduce it. The function's BODY complexity (C901/PLR0911/PLR0912)
# is not ignored — it is decomposed into named `_resolve_*`/`_load_*` helpers
# instead, each under the limit on its own.
"python/src/kb_setup/session_review_archive.py" = ["PLR0913"]
# `decide()`'s six keyword-only parameters are the currency engine's one public
# judgment function (currency watch-reviewed spec #486 §3) — `sync`/`upstream`/
# `moved`/`observations`/`views`/`reviewed` are each an independent fact the
# six-gate bar reads, and dozens of EXISTING tests across test_currency_decide.py
# already call it with this exact flat kwarg shape. Bundling them into a request
# object now would only rename this same information while breaking every one of
# those call sites — the same "FIXED interface" reasoning as
# session_review_archive.py's archive() above, on the read side instead of the
# write side.
"python/src/kb_setup/currency/decide.py" = ["PLR0913"]
# S310: the only URL this module opens is the module-level DOCS_URL constant, an
# https platform.claude.com docs path — never a caller-supplied string, so the
# audited hazard (an attacker-chosen scheme such as file://) is unreachable.
# BLE001: every Models-API failure — auth, network, unknown id — must fall
# through to the next source. A resolver built on layered fallback cannot let
# one source's exception become the run's exception.
"python/src/kb_setup/model_limits.py" = ["S310", "BLE001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# _merge_docs.py runs ONLY under graphify's bundled interpreter (it imports
# graphify.build/cluster/export/... which are absent from the KB uv env), so ty
# cannot resolve those imports here. It is a foreign-interpreter script driven via
# `mise run kb-merge` — ruff still lints it; ty legitimately cannot type-check it.
exclude = ["**/_merge_docs.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# The ONE place suppressions live, per `zero-skip-policy.md`. `typos` reads
# `[tool.typos]` from pyproject natively, so this needs no second config file.
#
# `cpy` is the COBOL copybook extension, and it appears here because
# `graphify_sdk._UNSUPPORTED_LANGUAGE_SUFFIXES` must name the real extension to
# classify the copybooks vendored in the corpus. Dropping it to satisfy the
# spell-checker would put those files back to blocking `kb-build`.
# Approved by Ray, 2026-08-16.
[tool.typos.default.extend-words]
cpy = "cpy"
# `nativ` is the NAME of a pinned source, not a misspelling of "native":
# github.com/Blaizzy/nativ, tracked at `sources/nativ.manifest` and described in
# `sources/REGISTRY.md`. Approved by Ray 2026-09-01 under `zero-skip-policy.md`
# rule 1, which requires explicit sign-off for any suppression.
#
# It flags on line 217's bare token and NOT on line 212's `[Blaizzy/nativ]`,
# because typos skips the word inside a link path — which is why the repo could
# carry it from 2026-08-08 (#237) without anyone noticing that `mise run lint`
# had gone red. Renaming the prose to "native" was the alternative and is the
# WRONG fix: it would falsify a pinned source's identity to satisfy a linter.
nativ = "nativ"

[tool.uv.sources]
graphifyy = { git = "https://github.com/ray-manaloto/graphify", rev = "157a957e89a16246bba3a078de2777711ee85e31" }

# Every strict msgspec model generated from a committed schema, as datamodel-codegen's
# own `--all-jobs`/`--all-jobs --check` batch (0.75.1). Replaces four
# hand-written generate_*.py/check_*.py pairs (#569) — this table plus the two
# `mise run kb-codegen*` tasks IS the generator now; nothing else invokes it.
#
# Two couplings a bare version-and-flags read would not tell you, so they are
# recorded here instead of re-discovered:
#
# (a) generated bytes depend on THIS repo's ruff config, and the OUTPUT PATH is
# what carries that. datamodel-codegen's ruff-format pass runs with cwd set to
# the job's output directory, and ruff discovers `pyproject.toml` by walking up
# from cwd — so every job's `output` must stay inside this repo tree (it does,
# below). An output outside the repo would silently get ruff's 88-column
# default instead of this file's `line-length = 100`.
#
# (b) the native `--check` uses the SAME formatter pass as generation
# (`ruff check --fix --unsafe-fixes` plus `ruff format`, over this repo's
# `select = ["ALL"]`), so a future ruff bump that rewrites generated code
# reddens `--check` once, a human regenerates, and the rewritten model then
# ships green — the drift gate does not contain a formatter-driven semantic
# change, only a formatter-driven byte change. Review regenerated diffs after
# any ruff bump.
[tool.datamodel-codegen]
input-file-type = "jsonschema"
schema-version = "2020-12"
schema-version-mode = "strict"
strict-refs = true
output-model-type = "msgspec.Struct"
target-python-version = "3.14"
# ruff-check, not isort: datamodel-codegen's isort formatter and hk's ruff
# disagree on merging a value import with a TYPE_CHECKING-only import (an
# optional field's `UNSET`/`UnsetType`), so an isort-formatted job used to need
# its own extra `ruff check --select I --fix` pass to match what hk would
# rewrite it to anyway. ruff-check runs that same ruff pass as part of
# generation, so the two agree by construction and no per-job extra step exists.
formatters = ["ruff-check", "ruff-format"]
custom-template-dir = "schemas/templates"
disable-timestamp = true
extra-fields = "forbid"
# msgspec.Struct output normally auto-enables these two on a bare CLI call —
# `output_model_type == msgspec.Struct` flips `use-annotated` (which flips
# `field-constraints`) inside `_prepare_cli_config_args`, but ONLY on the
# direct-CLI code path. Batch/job config never runs through that function with
# the job's own TOML fields (`_create_config` calls `Config.merge_args`, whose
# `_prepare_cli_config_args` sees only the CLI-level args passed alongside
# `--all-jobs`, never a job's `output-model-type`), so a `[tool.datamodel-codegen]`
# job silently drops every `Meta(...)` constraint unless they are named here.
# Confirmed by generating with and without: every `Annotated[..., Meta(...)]` in
# the committed models collapses to a bare type.
#
# Of the pair, `use-annotated` is the load-bearing one — it is what flips
# `field-constraints`, so naming `field-constraints` alone changes nothing.
# Measured by mutation arm rather than reasoned: dropping `field-constraints` by
# itself SURVIVED the drift gate, while dropping `use-annotated` alone, and
# dropping both, each killed it (`.agent/kb/arms/codegen-569.toml` A5/A6). Both
# are kept because the pairing is what a reader checks against the docs, but do
# not read this comment as saying either key alone would do.
use-annotated = true
field-constraints = true
use-generic-base-class = true
use-specialized-enum = true
use-standard-collections = true

[tool.datamodel-codegen.jobs.source-groups]
input = "schemas/source-groups.schema.json"
output = "python/src/kb_setup/generated/source_groups.py"
custom-file-header = '''# Copyright (c) 2026 Raymond Manaloto
"""Generated source-group models; edit the schema and rerun the generator."""'''

[tool.datamodel-codegen.jobs.fetch-receipt]
input = "schemas/fetch-receipt.schema.json"
output = "python/src/kb_setup/generated/fetch_receipt.py"
custom-file-header = '''# Copyright (c) 2026 Raymond Manaloto
"""Generated fetch-receipt models; edit the schema and rerun the generator."""'''

[tool.datamodel-codegen.jobs.session-select]
input = "schemas/session-select.schema.json"
output = "python/src/kb_setup/generated/session_select.py"
custom-file-header = '''# Copyright (c) 2026 Raymond Manaloto
"""Generated session-selection models; edit the schema and rerun the generator."""'''

[tool.datamodel-codegen.jobs.research-record]
input = "schemas/research-record.schema.json"
output = "python/src/kb_setup/generated/research_record.py"
custom-file-header = '''# Copyright (c) 2026 Raymond Manaloto
"""Generated research-record models; edit the schema and rerun the generator."""'''

[tool.datamodel-codegen.jobs.packages]
input = "schemas/deps-dev-api-v3.proto"
output = "python/src/kb_setup/generated/packages.py"
input-file-type = "protobuf"
schema-version = "auto"
# Protobuf comments otherwise become `Annotated[..., Meta(description=...)]`.
# They add prose rather than wire constraints, and several upstream comments
# exceed this repository's generated-code line budget. Keep the generated
# contract to the protobuf field types and names.
use-annotated = false
field-constraints = false
# Emit enum members, rather than raw strings, as protobuf field defaults.
set-default-enum-member = true
custom-template-dir = "schemas/templates/deps-dev"
custom-file-header = '''# Copyright (c) 2026 Raymond Manaloto
"""Generated deps.dev package models; edit the pinned protobuf and rerun the generator."""'''
