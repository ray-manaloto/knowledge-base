# knowledge-base — tool versions + tasks
#
# A mise/hk/uv project (same stack as ray-manaloto/dotfiles) whose purpose is to
# be the shared research substrate any AI/LLM agent connects to: add sources,
# query the resulting graphify knowledge graph, and every other graphify
# feature. See CLAUDE.md.
#
# graphify is PROJECT-SCOPED here (never global): the graph lives in this repo's
# graphify-out/, and the MCP server is pinned to THIS graph.json — so multiple
# graphify projects on the same host never collide.

# mise's own floor. `hard` ERRORS and refuses to run (measured: rc=1, the task
# never starts); `soft` only WARNs and continues (rc=0). Both compare "lower
# than", so they are FLOORS — there is no ceiling key anywhere in mise's schema
# (control-armed: `min_version` and `tools` present, any key containing "max" →
# none). A self-update moves UP, so this can never fire on one; catching that
# direction is `currency.toml`'s `[tool.mise]`, not this.
#
# ⚠️ RAY RULED 2026-08-19, and the ruling OVERRODE the doctrine this comment used
# to argue. Read this before reasoning from the shape of the values.
#
# Until 2026-08-19 the two keys meant different things: `hard` was a CORRECTNESS
# FLOOR frozen at 2026.7.14 (where the env-file secret-expansion fix #11269 and
# both task-freshness fixes #11288/#11296 landed), and `soft` tracked the version
# this repo had actually been verified against. That split is retired. Ray was
# shown it with its consequence and chose to move `hard` anyway: **both keys now
# track the reviewed version, and both move on every currency bump.**
#
# So `soft` is INTENTIONALLY INERT. An equal pair makes the warning band empty —
# `hard` errors across exactly the range `soft` would have warned in — and that is
# the accepted cost, not an oversight. The key is retained rather than deleted
# because Ray asked for it to be "kept as a slot in case the two-tier split
# returns"; do not delete it, and do not raise it above `hard` to "fix" the
# inertness, which would reinstate the doctrine the ruling replaced.
#
# The one rule that survives unchanged: bump these in the SAME change as
# `currency.toml`'s `expected` and `sources/mise.manifest`. All three now name
# one version, so any disagreement between them is drift by definition. (They
# drifted once under the old two-tier rule and the cold lane caught it.)
min_version = { hard = "2026.8.10", soft = "2026.8.10" }

[tools]
# Pins mirror ray-manaloto/dotfiles/.config/mise/conf.d/shared.toml (known-good).
python = "3.14.7"
uv = "0.12.5"
hk = "1.56.1"
pkl = "0.32.1"
typos = "1.49.0"
# ffmpeg: system binary graphify's `video` extra (faster-whisper) needs to
# extract audio before transcription — NOT a pip dep, so graphifyy[all] can't
# supply it. Required for `graphify add <youtube-url>`. conda backend (prebuilt).
"conda:ffmpeg" = "9.0.1"
taplo = "0.10.0"
rumdl = "0.2.60"
# biome: the JS/TS linter for `.claude/workflows/*.js` (U8b0). Rust-native, per
# this repo's toolset comment in hk.pkl. Was installed and used unpinned before
# this — `grep -c biome mise.toml` returned 0 — so the `workflow_lint` gate
# would have run whatever biome a given host happened to have. 2.5.10 is the
# version this gate was built and measured against (`biome --version`,
# 2026-08-23): its `noUnusedVariables` underscore-prefix exemption and its lack
# of an `allowReturnOutsideFunction`-equivalent parser flag are both read from
# THIS pinned version, not assumed from its docs.
biome = "2.5.10"
gitleaks = "8.30.1"
# agnix: agent-documentation validator (CLAUDE.md / .claude/** / settings.json).
# Same pin as dotfiles' shared set. Run with --strict everywhere — agnix exits 0
# on warnings-only, so without it every warning is invisible (dotfiles #250).
#
# 0.40.0 -> 0.46.0 (2026-08-06). The floor that matters is **0.44.0**, which fixed
# CC-AG-003/CC-SK-001 rejecting documented `model` values — `fable` among them.
# That is load-bearing here: `.claude/CLAUDE.md`'s orchestration flow is
# Fable-gated, and on 0.40.0 an agent file declaring `model: fable` FAILED
# `mise run lint` while the pinned docs (`sub-agents.md:286`, `:303`) declare it
# valid. Do not drop below 0.44.0 to "match dotfiles" — bump dotfiles instead.
# 0.45.0 additionally accepts parameterized ids such as `claude-opus-5[effort=high]`.
"github:agent-sh/agnix" = "0.50.0"
# fnox: the credential tool the shell's secrets come from (jdx/fnox, in mise's
# registry as `github:jdx/fnox`). Pinned here rather than left to the user's
# GLOBAL mise, which at the time installed into a directory literally named
# `latest` and self-updated out of band — so nothing could notice a version
# moving under us (#86). Ray's call, 2026-07-31: track it "like hk", i.e. as an
# ordinary pinned tool with a `mise_key`, not with `[tool.mise]`'s self-managed
# shape.
#
# ⚠️ THE `latest` PREMISE IS STALE — re-measured 2026-08-25 at the 1.33.1 ->
# 1.34.0 bump. `~/.config/mise/config.toml`'s `[tools]` now carries an EXPLICIT
# `fnox = { version = "1.34.0", … }`, and `mise exec --cd "$HOME" -- fnox
# --version` prints 1.34.0. The global side is a pin, not a floating `latest`,
# so the skew this block describes is not "repo pinned vs global drifting" but
# "two pins that must be moved together". Control arm: the same probe reports
# `hk = 1.56.1` there too, matching this file — so it reads real values rather
# than defaulting to agreement.
#
# Practically: a bump here is a bump toward the global pin, and 1.34.0 CLOSES
# the gap rather than widening it. This repo still does not touch
# `~/.config/fnox`, so `do-not.md` #11 remains un-engaged. Check the global
# `[tools]` entry when bumping; do not assume it floats.
fnox = "1.34.0"
# Doppler is the runtime secret-delivery boundary used by the devcontainer and
# CI/CD workflows. Keep this exact pin aligned with `[tool.doppler]` and
# `sources/doppler.manifest`; credentials/config remain user-owned and are not
# stored in this repository.
doppler = "3.76.5"
# gh: the GitHub CLI `kb-ship` and `kb-land` are BUILT ON — `pr.py` alone holds
# 19 `"gh"` literals, and it backs PR creation (`pr.py:372`) and the merge
# (`pr.py:233`). Until 2026-08-17 it was pinned NOWHERE in this repo and resolved
# only from Ray's user config, so on a fresh clone — a new machine, a CI runner,
# anyone else — `mise run kb-ship` fails at the tool it needs most, and fails
# late, after the gates have already run.
#
# This is Ray's standing "we should not rely on tools managed by
# `~/.config/mise/mise.toml`" applied to the one unpinned tool that could break
# shipping. Pinned to the version this repo has actually been shipping with.
gh = "2.98.0"
# NO `git` PIN, and that is a measurement rather than an omission. mise's registry
# has **no `git` entry at all** — `mise registry | grep '^git '` returns nothing,
# against a control of `gh` on the line above, which returns
# `aqua:cli/cli asdf:...`. So the probe discriminates and the answer is real; a
# hand-written `aqua:git-scm/git` was tried and fails outright with
# `no aqua-registry found`. Pinning git here is not a thing that can be done.
#
# It is also not a thing that should be: every host already has one (macOS ships
# Apple Git 2.50.1), and replacing it would swap the user's configured credential
# helpers and commit signing for a mise build. What a floor WOULD have guarded is
# a host old enough to lack a porcelain flag `kb_setup` uses — accepted as
# unguarded, because the alternative does not exist.

# Cross-vendor executor-lane CLIs for the adopted Fable-5 orchestrator plugin
# (mar3co/fable-orchestrator, in `codex` mode) + the antigravity plugin
# (yuting0624/antigravity-for-claude-code). `antigravity-cli`'s canonical mise
# registry short name (https://mise.jdx.dev/registry.html) is
# `aqua:google-antigravity/antigravity-cli` (Google's current agentic CLI,
# exposes Gemini 3.x; ships both `antigravity` and the `agy` symlink the
# antigravity plugin drives). `codex` below is pinned by its EXPLICIT
# `npm:@openai/codex` backend rather than the `codex` registry short name —
# see why below. The Claude architect stays in the chair; these are the
# executor lanes only. auth is per-user (codex login / Google account) — mise
# manages the binaries, not the credentials.
#
# ⚠️ THE `codex` SHORT NAME IS PINNED BY A LAGGING LIST, NOT A LAGGING
# REGISTRY — an earlier version of this note blamed the aqua registry and an
# npm-fallback install; that story was MEASURED WRONG and is corrected here.
# `mise latest codex` reads `https://mise-versions.jdx.dev/data/codex.toml`,
# whose newest row was `"0.150.0-alpha.9"` on 2026-08-26 — control-armed, that
# URL returns 200 while a bogus tool name 404s, so the probe discriminates.
# A stale PER-TOOL cache compounds it (`~/.cache/mise/codex/remote_versions-
# *.msgpack.z`, several ages coexisting): `mise latest codex` reported
# `0.149.1` on this host, a full release behind, while **0.150.0 was already
# installed via aqua itself** — `mise tool codex` names the backend, and there
# was no npm fallback involved. Verify a bump by attempting the install, never
# by grepping `ls-remote`/`latest` (probes-need-a-control-arm.md).
#
# ⚠️ THE PIN BELOW TRADES INTEGRITY VERIFICATION FOR CURRENCY, KNOWINGLY. The
# `aqua:openai/codex` backend (the short name above) checksums every download
# (`mise tool codex` → `Security: checksum (sha256)`); the `npm:@openai/codex`
# backend below does not (`mise tool "npm:@openai/codex"` → `Security:
# [none]`) and adds a `node` runtime dependency. The owner accepted that cost
# on 2026-08-26, specifically to reach 0.150.1 past the lagging list above —
# a stated ruling, not an oversight. Re-litigate it with the owner before
# reverting to the short name, and update this note if you do.
#
# ⚠️ THIS PIN DOES NOT DECIDE WHICH `agy` RUNS. A hand-installed 143 MB
# binary sits at `~/.local/bin/agy` (dated 2026-07-14, reports **1.1.2**), and
# `~/.local/bin` is PATH position 2 against mise's shims at 159 — so a fresh
# login shell reaches 1.1.2, three releases behind even the old pin. Control
# arm: no `~/.local/bin/codex` exists, which is why codex resolves to its shim
# correctly; the shadow is agy-specific, not a general PATH fault. The sibling
# `antigravity` binary has no shadow and does resolve to this pin. Removing
# that file is Ray's call — `do-not.md` #11 bars this repo from touching
# anything under `~`. Until it goes, verify with `agy --version` in a FRESH
# shell; this pin governs `antigravity`, not `agy`.
#
# ⚠️ `agy` also SELF-UPDATES IN PLACE: before this bump the binary inside the
# `1.1.5` install dir reported 1.1.10. The directory name is mise's label, not
# what runs, so `mise which` never answers "which version" for this tool —
# ask the binary. Same class as the `fnox`/`latest` note above.
"npm:@openai/codex" = "0.150.1"
antigravity-cli = "1.1.22"
"npm:ctx7" = { version = "0.5.8", minimum_release_age = "0s" }
"npm:firecrawl-cli" = "1.23.3"
# coreutils: macOS ships BSD userland, not GNU — this repo's own rules and
# probes want GNU behaviour (`timeout`'s rc 124 on expiry, `nproc`, `tac`).
# Undeclared, the bare names hit erroring mise shims (rc 1), which reads
# exactly like the command under test failing. conda backend (prebuilt).
"conda:coreutils" = "9.11"
lychee = "0.24.2"

[deps.uv]
auto = true
run = "uv sync --locked"

[settings]
experimental = true
auto_install = true
lockfile = true
# New tool requests get exact-pinned versions (pins are the versioning model).
pin = true

[settings.status]
show_tools = true
missing_tools = "always"

[hooks]
# Reshim after installs (pipx backend leaves stale shims otherwise) + install
# the hk git hooks against mise-provided binaries.
postinstall = "mise reshim && hk install --mise"

[env]
HK_MISE = "1"
# ─── mise's own logging CANNOT be configured from this file ──────────────────
# Asked for 2026-08-08 after a `mise run fmt` wedged 3h06m at 0.0% CPU with the
# shell pane showing only "No output available". MEASURED, both forms, with a
# working control — do not re-add either:
#
#   [env] MISE_LOG_FILE = "…"       -> log file NOT written
#   [settings] log_file = "…"       -> log file NOT written
#   MISE_LOG_FILE=… mise run <task> -> WRITES (the control that discriminates)
#
# mise builds its logger before it evaluates this config, so the variables have
# to already be in the environment. That puts them in the user's shell profile
# or `~/.config/mise/config.toml` — both OUTSIDE this project, which `do-not.md`
# #11 forbids this repo from writing. So it is the user's one-line call:
#
#   export MISE_LOG_FILE="$HOME/.local/state/mise/mise.log"
#   export MISE_LOG_FILE_LEVEL=debug
#
# Default is already `~/.local/state/mise/mise.log`; what raising the level buys
# is that a hang leaves a last-thing-it-did entry, since a hang by definition
# produces no console output at all.
# <https://mise.jdx.dev/configuration.html#mise-log-file-mise-log>
# gitleaks does not auto-load .gitleaks.toml; point it there so the allowlist
# (skip the gitignored sources/ research corpus + derived graphify-out/) always
# applies — the corpus inherently contains secret-LIKE strings but is never committed.
GITLEAKS_CONFIG = "{{config_root}}/.gitleaks.toml"

# graphify refuses to READ a graph.json above this cap (`security.py`
# `_max_graph_file_bytes`, default 512 MiB), so exceeding it does not degrade the
# corpus — it makes the whole aggregate graph UNQUERYABLE, `explain`/`path`/
# `query` included. That happened 2026-08-03 at 532.1 MiB.
#
# Set HERE and not in `clean_env()` because mise resolves it for every `mise run
# kb-*` task AND for `mise exec`, whereas a python-side default would cover only
# subprocesses kb_setup itself spawns.
#
# It does NOT reach a bare `graphify …` typed at a shell — control-armed
# 2026-08-03, both directions: `mise env` and `mise exec -- sh -c 'echo $VAR'`
# both show `1GB`, while the same shell and a fresh `zsh -lc` both show it empty.
# Cause: `command -v graphify` resolves to
# `~/.local/share/mise/installs/pipx-graphifyy/<ver>/bin/graphify` — the raw
# INSTALL DIR, not a mise shim — so no mise env is applied. That is the same
# PATH-ordering defect `kb-currency-check` step 1 was built for (CLAUDE.md
# records it at 0.9.23; it is now at 0.9.31), and the same reason
# `graphify_env.graphify_exe()` resolves through `mise which` instead of PATH.
# So: the read-only introspection `hook_guard` allows direct
# (`explain`/`path`/`god-nodes`) must be invoked as `mise exec -- graphify …`
# whenever the aggregate is above 512 MiB. Below it, bare calls work either way —
# which is the real argument for keeping the aggregate under the stock default
# rather than living on this override.
#
# 1GB, chosen from a measurement rather than a guess: parsing the 557,996,319-byte
# graph peaked at 2,068,955,136 bytes RSS — 3.7x the file, in 1.6s. So a 1 GiB
# graph costs ~3.8 GiB to parse (plus networkx on top), which is survivable on a
# 16 GiB host and not merely on this 96 GiB one. Binary suffix: graphify reads
# `GB` as 1024^3.
#
# THIS IS A BRIDGE, NOT A GROWTH STRATEGY. Measured the same day: 184 MB (33%) of
# that file was duplicated `repo::` prefix from #120 — the pairwise merge loop
# re-prefixing its own accumulator once per source. Fixing that returns the
# aggregate to ~356 MiB, back UNDER the stock default. A cap raised once per
# ingestion is not a guard, it is a ratchet; the durable answer is #130
# (federate across per-source graphs instead of merging into one file).
GRAPHIFY_MAX_GRAPH_BYTES = "1GB"

# ---------------------------------------------------------------------------
# Lint / test gates (thin wrappers; logic lives in hk.pkl and python/)
# ---------------------------------------------------------------------------
[tasks.lint]
description = "Run hk check --all (read-only, ≡ CI) — hygiene, typos, pkl"
run = "hk run check --all"
# STRUCTURED OUTPUT, without changing what a human sees. Both of these write to a
# FILE and leave stdout exactly as it was, which is why they are here rather than
# `--format json` — that one replaces stdout, and `mise run lint` is read live.
#
# `HK_TIMING_JSON` is hk's own timing report: a run total plus per-step wall time
# **with overlapping intervals merged**, which is the correct measure for a
# parallel pipeline and is NOT the same quantity as `--format json`'s per-step
# `duration_ms` (that one is each command's own execution, and summing it across
# a parallel run produces a meaningless number — measured 2026-08-19, the two
# disagree by up to 2x per step). Documented only in hk's `docs/logging.md`
# § Performance Timing Reports — not in `--help`, not in the release notes.
#
# `HK_OUTPUT_FILE` (new in 1.56.0, #1204) puts the full output of FAILED commands
# at a known path instead of leaving it in scrollback. Default is
# `~/.local/state/hk/output.log`; pointing it into `.agent/kb/gates/` keeps it
# beside the gate record it explains, so "lint rc=1" has readable evidence next
# to it rather than a claim someone has to reproduce.
#
# Both land in `.agent/kb/gates/` — gitignored, machine-local, and the directory
# `kb-gates` already owns (`agent-artifact-conventions.md`), so this adds no
# ad-hoc path.
#
# ⚠️ THE CONDITION, because the paragraph above over-claimed it. These are FIXED
# paths, not per-run ones, so "beside the gate record it explains" holds only for
# the MOST RECENT lint. Two lint runs overlapping — a hand-run `mise run lint`
# while `kb-gates` is in flight, which happened on 2026-08-19 — leave one run's
# timing beside another run's `gates-<sha>.json`, and nothing in the file says
# which run wrote it. Read them as "the last lint on this machine", never as
# evidence for a particular sha. They are deliberately NOT keyed per-run: nothing
# reads them programmatically (`gates.py` never opens either), they exist for a
# human following a failure, and a pid-suffixed path no one can guess is worse at
# that job than a stale one. (Cold lane, batch 2.)
env.HK_TIMING_JSON = "{{config_root}}/.agent/kb/gates/lint-timing.json"
env.HK_OUTPUT_FILE = "{{config_root}}/.agent/kb/gates/lint-output.log"
# ⚠️ THE BOUND hk CANNOT GIVE ITSELF. `long-running-command-hangs.md` rule 1 has
# named this mechanism since it was written — "hk has no --timeout flag, no
# timeout step key, and no HK_* timeout env var, so a hard bound has to come from
# outside it... a mise task carries a `timeout` key" — and it was declared on
# ZERO of this repo's 75 tasks until 2026-08-19. The rule documented a mechanism
# nothing used, which is the state the rule itself was written from: a
# `hk run pre-commit --all` sat at 0% CPU for ~7 HOURS with nothing to abort it.
#
# Verified on the installed 2026.8.9 rather than read off a schema, three arms:
# a 10s run under a 2s bound -> rc=1 at 2s with "ERROR timed out after 2s"; a 1s
# run under a 10s bound -> rc=0 at 1s; a 3s run with no bound -> rc=0 at 3s. So
# the key fires, and does not fire early. (`mise -C <dir> run <task>` — the `-C`
# must precede `run`, or task DISCOVERY ignores it and every arm dies "no task
# found", which is what the first attempt at this measurement did.)
#
# 20m against an observed ~1-2 minutes. Deliberately loose: this is a WEDGE
# detector, not a performance budget, and a bound tight enough to fire on a slow
# machine would be a flake that teaches people to re-run rather than to look.
# It sits under `kb_setup.gates._GATE_TIMEOUT` (1800s), so on the gate path mise
# aborts first and reports which task wedged — better than a bare subprocess
# timeout in python that only knows something took too long.
timeout = "20m"

[tasks.kb-links]
description = "Link-check our docs/code with lychee via hk (HK_PROFILE=links) — never part of `lint`"
# The lychee step in hk.pkl is profile-gated, so the default `lint`/pre-commit
# paths never wait on the network. This task is the one door to it. Bound
# because the unbounded form measured >5 min on this repo (see hk.pkl).
env = { HK_PROFILE = "links" }
run = "hk run check --all -S lychee"
timeout = "5m"

[tasks.fmt]
description = "Auto-fix formatting/lint issues"
run = "hk fix"

[tasks.test]
description = "Run the Python test suite (pytest-xdist, one worker per core)"
# `-n auto` lives HERE and not in `[tool.pytest.ini_options] addopts`, on purpose.
# addopts applies to every invocation, including `uv run pytest tests/x.py::y`
# while debugging one test — where spinning up 12 workers costs seconds and buys
# nothing, and where a crashed worker replaces a real traceback with a protocol
# error. The GATE wants throughput; a debugging run wants a stack trace. Putting
# the flag on the task keeps `mise run test` parallel and leaves plain
# `uv run pytest` serial, which is also `ci-local-parity.md` rule 1: the task IS
# the gate's one definition.
#
# MEASURED, this host (12 logical / 8 performance cores, 2,059 tests, 71 files):
# 219.2s serial -> 57s with `-n auto`, a 3.8x saving and the dominant term in
# `kb-gates`' whole wall clock. Both runs emitted exactly 2,059 progress
# characters, all passes, so the speedup is not xdist quietly collecting less —
# an identical count is the control arm on that.
#
# ZERO test changes were needed to get there. That is a statement about the
# suite, not about xdist: nothing in `tests/` depended on execution order or on
# another test's leftovers. Worth knowing, because the day it stops being true
# the failure will look like flakiness rather than like the shared-state defect
# it is.
#
# `auto` rather than a number: it reads `os.cpu_count()`, so a smaller machine
# gets fewer workers instead of thrashing. `-x` still stops the run, though under
# xdist sibling workers may finish an in-flight test first, so more than one
# failure can be reported. That is more information, not less.
run = "uv run pytest tests/ -x -q -n auto"
# Bound: the full suite under 12 xdist workers; a wedged worker is the failure mode, not a slow one. See [tasks.lint] for the measurement behind this key.
# 25m and NOT 30m: `kb_setup.gates._GATE_TIMEOUT` is 1800s, so an equal bound is a
# RACE — whichever fires first decides the message, and the outer one names no
# task and kills no tree. Strictly under, so the inner bound always wins.
# `tests/test_gates.py` asserts the ordering for every GATE_TASK.
timeout = "25m"

[tasks.eval]
description = "Eval harness: tiers 1+2 (offline, gated). `-- --live` lane doctor, `-- --slow` retrieval"
# Tier 0 is `hk`/contracts. Tier 1 — does what we DECLARE actually RESOLVE?
# Tier 2 — does the WIRED guard DECIDE correctly? (a fixture table of
# (command, expected decision) rows, both directions), and does the graph
# RETRIEVE what it holds? (a golden set of query pairs, recall@k). One command
# per ENGINE: tiers 1+2 share the runner, so they share the command. Offline and
# fast by default so it can join the ship gates for free. Two opt-in axes, on
# purpose: `--live` shells out to the fable-orchestrator plugin's doctor.sh,
# which has no offline mode and spends one real API call per installed lane;
# `--slow` runs the free-but-~3-minute golden retrieval set (advisory — it
# reports recall@k against the live graph, it does not gate on it). Logic in
# kb_setup.evals (shared with dotfiles) + kb_setup.eval_cases (this repo's cases).
#
# READING THE RETRIEVAL NUMBERS: measured 2026-07-25, `mise run` output on this
# host masks some literal strings as `[redacted]` — including the digit `1`
# (`16` prints as `[redacted]6`) — while the SAME run through `uv run kb-setup
# eval --slow` printed identical figures unmasked. Cause not established (a mise
# `[env]` value was probed and is NOT what gets masked), so: when a digit comes
# back masked, re-read the figures from `uv run`, never guess them.
#
# CAUSE ESTABLISHED 2026-07-28. READ THIS BEFORE ACTING ON THE PARAGRAPH ABOVE:
# its parenthesis — "a mise `[env]` value was probed and is NOT what gets masked"
# — is FALSE read unqualified. A mise `[env]` value with `redact = true` IS
# masked; control arm, in a throwaway dir: `_C = { value = "1", redact = true }`
# adds a 1-char entry to `mise env --redacted`, and removing the file removes it.
# The old probe's SCOPE was wrong, not its subject: it probed THIS FILE's `[env]`,
# correctly found nothing, and generalised to all of mise's. The directive that
# does it is one config level up. The paragraph is kept verbatim because the
# preserve list forbids rewriting it and because a retraction is a record of what
# a session believed — but it must not be read as current fact, hence this.
#
# mise redaction is a display feature: it intercepts task output line by line
# and replaces any literal occurrence of a redacted VALUE (docs/environments/
# index.md:170). It has no idea whether the occurrence was the secret, so a
# short value in the set rewrites unrelated text.
#
#   1. `~/.config/mise/config.toml:64` declares `_.fnox-env = { tools = true }`,
#      which loads every fnox secret as a mise env directive and marks it
#      redacted. Discriminator, with `MISE_IGNORED_CONFIG_PATHS` pointed at that
#      file: ignored -> the three vars are absent from `mise env` (0) and the
#      redacted set is EMPTY (0); honoured -> present (3) and redacted (3).
#      Control arm: the same grep finds `HK_MISE` either way, so it discriminates.
#      They do NOT reach mise from the ambient shell, and `:64` is the only
#      redaction-capable directive in the file — which is what narrows this from
#      "the user config" to that directive. (Attribution was flagged as unarmed by
#      the spec review lane; this is the arm that closed it.) Nuance worth not
#      rediscovering: `mise env --json-extended` reports `source=None` for all
#      three while naming the file for ordinary `[env]` vars, so do not expect it
#      to attribute a plugin-provided directive.
#
#      ⚠️ CORRECTION, 2026-08-21: item 1's ATTRIBUTION is stale. `_.fnox-env` is
#      COMMENTED OUT in `~/.config/mise/config.toml` (now line 90), and the
#      plugin, while still registered under `[plugins]`, is deliberately
#      disabled — enabling it spawned runaway `fnox config-files` subprocesses
#      (10+ concurrent at 100% CPU, login shells hanging;
#      macos-development-environment#75). Secrets reach the shell through
#      `fnox activate zsh`'s chpwd/precmd hooks instead, so by the time mise runs
#      they are ORDINARY INHERITED ENV VARS, not a mise env directive. The arm
#      described above was sound when it ran; the config changed under it. The
#      redaction EFFECT below is unaffected and still bites — only the cause
#      named here is wrong. Item 3 is stale too: `env = "exec"` was reversed to
#      `env = true` (dotfiles' own rule file dates that 2026-08-02), so all ~50
#      credentials are in the shell again. Full chain and the agent contract:
#      `docs/secrets.md`.
#   2. Before 2026-07-27, fnox defaulted to `env = true` and exposed all 49
#      declared secrets, several with short values (one-character telemetry
#      flags). The literal string `1` was therefore IN the redaction set.
#   3. Ray set `env = "exec"` in `~/.config/fnox/config.toml` on 2026-07-27,
#      with three per-secret opt-backs. The set is now 3 values of 36/40/40
#      chars and `mise run` output is legible again — verified: `mise run eval`
#      prints `16 deny` and `6415 bytes` unmasked.
#
# CONFIRMED IN MISE'S OWN SOURCE, not only its docs (jdx/mise, tag v2026.7.15,
# `src/redactions.rs` — fetched with a control arm: a bogus path in the same tree
# returns 404, so the 200 is real):
#   `:64-81`   `Redactor::redact` is an Aho-Corasick multi-pattern replace of
#              every pattern with the literal "[redacted]" — no word boundaries,
#              no length floor. Its own test at `:118-121` asserts
#              "token1 and token2" -> "[redacted]1 and [redacted]2", which is the
#              exact shape of `16` -> `[redacted]6`.
#   `:31`      `Redactor::new` drops EMPTY patterns (`filter(|p| !p.is_empty())`),
#              so an empty redacted value masks nothing. The detector excludes
#              them; treating 0 as "shortest and worst" was a false positive one
#              config change away, since this host's fnox set holds an empty
#              LANGSMITH_WORKSPACE_ID. The docs do not say this — only the source.
# mise is registry source #61 (T2, pending). Ingesting it for AST is a P7 handoff
# item, not this round's: adding a `sources/**` input forces a full re-clone
# rebuild, which the rider puts out of scope.
#
# Reproduction, three arms, in a throwaway dir outside this repo:
#   redact=true  + value "1"   -> `count=[redacted]6 ... ruff=S[redacted]05`
#   redact=false + value "1"   -> `count=16 ... ruff=S105`
#   redact=true  + 36-char val -> `count=16 ... ruff=S105`
#
# THE REMEDY IS NOT IN THIS REPO. The directive is user-level config, which
# `do-not.md` #11 forbids editing here. What IS here is the detector:
# `tier1.mise-redaction-legible` (kb_setup.eval_cases) fails when any redacted
# value is shorter than `evals.REDACTION_COLLISION_FLOOR`. It is ADVISORY — a
# gated case would be a ship blocker no agent could clear — so read the eval
# output, not the rc. While it is green, `mise run` figures are trustworthy;
# when it is red, re-read every number from `uv run`.
run = "uv run kb-setup eval"
# Bound: tier1/tier2 cases carry their own 60s internal bounds; this only catches the harness itself wedging. See [tasks.lint] for the measurement behind this key.
# 25m, not 30m — see [tasks.test] for why an equal bound races `_GATE_TIMEOUT`.
timeout = "25m"

[tasks.kb-skill-lint]
description = "Check every SKILL.md instructs mise tasks, not raw commands (#128)"
# The authoring-time half of `mise-tasks-only.md`. Shares ONE decision function
# with the PreToolUse guard (`kb_setup.hook_guard.decide`), so a redirect added
# there is enforced at runtime AND at authoring time with no second table.
# Also an hk step, so `mise run lint` covers it; this task is the direct handle
# for working on a skill without running the whole suite.
run = "uv run kb-setup skill-lint"

[tasks.kb-model-limits]
description = "Resolve Claude models' max output tokens (+ --write --observed-at DATE)"
# A literal `max_output_tokens = "8192"` in CORPUS_PROFILE truncated every corpus
# extraction against a measured 31,887-token need — the API said so in its own
# words. Opus 5's real ceiling is 128,000, and no literal can follow a model
# change. Resolution order is Models API -> docs `.md` -> committed snapshot,
# then it RAISES: a hardcoded default here would be the defect it exists to
# remove. `--write` re-baselines `docs/model-limits/snapshot.json` and prints the
# delta, on `kb-skill-score`'s precedent — a record nobody diffs ages silently.
run = "uv run kb-setup model-limits"
raw_args = true

[tasks.kb-graph-counts]
description = "Print graph.json's node/link/hyperedge counts (+ --by-source)"
# The seam `kb_setup.graph_counts` never had. It had callers and a ledger but no
# way to ASK it anything, so 25 sessions hand-wrote 125 throwaway json probes
# (`kb-distill` candidate #2) — one of which shipped a false "the graph has ZERO
# edges" finding into a handoff, a memory record AND a commit message, because
# graph.json spells it `links` and a `.get("edges", [])` probe returns 0 on a
# perfectly healthy graph. Deciding that spelling once is the whole point.
run = "uv run kb-setup graph-counts"
raw_args = true

[tasks.kb-reclaim]
description = "Report reclaimable disk (docker/ollama/caches/mise/downloads); --apply to reclaim"
# REPORT-ONLY by default and there is no config key that changes that: reclaiming
# needs an explicit `--apply` on every run (`mise run kb-reclaim -- --apply`). A
# deleter whose destructive mode can be armed from a config file is a destructive
# action at a distance, which is precisely what `reclaim.toml` must not become.
# The guard is that per-run flag in argv (`reclaim.main`), NOT mise's `--`
# separator: probed 2026-08-21 on a scratch task — and reproduced independently by
# the round-2 cold lane — the old `{{arg(...)}}` template forwarded `--apply`
# WITHOUT `--` exactly as `raw_args = true` does, so the two spellings were always
# the same deliberate act (cold review of 90be7169 / 4343a38a).
#
# Policy lives in `reclaim.toml` — every category can be disabled, re-scoped or
# re-thresholded there, and `--only`/`--skip` narrow a single run. Docker cleanup
# is ONE category, not the tool: adding a reclaimer is a scanner plus a config
# block. See `.claude/skills/kb-reclaim/SKILL.md`.
run = "uv run kb-setup reclaim"
raw_args = true

[tasks.kb-session-reflect]
description = "What did THIS round do by hand that a task already owns? (advisory)"
# The complement to `kb-distill`, not a duplicate of it. distill is a FREQUENCY
# miner: it groups ad-hoc scripts across 50 sessions on their import signature,
# so it answers "was a program written twice?". This asks "what did this ROUND
# do by hand?" — which frequency mining structurally cannot see, because a step
# done once in one session has no frequency to mine.
#
# The gap is measured, not assumed: distill's largest group is 149 hand-written
# mutation harnesses across 21 sessions, every one a fresh scratchpad, and
# `kb-arms` has existed to replace them since #160.
#
# Both read the same transcripts through ONE reader — `distill.tool_uses`, made
# public for this caller — so the format is parsed in a single place.
#
# Advisory by construction: always exits 0 and gates nothing. An un-automated
# step is a statement about future cost, not a failure.
run = "uv run kb-setup session-reflect"
raw_args = true

[tasks.kb-attribute-write]
description = "What ran when a tracked file was written behind our back? (advisory)"
# Built because guessing does not converge. `.codex/config.toml` was rewritten on
# 2026-08-18 (#399) and again on 2026-08-20, and across the two incidents ELEVEN
# candidate writers were refuted by reproduction — every one of them a tool or a
# CLI someone thought of. Not one was it.
#
# This asks the only question with a bounded answer: what was running in the
# seconds around the file's mtime? Its first real run paid for itself — it showed
# the 2026-08-20 write landed in a window with ZERO recorded tool activity, which
# is why probing tools kept refuting.
#
# NOT declared with `{{arg(...)}}`: those are the deprecated Tera helpers of #403.
# mise appends `--` args to the last command when no template function is used,
# which is what `kb-arms` already relies on.
#
# Advisory, and in no gate. It produces CANDIDATES; a row near the mtime is a
# lead to reproduce, never an attribution.
run = "uv run kb-setup write-attribution"

[tasks.kb-distill]
description = "Propose skill/task/module candidates from this session's throwaway scripts (#219)"
# The PRODUCING half of Ray's directive; `kb-skill-lint` is the policing half.
# Detects the one act #160 records as this repo's costliest repeated manual
# step — writing a throwaway script and running it — rather than mining command
# frequency, which was measured over 60 real transcripts and REFUTED (git and
# grep top every threshold). Evidence: `.agent/kb/reports/agents/distill-detection-probe.md`.
# NEVER A GATE, and it is in none: an undistilled probe is a signal about future
# cost, not a build failure. A LEAD exits 0 — that is the part "never a gate"
# protects. This comment read "ALWAYS rc 0" until #270, which was a promise the
# code stopped keeping in the one case that matters: NO TRANSCRIPTS FOUND now
# exits `Rc.NOT_RUN` (127), because the detector did not run and the module was
# already PRINTING "this is not a clean result" while returning success.
# `-- --limit N --min-scripts N` to vary the bounds.
run = "uv run kb-setup distill"

[tasks.kb-arms]
description = "Run a mutation-arm spec: mise run kb-arms -- <spec.toml> [--dry-run] (#160)"
# NOT A GATE, and deliberately in no gate: it MUTATES tracked source files in the
# working tree and restores them, so it appears in neither `kb-gates` nor
# `kb-ship` nor `kb-land`. `kb-distill` is the precedent for a task whose comment
# says outright what it is not.
# It exists because seven successive rounds hand-wrote this harness in a
# scratchpad and three of them lost the `__pycache__` `(mtime, size)` mitigation
# — a same-size mutation is then served the PREVIOUS arm's bytecode, which can
# credit an arm with a death the mutation never caused, i.e. a whole run that is
# worthless while reading green. Logic in `kb_setup.arms`; arms are TOML data.
# `-- --dry-run` validates every arm's pattern against the files without pytest.
run = "uv run kb-setup arms"

[tasks.lint-docs]
description = "Validate agent documentation (agnix)"
# --strict: warnings-as-errors — parity with the hk `agnix` step. agnix exits 0
# on warnings-only, so without it a warning never fails anything (dotfiles #250).
run = "agnix . --strict"

[tasks.check]
description = "Full quality check (lint + test)"
depends = ["lint", "test"]

[tasks.kb-check]
description = "Check specific paths (ruff + format + ty + their tests) with REAL exit codes"
# The DEV-LOOP gate, and the one this repo did not have. `check` above is
# whole-repo and `kb-gates` runs the four ship gates; neither answers "are these
# two files clean?", so that question was being answered in the shell — measured
# at **35** gate invocations piped into `head`/`tail` in a single session
# (2026-08-08), every one of which returns the PIPE's exit code and reports a
# failed gate as a success.
#
# The fix is the mandate, not a shell trick: `session_reflect`'s `piped-rc` used
# to print `<cmd> > /tmp/out.log 2>&1; echo "rc=$?"` as its remedy — shell logic,
# recommended by a repo whose first invariant forbids it, and unfollowable here
# anyway (`${PIPESTATUS[0]}` is a BASH array; this shell is zsh, where it expands
# to empty for a passing and a failing gate alike). `subprocess.run().returncode`
# has no such problem.
#
# Runs every applicable tool even after one fails, so one pass tells you
# everything wrong with the file. Exits non-zero if any tool failed AND if
# nothing applicable was given — "I did not understand your argument" must not
# read as "your file is clean".
run = "uv run kb-setup check"
raw_args = true

# ---------------------------------------------------------------------------
# Knowledge-base tasks — the reason this repo exists
# ---------------------------------------------------------------------------
[tasks.kb-build]
description = "Reproduce graph.json from committed inputs (manifests + doc extractions) — deterministic, no LLM"
# Clones each sources/*.manifest at its pinned SHA (gitignored), AST-extracts code
# (free), then replays the committed sources/extractions/*.json doc chunks. No
# host-agent needed — reproduction is free. Logic in kb_setup.graph.
#
# DECIDED 2026-07-29 (Ray): do NOT put mise's task output cache on this task, and
# this comment exists so it is not re-proposed as an obvious win. mise 7.16 ships
# `--task-cache` / `task.cache_dir` / `cache.command_inputs`, and this is the most
# expensive task here, so it looks like the natural candidate. It is not:
#   1. A cache HIT skips the re-clone. This task's whole job is proving the corpus
#      reproduces from committed inputs, and a manifest whose pinned SHA was
#      force-pushed away would go undetected — `persistence-gate-retry.md` lists
#      `reference is not a tree` as a REAL DEFECT signature, not a transient.
#   2. `.currency-stamp.json` would be restored from cache, asserting a build that
#      never ran in this environment. `currency.toml` requires that stamp to record
#      the version that ACTUALLY RAN, "never the pin, which would launder drift".
#   3. Each entry stores a ~119MB graph.json.
# It trades "reproducible, verified by doing it" for "we did it once and
# remembered" — and two of the three task-freshness fixes in our own
# `min_version.hard` floor were cache-correctness bugs. The objection is
# correctness, so a speedup measurement cannot answer it.
run = "uv run kb-setup build"
# Bound: re-clones EVERY sources/*.manifest at its pinned SHA, so it is network-bound; a transient stall here is the case persistence-gate-retry.md is about, and this bound turns an indefinite hang into a retryable failure. See [tasks.lint] for the measurement behind this key.
timeout = "180m"

[tasks.kb-detect-census]
description = "Emit a read-only complete-source Graphify detection receipt"
run = "uv run kb-setup detect-census"

[tasks.kb-update]
description = "Advance a source to latest upstream + incrementally re-extract: mise run kb-update -- <name>"
# Bumps the manifest SHA to upstream HEAD, re-clones, `graphify update` (incremental
# AST, free). Changed DOCS still need a host-agent pass in a Claude session.
run = "uv run kb-setup update"

[tasks.kb-watch]
description = "Re-extract THIS repo's own code (python/ + tests/) into the aggregate graph + restamp"
# NOT a watcher, despite the name it inherits from `graphify watch`. That
# subcommand rebuilds only <path>/graphify-out/graph.json and exposes no
# post-rebuild hook, so it cannot refresh the aggregate graph `affected` reads.
# One-shot RECOMPOSITION since #175: re-extracts our code (AST-only, free), then
# recomposes the aggregate from `.compose-manifest.json`'s recorded inputs plus
# the `.merged-chunks.json` ledger of between-build kb-merges — refusing, by
# name, any ledger entry it cannot verify rather than silently dropping it.
# Logic in kb_setup.graph.refresh_self.
run = "uv run kb-setup watch"

[tasks.kb-prose]
description = "Derive graphify-out/graph-prose.json (the graph minus the code-AST mass)"
# A pure function of graph.json, so `kb-build` already writes it; this task is
# for re-deriving it alone after a graph that predates it. Logic in kb_setup.prose.
run = "uv run kb-setup prose"

[tasks.kb-query]
description = 'Query the graph: mise run kb-query -- "<q>" [--prose [--budget N] | --idf [--top N]]'
# Deterministic BFS/DFS over the graph — no LLM, source-cited. Thin wrapper over
# `graphify query` (kb_setup.graphify_ops.query) for two reasons: it PINS --graph
# instead of letting graphify resolve it against the process cwd, and it adds
# `--prose`, which points that flag at the derived prose-only graph.
#
# WHEN TO REACH FOR --prose: any question about the DOCUMENTS. The unscoped graph
# is 128,333 nodes of which 126,228 are code AST, and `graphify query` truncates
# at its token budget before you see a line — so a doc question competes against
# ~60x its own mass and loses. Measured 2026-07-25 over the golden set: natural
# phrasings scored 1 of 8 pairs unscoped and 3 of 8 prose-scoped, and a missed
# target on the full graph was absent from the ENTIRE returned list, not merely
# ranked low. Queries also drop from ~9.5s to ~0.3s. Use the unscoped form when
# the question is about the source repos' code.
#
# --idf IS THE BEST ARM as of #12 P1 (2026-07-26). It reads the same prose graph
# --prose does, but ranks it with our own BM25/IDF scorer (kb_setup.lexical) over
# each node's label + rationale, instead of graphify's printed order — which is
# seed-then-BFS and applies no relevance score TO THE RETURNED SET. It is not
# unscored: `serve.py:275 _compute_idf` is called from `_score_query` at `:468`,
# so graphify ranks the SEEDS by IDF (plus a trigram prefilter and tiered label
# matching) and then walks outward unranked. This comment said "NO relevance
# score at all" until 2026-08-01, which a peer-tool review refuted against the
# installed source. The measured gain below is unaffected. Measured over the golden
# set: natural phrasings 3 of 8 pairs prose-scoped -> 5 of 8 with the scorer
# (mean 0.38 -> 0.62), echo unchanged at 8 of 8, both negatives still clean. It
# never shells out to graphify, so graphify's own flags (--budget, --depth) are
# REJECTED rather than ignored. `--top N` sets how many ranked hits print.
run = "uv run kb-setup query"

[tasks.kb-graphify-contract]
description = "Fail closed unless locked Graphify CLI and reviewed public SDK signatures agree"
run = "uv run kb-setup graphify-contract"

[tasks.kb-graphify-baseline]
description = "Build or verify the pinned Graphify-only deterministic AST candidate"
run = "uv run kb-setup graphify-baseline"

[tasks.kb-graphify-native-extract]
description = "graphify's OWN native deep extraction over the pinned sources/graphify clone; --cluster re-clusters an existing --out tree; --artifacts [view...] regenerates derived views (wiki/graphml/svg/...) over it"
run = "uv run kb-setup graphify-native-extract"
# UNPARKED 2026-08-26, together with the `cli.py` dispatch — the two are one
# gesture, exactly as the park's own note required.
#
# It was REMOVED 2026-08-24 so that three blocking defects reachable ONLY
# through this task and that dispatch could not be reached while they were
# fixed: `--out --dry-run` swallowed the flag and ran a REAL extraction (#479),
# an inherited GRAPHIFY_OUT bypassed the `--out` guard (#480), and the two
# functions that spawn the subprocess had zero coverage — stubbing both to
# `return 0` left all 42 tests green (#481).
#
# All three are CLOSED. The module now carries 70 tests, four of which drive
# `_run_real`/`_run_cluster` directly.
#
# What the park did NOT have is a mechanism: its restore condition was prose in
# a comment, and nothing in this repo evaluates one. The condition went true
# weeks before anyone noticed, and surfaced only because a `/tmp` sweep for an
# unrelated reason walked past it. That is #519, and it is the durable defect —
# this park was just where it showed.
#
# No timeout here, deliberately — this is a multi-hour run that stays serial by
# default (see the module docstring's GRAPHIFY_CLAUDE_CLI_PARALLEL section for
# what --allow-parallel-claude-cli does and does not establish) and the caller
# bounds it, not this task. It stays a foreground `--dry-run`-first invocation a
# human is watching. `--cluster` and `--artifacts` are instant relative to
# extraction and are untimed for the same reason.
#
# NOT in GATE_TASKS and never should be: it spends model tokens.

[tasks.kb-skillopt-contract]
description = "Verify the exact SkillOpt VCS provenance, reviewed API/CLI, lock, and isolated mock dry-run"
run = "uv run kb-setup skillopt-contract"

[tasks.kb-skillopt-reviewed]
description = "Stage a reviewed-ledger-only SkillOpt mock or handoff run under .agent/skillopt"
usage = '''
arg "<packet>" help="Content-addressed reviewed ledger packet"
arg "<target>" help="Content-addressed project target descriptor"
arg "<backend>" help="Confined backend" choices "mock" "handoff"
arg "<review_receipt_sha256>" help="Out-of-band trusted review receipt digest"
'''
run = "uv run kb-setup skillopt-reviewed --packet ${usage_packet?} --target ${usage_target?} --backend ${usage_backend?} --review-receipt-sha256 ${usage_review_receipt_sha256?}"

[tasks.kb-source-groups-check]
description = "Validate the typed Graphify ecosystem source registry"
usage = '''
arg "[path]" help="Source-group TOML (defaults to sources/groups/graphify-ecosystem.toml)"
'''
run = "uv run kb-setup source-groups-check{% if usage.path is string and usage.path != '' %} {{ usage.path | quote }}{% endif %}"

[tasks.kb-ecosystem-discovery-plan]
description = "Emit bounded GitHub searches for Graphify consumers and alternatives"
usage = '''
arg "[alternatives]" var=#true help="Optional alternative technology names"
'''
run = "uv run kb-setup ecosystem-discovery-plan{% for alternative in usage.alternatives %} {{ alternative | quote }}{% endfor %}"

[tasks.kb-artifact-download]
description = "Plan or apply one immutable provider artifact transfer with an atomic receipt"
usage = '''
arg "<provider>" help="Reviewed provider adapter name"
arg "<source>" help="Credential-free owner/repository identifier"
arg "<revision>" help="Full immutable 40-character revision"
arg "<destination>" help="Project-local artifact destination"
arg "[mode]" help="Plan by default; apply explicitly transfers" choices "plan" "apply"
arg "[receipt]" help="Optional receipt path"
'''
run = '''
uv run kb-setup artifact-download --provider ${usage_provider?} --source ${usage_source?} --revision ${usage_revision?} --destination ${usage_destination?}{% if usage.receipt is string and usage.receipt != '' %} --receipt {{ usage.receipt | quote }}{% endif %}{% if usage.mode == "apply" %} --apply{% endif %}
'''

# One job per checked-in msgspec model (source-groups, fetch-receipt,
# session-select, research-record), declared in `[tool.datamodel-codegen]` in
# pyproject.toml — nothing here names a schema or an output path. `--project .
# --locked --group codegen` IS the version guard the four deleted wrappers used
# to assert by hand (#569): `--locked` refuses to run when `uv.lock` disagrees
# with `pyproject.toml`, and the binary is resolved from the locked environment,
# never `$PATH` — so a stale mise-global/pipx `datamodel-codegen` shadowing the
# pin can no longer run silently. Dropping any part of that trio reopens the
# shadow class this replaced.
[tasks.kb-codegen]
description = "Regenerate every strict msgspec model from its JSON Schema"
run = "uv run --project . --locked --group codegen datamodel-codegen --all-jobs"

[tasks.kb-codegen-check]
description = "Fail if any generated model differs from its schema"
run = "uv run --project . --locked --group codegen datamodel-codegen --all-jobs --check"

[tasks.kb-research-trackers]
description = "Search one repository's GitHub issue and pull-request trackers"
run = "uv run kb-setup research-trackers"
timeout = "10m"

[tasks.kb-research]
description = "aggregated-research plugin CLI: mise run kb-research -- <verb> [args...]"
run = "uv run aggregated-research"
timeout = "10m"

[tasks.kb-plugin-validate]
description = "Validate a Claude Code plugin marketplace checkout: mise run kb-plugin-validate -- <marketplace root>"
run = "uv run kb-setup plugin-validate"
timeout = "5m"

[tasks.kb-affected]
description = 'Reverse dependencies of a symbol: mise run kb-affected -- "<symbol>" [--depth N]'
# The question `kb-query` structurally CANNOT answer. `query` is a forward BFS from
# the terms you name; "what breaks if I change this" needs the edges walked
# backwards, which is what `graphify affected` does (reverse traversal over
# DEFAULT_AFFECTED_RELATIONS). Depth defaults to 2 upstream.
#
# It reads the UNSCOPED graph deliberately — this is a code question, so the prose
# graph would be the wrong corpus. And it pins --graph for the same reason kb-query
# does: graphify resolves its default against the process cwd, so an unpinned run
# answers from whichever corpus happens to sit under it.
#
# Why a task at all, when the guard already allows a bare `graphify affected`:
# `graph.refresh_self` exists SO THAT this question is answerable about our own
# code (graph.py:230-240 says so), and until now there was no verb — a capability
# built and never wired. `mise-tasks-only.md`: a recurring workflow ships as a task.
run = "uv run kb-setup affected"

[tasks.kb-code-intel]
description = 'Provenance-tagged code-intel edges (mise task/skill/dispatch/config -> Python): mise run kb-code-intel [-- --lanes a,b --out PATH --format chunk|json]'
# This repo's graph indexes Python AST ONLY — no nodes for mise tasks, skills,
# or config files, so "what task reaches this function?" goes unanswered and
# the entry-point diagram Ray keeps asking for is hand-drawn and goes stale
# (#276). Every edge here is PROVENANCE-TAGGED (MISE_TASK/SKILL_FENCE/
# CLI_DISPATCH/CONFIG_READ/TY_LSP) and carries `verified` — issue #276's own
# requirement, because an untagged edge set merged into a 736 MiB aggregate
# graph is unreviewable. The TY_LSP lane is STUBBED (always finds 0) pending
# the backend decision from #276's Serena evaluation; the other four are
# static reads (subprocess/AST/regex), all `verified=True` by construction.
#
# Read-only and writes NOTHING under graphify-out/: emitting a chunk is in
# scope, merging it into the aggregate graph is a separate, later step. Not in
# `_GRAPH_WRITERS`, so no pinned-graphify preflight — same class as
# `kb-affected`, not `kb-build`. Logic in kb_setup.code_intel.
run = "uv run kb-setup code-intel"

[tasks.kb-insights]
description = 'Print what the graph already computed: surprises, questions, god nodes, provenance audit'
# graphify computes surprises/questions/gods/cohesion on every cluster-only/label run
# and writes them to graphify-out/.graphify_analysis.json — a file nothing in this repo
# has ever read. The MCP server exposes three of them, but its resource handlers render
# ONE FIELD EACH (serve.py:1826-1862), discarding the score/why on a surprise and the
# type/why on a question. The sidecar keeps the full dicts, so reading it beats paying a
# subprocess to throw the useful part away.
#
# Two measured constraints, both in kb_setup.insights' docstring: the sidecar can be
# arbitrarily stale with nothing to say so (#138 — measured 3 days behind, describing a
# corpus 2.4x smaller), so this reports figures AND their staleness; and the provenance
# audit is computed by STREAMING graph.json scoped to the `links` array, because a
# whole-file count of `"confidence":` over-counts — five AST nodes carry the field.
run = "uv run kb-setup insights"

[tasks.kb-telemetry-prune]
description = "Bound the raw-API-body telemetry sink (.agent/telemetry/) by size, then age"
# The other half of enabling `OTEL_LOG_RAW_API_BODIES` (Ray, 2026-08-17: maximum
# capture). That sink writes the ENTIRE conversation on EVERY request and nothing
# in Claude Code rotates it, so a long round costs O(n^2) bytes in one day.
#
# SIZE first, age second — an age-only rule cannot see a single round that wrote
# gigabytes today. `kb-reclaim` cannot own this: it refuses by design to act
# inside the repository, and that refusal is worth keeping.
#
# Wired into SessionSTART, not SessionEnd, and that is not a preference. Every
# SessionEnd hook shares ONE budget — "the overall budget is automatically raised
# to the highest per-hook timeout configured in settings files, up to 60 seconds"
# (hooks.md:2948, re-probed live at 2.1.234, control: `SessionEnd` x15 on the
# same page). It is 60 s across ALL of them, not 60 s each, and
# `currency.toml`'s `sessionend-hooks-share-a-1.5s-budget` calls that number
# load-bearing for the transcript audit. A third consumer would have competed
# with the audit for it, and a killed SessionEnd hook is SILENT — the failure
# mode is an audit that quietly stops existing.
#
# Start is also the better moment on its own merits: the sink writes DURING a
# session, so reaping first bounds the directory ahead of the growth rather than
# after it.
#
# Always exits 0: a hook that can fail a session over disk tidiness is a hook
# people turn off.
run = "uv run kb-setup telemetry-prune"

[tasks.graph-size]
description = "Gate: is graph.json still small enough for graphify to READ it?"
# A SHIP GATE, not a report, and that is the whole change (Ray, 2026-08-17).
# `kb_setup.insights` computed this number for a while and only PRINTED it, so
# the figure lived in a report nobody runs on the way to a merge while the graph
# climbed to roughly three quarters of its ceiling.
#
# Whose number is whose: 512 MiB is graphify's stock cap, above which it REFUSES
# to read the file; 1 GiB is OURS, raised by `GRAPHIFY_MAX_GRAPH_BYTES` above,
# where the comment says plainly that the raise is a ratchet and the durable
# answer is #130 (federate) or #120 (the duplicated `repo::` prefix). Both open.
# The 80% warning line is ours and is the only chosen number — a gate that fires
# only AT the ceiling forces the decision when there is no headroom left to act.
#
# The effective ceiling comes from graphify's OWN resolver, never a second parser
# here: its `GB` suffix means GiB, so a hand-rolled reading agrees on the string
# and disagrees on the number by 7%.
run = "uv run kb-setup graph-size"

[tasks.funnel]
description = "Gate: did this branch's research reach the corpus (sources/**)?"
# A SHIP GATE for a clause that had lived only in prose: this repo's stated
# purpose is that research it does becomes corpus another session can query.
# Measured on the branch that motivated this task: 33 files added under
# `docs/research/**`/`docs/artifacts/**`, 0 lines under `sources/**` — the same
# round ran `curl` 31 times and wrote into `sources/` zero times.
#
# DRIFT means a docs delta with no `sources/**` delta and no exemption; a
# `Funnel-exempt: <reason>` commit trailer is the only escape hatch, never a
# flag or env var (invisible in history the moment the session ends). See
# `kb_setup.funnel`'s module docstring for the full state table.
#
# Named `funnel`, not `kb-funnel`: `kb_setup.gates.GATE_TASKS` names its members
# by their BARE mise task name (`lint`, `test`, `graph-size`, `hk-test`, …), and
# a `kb-`-prefixed task here would leave `gates.undeclared` refusing every
# `kb-ship` run before any gate executes (`tests/test_gates.py`'s
# `test_ship_gates_are_the_repo_s_real_declared_tasks`).
run = "uv run kb-setup funnel"
# Well under the outer 1800s `gates._GATE_TIMEOUT` — this is a handful of `git`
# subprocess calls against one branch's delta, not a build.
timeout = "60s"

[tasks.kb-serve]
description = "Start the read-only MCP server pinned to THIS graph (stdio)"
# graphify-mcp binds to an ABSOLUTE graph path, so this server only ever serves
# this repo's graph — no collision with other graphify projects. HTTP transport:
# add `-- --transport http --port 8080`.
#
# `raw` is REQUIRED, not a tuning knob: without it mise reads a task's stdio BY
# LINE instead of connecting it, so this stdio MCP server hit EOF on its first
# read and exited — rc=0, empty stderr, no reply to `initialize`. Measured
# 2026-08-02: `mise run kb-serve` served NOTHING while `graphify-mcp <same abs
# path>` answered in 9.8s and `mise run --raw kb-serve` in 10.8s, so the task —
# the path CLAUDE.md and every rule point consumers at — was the only broken arm.
# A clean exit is why nothing caught it. Proven live by tests/test_mcp_serve.py,
# which speaks real JSON-RPC; asserting this line in mise.toml would only be two
# files agreeing. mise's own docs: "directly connect task to stdin/stdout/stderr".
# Side effect, and a wanted one: --raw disables mise's line-based redaction,
# which would otherwise be free to rewrite bytes inside a JSON-RPC frame.
raw = true
# `kb-setup serve` is a SEAM, not a layer. With neither KB_MCP_TOOLS nor
# KB_MCP_RESOURCES set it runs graphify-mcp with INHERITED stdio — the child holds
# the client's real file descriptors, so no byte of JSON-RPC passes through us and
# the default path adds no failure surface to the data path of a task that was
# itself broken until #105. It only becomes a filtering relay when an allowlist is
# actually set, because graphify offers no `--tools` flag (0.9.31 and 0.9.32,
# control-armed) and Claude Code offers no client-side per-tool filter — server-
# level toggles only.
#
# This comment said `execvpe`s ... this process is replaced until 2026-08-02. That
# was the first draft and stopped being true when S606 forced `subprocess`. The
# cold lane caught the same false claim in serve()'s docstring and in cli.py; this
# THIRD copy survived because those two were fixed by name instead of grepping for
# the claim. When a reviewer finds an instance, sweep for the class.
run = "uv run kb-setup serve"

[tasks.kb-add]
description = 'Add a URL source then rebuild: mise run kb-add -- <url> [--author NAME]'
# Fetches the URL into sources/ and updates the graph. Repo ingestion uses the
# graphify clone + kb-build flow instead (see CLAUDE.md). GEMINI/GOOGLE keys are
# blanked so graphify's backend auto-detect can NEVER pick a non-Claude backend
# (Claude-Code-only mandate); the no-key fetch path uses no LLM anyway.
env = { GEMINI_API_KEY = "", GOOGLE_API_KEY = "" }
run = "graphify add"

[tasks.kb-fetch]
description = 'Losslessly fetch a URL into sources/: mise run kb-fetch -- <url> [--stem NAME]'
# Bypasses `graphify add <url>`, which truncates at markdown[:12000] after a
# no-boilerplate markdownify pass (graphify 0.9.25 ingest.py:159) — measured to
# discard 86-89% of a long reference page, silently, exiting 0. This task prefers
# the upstream authored source, falls back to the rendered page via trafilatura,
# writes a file, and reports the verbatim-token roundtrip verdict. Hand the
# resulting file to `graphify add <file>`, whose slicing is lossless.
run = "uv run --extra fetch kb-setup fetch"

[tasks.kb-fetch-verify]
description = 'Verify offline page bytes against receipts: mise run kb-fetch-verify -- <sources/*.pages.toml>'
run = "uv run kb-setup fetch-verify"

[tasks.kb-merge]
description = 'Merge one host-agent extraction chunk into the graph: mise run kb-merge -- <chunk.json> [source_root]'
# Wraps _merge_docs.py under graphify's interpreter (Gemini-free env). No LLM —
# build_merge + Louvain re-cluster only. Logic in kb_setup.graphify_ops.
run = "uv run kb-setup merge"

[tasks.kb-label]
description = "(Re)label communities (deterministic, no-LLM, Gemini-free): mise run kb-label [-- --missing-only | --claude-cli]"
# Default = graphify's deterministic hub labeler (no API, no Gemini). GEMINI/GOOGLE
# keys are stripped in kb_setup.graphify_ops.clean_env so Gemini can never be
# auto-selected. `--claude-cli` opts into the claude-cli backend, which is BROKEN
# for labeling (#2076: prose-wrapped JSON graphify can't parse) and falls back to
# deterministic — kept only to re-probe a future graphify fix. Logic in graphify_ops.
run = "uv run kb-setup label"

[tasks.kb-transcribe]
description = "Transcribe a local audio file with graphify's bundled whisper (local, no API): mise run kb-transcribe -- <audio>"
# For a graphify-downloaded yt_*.m4a. Local faster-whisper — no LLM backend. The
# transcript is then host-agent (Claude Code) extracted like any prose source.
run = "uv run kb-setup transcribe"
# Bound: local faster-whisper over a full recording — tens of minutes is NORMAL here, so this bound is deliberately far out. See [tasks.lint] for the measurement behind this key.
timeout = "120m"

[tasks.kb-artifacts]
description = 'Regenerate all derived outputs (wiki/graphml/cypher/html/tree/obsidian/svg): mise run kb-artifacts [-- fmt...]'
# Data-driven registry in kb_setup.artifacts (no copy-paste); ensures output deps
# (scipy for svg) first. All read graph.json; none are committed (regenerable).
run = "uv run kb-setup artifacts"
# Bound: regenerates every derived view over a ~736 MiB graph. See [tasks.lint] for the measurement behind this key.
timeout = "60m"

[tasks.kb-ensure-deps]
description = "Inject output-only runtime deps missing from graphify's env (e.g. scipy for svg on py3.14)"
run = "uv run kb-setup ensure-deps"

# --- self-learning loop (work memory) — record outcomes, aggregate lessons ---
[tasks.kb-remember]
description = 'Record a Q&A outcome to work memory: mise run kb-remember -- --question "Q" --answer-file A.md [--outcome useful|dead_end|corrected --correction-file C.md] [--nodes N1 N2]; --audit reports corrections missing their lesson'
# Appends to graphify-out/memory/ (git-tracked — authored knowledge). The
# kb-curator skill runs this on every ingestion so the corpus self-improves.
#
# Goes through kb_setup.remember rather than straight at `graphify save-result`
# because THIS DESCRIPTION WAS THE BUG. It listed --question/--answer/--nodes/
# --outcome and never mentioned --correction, which `graphify reflect` is the
# sole consumer of: 21 of 32 recorded corrections carry no lesson, and each
# renders in reflections/LESSONS.md as a question followed by an empty arrow.
# The module REFUSES `--outcome corrected` with no correction text, because a
# directive this repo only wrote down was complied with 0 times in 19.
run = "uv run kb-setup remember"

[tasks.kb-reflect]
description = "Aggregate work-memory outcomes into reflections/LESSONS.md + the .graphify_learning.json overlay (deterministic, no LLM)"
# --graph groups lessons by community + tags nodes preferred/tentative/contested.
# reflections/ + overlay are gitignored (regenerable); run each session.
run = "graphify reflect --graph {{config_root}}/graphify-out/graph.json"

# --- second brain (routing seam; see dotfiles docs/specs/second-brain-design.md) ---
# The brain/ vault is its OWN graph (separate from the aggregate — a vault note never
# connects to code structurally, measured). Keys stripped so update stays the FREE
# AST pass and never triggers a paid backend (feedback_kb_graphify_claude_only).
[tasks.brain-update]
description = "Rebuild the brain vault graph from its notes (FREE, no LLM)"
dir = "{{config_root}}/brain"
env = { GEMINI_API_KEY = "", GOOGLE_API_KEY = "", OPENAI_API_KEY = "", ANTHROPIC_API_KEY = "", AWS_REGION = "" }
run = "graphify update ."

[tasks.brain-query]
description = 'Query the brain vault: mise run brain-query -- "<question>" [--budget N]'
# Wrapped: graphify honours --graph only when the question precedes it, but mise
# appends user args LAST — so the wrapper reorders (question first). Logic in kb_setup.brain.
run = "uv run kb-setup brain query"

[tasks.brain-remember]
description = 'Record a verified delegation outcome: mise run brain-remember -- --task-class T --lane L --effort E --verdict clean|rework|failed --session S [--note N]'
# Contract: refuses (rc=2) any record missing a field. Logic in kb_setup.brain.
run = "uv run kb-setup brain record"

[tasks.brain-reflect]
description = "Aggregate outcomes into ROUTING-LESSONS.md (deterministic, >=3 consistent + session-dedup, advisory)"
run = "uv run kb-setup brain reflect"

[tasks.brain-audit]
description = "Fail if any recorded routing outcome is not a closed record (ship-gate precondition)"
run = "uv run kb-setup brain audit"
# Bound: reads recorded outcomes; anything near this is a wedge. See [tasks.lint] for the measurement behind this key.
timeout = "10m"

[tasks.brain-transcript-audit]
description = "ADVISORY: flag sessions that delegated + verified but recorded no routing outcome"
# Mines native session transcripts (no logging hook). Never a gate (rc always 0) —
# the blocking ship-gate is brain-audit. Refreshed each session by a SessionEnd hook
# (-- --output .agent/brain-audit.md). Logic in kb_setup.brain.transcript_audit.
run = "uv run kb-setup brain transcript-audit"

# --- tool currency (the shared engine; see currency.toml + kb_setup.currency) ---
[tasks.kb-currency-check]
description = "Offline drift check: is the installed tooling in sync with the pins? (step 1)"
# Subprocess-free and ~10ms, which is what lets the SessionStart hook run it every
# session. Prints NOTHING when clean, and always exits 0 — a session must never be
# blocked over a version pin. Logic in kb_setup.currency.sync.
run = "uv run kb-setup currency check"

[tasks.kb-currency]
description = 'Full tool-currency workflow (steps 1-4 + 6): mise run kb-currency [-- --tool T --json]'
# Fetches upstream + release notes + tracked-issue movement, applies the six-gate
# bar, and writes the committed report under docs/currency/. Step 5 (the
# AskUserQuestion interview) belongs to the tool-currency skill: only the model can
# ask, so it can never live in a hook or a task. Logic in kb_setup.currency.run.
# ALWAYS exits 0 — an out-of-date tool is a signal, not a failure — so this can
# never serve as a CI gate. Read docs/currency/, not the rc.
run = "uv run kb-setup currency run"

[tasks.kb-tool-sync]
description = "Lock, install, and verify one eligible reviewed mise-only tool pin"
run = "uv run kb-setup tool-sync"

# --- reusable ingestion seams (replace hand-rolled one-offs; logic in kb_setup) ---
[tasks.kb-review-receipt]
description = 'Record that the kb-review skill reviewed HEAD: mise run kb-review-receipt -- --lanes L[,L...] --blocking N [--skipped lane:reason,...] [--findings N] [--fixed-point REF]'
# The LAST step of the `kb-review` skill, and the only part of that review a task
# can own: the review spawns Claude agents, and only the model can do that, so the
# skill runs the lenses and this records that it did. `kb-ship` then refuses to
# push a HEAD with no receipt. Amending or rebasing moves the SHA and invalidates
# the receipt — correctly, the reviewed bytes are gone. Logic in kb_setup.review.
run = "uv run kb-setup review-receipt"

[tasks.kb-ship]
description = 'Review receipt + this branch handoff + gates (lint/test/brain-audit/eval) → push → open PR: mise run kb-ship [-- --title T]'
# The sanctioned way to open a PR here. `gh pr create` is NOT guard-denied in
# this repo — `hook_guard._REDIRECT` covers graphify subcommands only — so this
# is convention, not enforcement, and a raw `gh pr create` would bypass the
# review receipt entirely. Said plainly because the comment used to claim the
# guard stopped it, while `mise-tasks-only.md` correctly said it does not.
# Gates run BEFORE the push, so a red branch never becomes a PR. This repo has no
# CI, so the local gates are the only gates. Between the receipt and the gates it
# runs kb-handoff-check against the NEWEST handoff, and only when that handoff
# records the branch you are on (#149) — otherwise it reports a SKIP, never
# silence. The skip is the ordinary case, because /clear-prep writes the handoff
# after the round. Newest-only rather than newest-that-matches: scanning back for
# a match refuses 8 of the 21 branches this repo's handoffs record, all on stale
# handoffs whose paths later commits deleted. Logic in kb_setup.pr.
run = "uv run kb-setup ship"

[tasks.kb-land]
description = 'Await terminal checks + review receipt → SHA-pinned squash-merge → sync main: mise run kb-land -- <PR#>'
# Pins the merge to the head SHA it just verified (`gh pr merge --match-head-commit`),
# so a commit pushed between check and merge cannot ride in unverified. No main-CI
# watch and no container re-validation — this repo has neither. Logic in kb_setup.pr.
run = "uv run kb-setup land"

[tasks.kb-context]
description = 'Report this session CONTEXT-WINDOW occupancy: mise run kb-context'
# The /clear-prep trigger ("context past ~20% of the window") was UNOBSERVABLE from
# inside a session: the only signal a model gets is `<total_tokens>N tokens left`,
# which is a SPEND BUDGET, not window occupancy. Measured on transcript 672f23a4:
# real occupancy peaked at 475,917 (47.6% of a 1M window) while that reminder read
# 14,981,005/15,000,000 left — 99.9% remaining. A trigger nothing reports can never
# fire. This task is what makes the condition checkable. Logic in
# kb_setup.context_usage. Exit codes are a SIGNAL, never a gate: 0 under, 10 at or
# over the threshold, 3 not the main thread, 127 could not measure.
run = "uv run kb-setup context"

[tasks.kb-manifest-add]
description = 'Pin a new repo source: mise run kb-manifest-add -- <url> [--ref R --kind K --name N --comment C --force]'
# Resolves upstream HEAD via git ls-remote (no clone) + writes sources/<name>.manifest.
# The reusable replacement for hand-writing a manifest. Logic in kb_setup.manifest.add.
run = "uv run kb-setup manifest-add"

[tasks.kb-assemble]
description = 'Validate + combine host-agent extraction chunks: mise run kb-assemble -- <name> <chunk.json>...'
# Union-merges per-source chunks (the kb-extract Workflow fan-out output) into one
# committed sources/extractions/<name>-docs.json, failing loud on any schema/dangling/
# id-collision problem. Logic in kb_setup.chunks.assemble.
run = "uv run kb-setup assemble"

[tasks.kb-skill-score]
description = 'Score project skills with plugin-eval (static layer, no LLM): mise run kb-skill-score [-- [--write] <skill>...]'
# ADVISORY on its FINDINGS — a score never fails a gate, same posture as kb-currency
# and kb-goal-check. No floor is enforced; Ray's call 2026-08-03 was "advisory now,
# ratchet later". It DOES exit 2 for a malformed request — a skill name matching
# nothing, or --write with names (which would clobber the other skills' baseline) —
# exactly the split currency.run draws for an unknown --tool, because a silent 0
# hides a typo. Wires ONLY plugin-eval's layer 1 (pure python, no
# LLM, deterministic) because only a free deterministic score is comparable run to
# run; the judge and Monte-Carlo layers stay a by-hand `--depth standard`/`certify`.
# `-- --write` records docs/skills/baseline.json + README.md (committed), and every
# later run prints a Δ against it: an absolute score has no floor behind it, so the
# movement is the only reading that means anything.
# Names WHICH plugin-eval copy scored you — the marketplace install and this repo's
# pinned wshobson/agents clone can differ, and two scores from different scorers are
# not comparable. Logic in kb_setup.skill_eval.
run = "uv run kb-setup skill-score"

[tasks.kb-skill-refresh]
description = "Regenerate the vendored graphify skill from the PINNED graphify, restoring what the installer must not own (#133)"
# `.claude/skills/graphify/**` is GENERATED by `graphify install --project`, so a
# version bump leaves it stale until the generator runs again — it sat at 0.9.32
# under a 0.9.34 pin for two bumps. Copying the files out of the pinned clone was
# the obvious wrong answer (`use-tool-builtins.md`): the generator exists.
#
# The wrapper is not optional. Every installer run regresses `.claude/settings.json`
# three ways (#133): both graphify hooks rewritten to an ABSOLUTE version-frozen
# `pipx-graphifyy/<ver>/bin/` path — machine-specific, and it freezes a version into
# committed config so the hook stops following the mise pin — `"timeout": 15`
# dropped from both, and the trailing newline stripped (which fails hk's `newlines`
# step with a cause nobody would connect to the installer).
#
# Restores are REPORTED, never silent: each protected file goes back to its
# pre-install bytes AND the reverted delta is captured (before the revert — after
# it there is nothing left to diff) and printed, so a future graphify that
# legitimately adds a hook cannot have it discarded with only a filename recorded.
#
# THREE files are protected, and `_REPAIR` in kb_setup.currency.skill is the list:
# `.claude/settings.json`, the ROOT `CLAUDE.md`, and `.claude/CLAUDE.md`. The
# installer writes all three (`install.py:1708` the root one, `:263`/`:629` the
# `.claude/` one), and both markdown files are hand-authored and sit at their
# `md_size_budget`, so an installer append breaks a gate rather than merely
# churning bytes.
#
# Refuses to run on a graphify that disagrees with the pin, via the same
# `assert_pinned_graphify` the graph writers use: generating the skill from a stale
# binary produces exactly the drift this task removes, while LOOKING like a refresh.
# That gate is at THIS entry point and deliberately NOT inside
# `kb_setup.currency.skill`, which does the actual refresh: `currency.apply` writes
# the NEW pin and then calls that module, so a gate there would refuse every bump.
#
# Exits non-zero on either kind of surviving damage — a lost local addendum, or an
# installer rewrite the repair could not revert — because the last thing it prints
# is "go review the diff and commit".
# Logic in kb_setup.skill_refresh over kb_setup.currency.skill.
run = "uv run kb-setup skill-refresh"

[tasks.kb-handoff-check]
description = "Verify a handoff's claims — paths (incl. mistyped extensions and elided report names), file:line, task names, gate results: mise run kb-handoff-check [-- <path>]"
# Replaces the by-hand half of /clear-prep step 6, which asks the agent that WROTE
# the handoff to verify it from memory at the end of a long session — and which
# already failed that way (`:1836` written for `:1830`, propagated into three
# files). With no argument it checks the newest .agent/plans/session-*.md.
# STRICT about wrongness (a broken path / a file:line past EOF / a task this repo
# does not declare exits 1), ADVISORY about ambiguity (a bare filename matching
# several files is reported and exits 0), and 2 on a malformed request — the same
# split kb-skill-score draws. Task names are checked against THIS repo's mise.toml
# and never against `mise tasks ls`, which merges the user's global config and so
# reports strictly more tasks than this file declares — the exact count is in
# kb_setup.resolve.declared_tasks and is deliberately NOT repeated here, because
# both totals move every time this file gains a task. Logic in kb_setup.handoff,
# over the reusable kb_setup.citations + kb_setup.resolve primitives.
# GATE CLAIMS are checked too (#147): every `<task> rc=<n>` is read back against
# `.agent/kb/gates/gates-<sha>.json`, the record kb-gates writes. A claim binds to
# the commit named in its OWN bullet/paragraph — not the nearest sha above it,
# which would let a gotchas paragraph vouch for a gate list. The strict/advisory
# split holds: the record CONTRADICTING a claim exits 1, while "no record at that
# commit" is UNVERIFIABLE and exits 0, because `.agent/` is machine-local and a
# fresh clone has no records at all — failing there would break the checker in
# exactly the situation it exists for.
run = "uv run kb-setup handoff-check"

[tasks.hk-test]
description = "Gate: run hk's step-defined tests (both directions per builtin) and refuse a run that tested nothing"
# NOT `run = "hk test"`. hk exits 0 when its filter matches nothing (measured:
# `hk test --name definitely-no-such-test` -> rc=0, no output), so a bare seam
# would report green having asked no question the moment the config stopped
# declaring testable steps. `kb_setup.hk_test` asserts a floor on the number of
# tests that ACTUALLY RAN before it looks at hk's exit code, which is the only
# ordering that can tell "all passed" from "there were none".
#
# What it buys: 46 tests, all shipped by the builtins, every one a bad-file/
# good-file PAIR. That is the FAIL direction of each linter, proven in under a
# second — the hand-work `ci-local-parity.md` rule 6 asks for on every new step.
run = "uv run kb-setup hk-test"
timeout = "10m"

[tasks.kb-gates]
description = "Run the gates and record each result durably: mise run kb-gates [-- <task>... --stop]"
# The other half of /clear-prep step 5. That step already tells you to redirect a
# gate to a file and record `rc=$?` — so in-session the check is performable; what
# nothing does is ENFORCE that it ran, and the /tmp log dies with the session. The
# failure is an EXPIRED artifact, not an absent one. This writes
# .agent/kb/gates/gates-<sha>.json, beside the kb-review receipt and with the same
# durability: survives the session, dies with the clone.
# Does NOT stop at the first failure — the point is to learn every gate's state in
# one pass. `-- --stop` opts into the ship path's behaviour. Exits 1 if any gate
# failed, 2 if a named gate is not declared in mise.toml or HEAD cannot be read.
# kb-ship calls the SAME run+record functions with the flag on, so the record and
# the push decision cannot disagree. Logic in kb_setup.gates.
run = "uv run kb-setup gates"

[tasks.kb-session-select]
description = "Resolve WHICH session transcripts a run covers: mise run kb-session-select -- (--current | --sessions <id>... | --last N | --since <ISO> [--until <ISO>])"
# The deterministic half of the session-review seam (#344). The agent fan-out
# cannot be a task -- it needs a live model -- but SELECTION can, and until now
# it was done in the head of whichever session typed the workflow's arguments:
# a transcriptDir string plus a `since` date, unvalidated, re-derived per round.
# `Date.now()` THROWS inside a Workflow script, so time arithmetic was always
# going to live outside it; this is that outside, made testable.
# started_at is BIRTHTIME cross-checked against the transcript's own first
# timestamped record -- never mtime. Measured 2026-08-18: 20 of 238 transcripts
# carry a birth-to-mtime gap over 24h, worst 119.6h, because a resumed session
# is appended to long after it began. Every record says which clock it used.
# An empty resolution exits 127 (NOT_RUN), never `[]` with rc 0 -- a glob that
# matches nothing looks exactly like a round with no sessions.
run = "uv run kb-setup session-select"

[tasks.kb-session-review-archive]
description = "Archive a session-review run's return into docs/session-review/runs/<date>-<n>/ and regenerate the README: mise run kb-session-review-archive -- --run-json PATH [--report-dir DIR] [--handoff PATH] [--date YYYY-MM-DD] [--dry-run]"
# The other half of "every session-review run always leaves a detailed
# report" (session-review.js). Until now docs/session-review/runs/<date>-<n>/
# was assembled BY HAND for every run, and the failure that motivated this task
# already happened twice on the same root cause: a fresh run with no dated
# reportDir argument defaults to the SAME shared `.agent/kb/reports/agents`
# root as the previous one, so the next run's lane reports overwrite the prior
# run's before anyone gets around to archiving them (#431).
# REFUSES rather than partially archiving: no synthesis on disk at the report
# dir is rc 2 with NOTHING written -- "a run always leaves a report" is the
# contract this task exists to enforce, not merely document. An existing
# destination directory is rc 2 too, never a silent merge. Staged into a
# `.archive-*` temp sibling and only renamed into place once every copy has
# succeeded, so a killed run leaves no partial destination.
# Every copy is VERBATIM bytes (read_bytes -> write_bytes) -- this is the other
# half of `docs/session-review/runs/**` being formatter-exempt in hk.pkl's
# proseExclude; a copy that reformatted what an agent wrote would defeat the
# exclusion at the point of ingest rather than the point of lint.
# `--dry-run` reports the plan (destination name, files that would copy, lane
# reports that are missing) without writing anything. Logic in
# kb_setup.session_review_archive.
run = "uv run kb-setup session-review-archive"

[tasks.kb-session-state]
description = "Print the session's working state as a paste-ready handoff block: mise run kb-session-state [-- --no-pr]"
# Replaces the by-hand half of /clear-prep step 1, which asks an agent to run four
# commands (branch, status, log, PR) and reformat them into a handoff every
# session. Four chances to transcribe something, and this repo has already paid
# for that class twice: a file:line read off a sed window by eye (:1836 for
# :1830, propagated into three files), and a PR number read out of a mise run log
# where redaction had masked digits mid-number (pull/[redacted]59).
# ALWAYS exits 0 for what it finds — a snapshot reports, it never gates; 2 only
# for a request that cannot be honoured (an unknown flag).
# A FAILED gh LOOKUP IS ITS OWN STATE and never renders as "no open PR" (#144):
# gh unreachable, rate-limited or unauthenticated is not evidence that no PR
# exists, and a handoff asserting "0 open PRs" on a question nobody managed to ask
# is exactly what kb-handoff-check exists to catch. `-- --no-pr` skips the network
# call entirely and reports the PR state as unverifiable-because-not-asked.
# READ THE BLOCK FROM AN UNREDACTED RUN, and it is NOT only the branch: mise
# masks digit runs matching the user's secrets, so this task mangles the branch,
# every commit SHA and every issue/PR number — feat/144-… prints as
# feat/[redacted]44-… and 90e2591cda13 as 90e259[redacted]cda[redacted]3. The
# SHAs are the worse half; they key the kb-gates records and kb-review receipts.
# That is the very defect this task exists to remove, arriving via the transport,
# and it is the advisory eval case tier1.mise-redaction-legible. Copy from
# `uv run kb-setup session-state` (same code, no redaction layer); the cause is
# the user's mise config, which do-not.md #11 forbids this repo from editing.
# Gathering and rendering are separate functions so a caller can read the state
# without the markdown. Logic in kb_setup.session_state.
run = "uv run kb-setup session-state"

[tasks.kb-next-ticket]
description = "Print the tracked chain's next ready ticket, or why not: mise run kb-next-ticket"
# Interactive use only. `/clear-prep` calls `uv run kb-setup next-ticket` directly,
# never this task — same reason as kb-session-state above: mise's output
# redaction mangles digit runs, and this task's whole output is issue numbers (#574).
# Reads docs/roadmap/aggregated-research-chain.toml (the ORDERING) against the
# tracker's live issue state (the STATUS), via one batched `gh api graphql` call,
# and reports exactly one of three states on its first line — READY, BLOCKED, or
# COULD NOT ASK — reusing #144's decision that a failed tracker lookup is its own
# state and never renders as "nothing ready". Never skips a blocked ticket to
# report a later one instead. Logic in kb_setup.next_ticket.
run = "uv run kb-setup next-ticket"

[tasks.kb-goal-check]
description = 'Mechanically check a /goal goal+rider pair: mise run kb-goal-check -- <path|pair-prefix|--text "...">'
# ADVISORY — always exits 0. A goal document is authored input, not repo source, so a
# WARN-level heuristic must never block a PR (same posture as kb-currency: read the
# report, not the rc). Owns only the tests decidable WITHOUT a model; the judgement
# tests live in the `goal-engineering` skill. Logic in kb_setup.goal.
run = "uv run kb-setup goal-check"

[tasks.kb-goal-outcome]
description = 'Record how a /goal round actually went: mise run kb-goal-outcome -- <pair> --result achieved|cleared|stalled|blocked [--turns N] [--note "..."]'
# The half that makes the goal-engineering skill self-improving: everything else
# encodes HYPOTHESES about what makes a goal work; only an outcome tests one.
# Writes through kb-remember + kb-reflect (one memory writer, one format) and
# flips the Status cell in docs/goals/README.md. Logic in kb_setup.goal.
run = "uv run kb-setup goal-outcome"

[tasks.kb-validate-chunks]
description = 'Schema + edge-direction check on extraction chunks: mise run kb-validate-chunks -- <chunk.json>...'
# Standalone gate over sources/extractions/*.json (or scratch chunks). Logic in
# kb_setup.chunks (schema, unique ids, no dangling edges, cross-chunk source_file
# ownership) plus kb_setup.edge_direction (self-edges, cycles in part_of/requires/
# depends_on, a symmetric contrasts_with emitted both ways). The direction half
# reports SEMANTIC direction as unchecked rather than implying it is covered —
# `bun_requirement requires channels` is backwards and trips none of it.
#
# PASS THE WHOLE CORPUS, not one chunk. Cycles and both-way symmetric edges are
# checked over the UNION of every chunk given, because that is what graphify
# merges — `a requires b` in one file and `b requires a` in another is a real
# cycle that neither file contains alone, and a per-file run reports both green.
run = "uv run kb-setup validate-chunks"

[tasks.cc]
description = "Launch Claude Code rooted in THIS repo with a VERIFIED environment (tmux, --add-dir dotfiles, auto mode)"
# raw: mise normally captures a task's output to prefix it with [cc], which leaves
# the child with NO TTY — tmux then dies with "open terminal failed: not a
# terminal".  connects stdin/stdout/stderr straight through, which an
# interactive session requires. Without it this task can never attach.
raw = true
# Thin BY DESIGN. Every decision — PATH hygiene, the tmux env injection, and a
# preflight that can REFUSE — lives in `kb_setup.launch`, shared by both repos so
# the two launchers cannot drift. That module's docstring carries the
# measurements; the short version:
#
#   * a stale `mise/installs/<tool>/<ver>/bin` entry can shadow the shims and
#     does NOT follow the pin (MISE_ENV_CACHE freezes it), so the whole CLASS is
#     stripped rather than a named version — naming one is how the previous
#     guard went inert;
#   * tmux hands a NEW session the SERVER's environment, not the caller's, so
#     the verified PATH is injected explicitly via `new-session -e PATH=...`;
#   * it REFUSES to launch unless graphify resolves through the shims AT this
#     repo's pinned version. A corpus rebuilt by one version and stamped with
#     another is unfalsifiable afterwards, and that is the one failure this
#     queue cannot absorb.
#
# `--root "$MISE_PROJECT_ROOT"` is NOT optional: the CLI otherwise derives the
# root from the CWD, and inside a mise task the CWD is wherever mise was invoked
# from, not the repo (measured). Session name: CC_TMUX_SESSION, default the repo.
# Single-quoted TOML so the inner double quotes need no escaping.
run = 'uv run kb-setup cc --root "$MISE_PROJECT_ROOT" --sibling "$MISE_PROJECT_ROOT/../dotfiles"'

[tasks.cc-doctor]
description = "Verify the CURRENT session's environment (graphify resolution, sibling, hook paths)"
# The standing version of the by-hand Phase A sweep. It judges the RAW PATH, not a
# cleaned one — cleaning first would launder the very drift it looks for, which is
# how #40 stayed invisible to `preflight` (that one cleans first, correctly, because
# it is about to hand a cleaned PATH to a child; this one reports reality).
#
# Raw, but of the SESSION's PATH — never this task's. `mise run` injects every tool
# install dir into a task's environment and `uv` then resolves to a mise shim, which
# re-prepends them; judging our own PATH made the graphify check unable to report
# green here, ever. The session is found via `CLAUDE_PID` and its environment read
# from the OS (`kb_setup.launch.session_path`); when that cannot be read the check
# is UNKNOWN, not a guess. `--path "$PATH"` from a shell overrides it explicitly.
#
# DO NOT "simplify" this to mise's own `{{ get_env(name='PATH') }}` in a task `env`
# block. It is documented as returning "the original process environment" and it
# does — but it is bound to PRISTINE_ENV, which reverses __MISE_DIFF and REMOVES
# every path mise added. Under an activated shell that is precisely the install
# dirs this check hunts, so it launders the drift away. Measured 2026-07-27 with a
# caller PATH carrying both a sentinel and a stale install dir:
#
#   activated shell : entries 5, installs 0, sentinel present   <- laundered
#   env -i          : entries 5, installs 1, sentinel present   <- intact
#
# The published proof of `get_env` used `env -i`, where there is no __MISE_DIFF to
# reverse and nothing is stripped. The CONDITION was the whole finding: correct
# where it was measured, wrong here. Same defect class as `clean_path` in this
# position — a check that cannot fail.
#
# Two of the five checks print `?`, not `✔`: which skills a session can see and
# which permission mode it is in are facts only the session holds, and asserting
# them from a subprocess would be a probe with one face. Non-zero on any FAIL;
# UNKNOWN never fails the run and is never rendered green.
run = 'uv run kb-setup cc-doctor --root "$MISE_PROJECT_ROOT" --sibling "$MISE_PROJECT_ROOT/../dotfiles"'

[tasks.cc-fresh]
description = "Kill the stale tmux server, then launch a session whose env is built from scratch"
# The remedy `cc-doctor` and `preflight` both name. A tmux server outlives the pin
# that was current when it started, and a pane inherits the PATH of the client that
# created it — so a long-lived server is the usual reason a session's environment
# disagrees with this repo. RUN IT FROM A PLAIN TERMINAL: it refuses inside tmux,
# where killing the server would kill the process before it could relaunch.
raw = true
run = 'uv run kb-setup cc --fresh --root "$MISE_PROJECT_ROOT" --sibling "$MISE_PROJECT_ROOT/../dotfiles"'
