# gitleaks config for the KB. This repo INGESTS external content — the cloned
# source repos under sources/ and the derived graphify-out/ cache are research
# data that inherently contain secret-LIKE strings (leaked prompts, fixture
# keys), so scanning them is pure noise. Scan the real, tracked repo files.
title = "kb-gitleaks"

[extend]
useDefault = true

[allowlist]
description = "ingested corpus + DERIVED graphify artifacts — noise by construction"
# WAS `^graphify-out/`, on the stated premise that none of it "is ever
# committed". That premise is FALSE and always was: `graphify-out/memory/` is
# the ONE committed subdirectory of an otherwise derived tree (CLAUDE.md
# invariant 5, .gitignore). So the scanner was configured to look away from the
# one place in that tree where a secret of OURS could land — and on 2026-07-28
# one did: `kb-remember` wrote a work-memory note ABOUT a credential leak with
# the probe output pasted in verbatim, and hk's gitleaks step went green over
# three live tokens. Caught pre-push by three review lanes and by no scanner.
#
# It matters more since `kb_setup.review.EXEMPT_PATHS` — a commit whose whole
# delta is `graphify-out/memory/**` can ship on an ancestor's receipt, so no
# review lane reads it either. Scanner coverage here is a PRECONDITION for that
# exemption, not a follow-up to it.
#
# ENUMERATED rather than negated: gitleaks' regex engine is Go RE2, which has
# no lookahead — `^graphify-out/(?!memory/)` does not compile, measured
# (`invalid perl operator: (?!`). The first pattern requires a DOT so it matches
# top-level derived FILES (graph.json, graph.svg, GRAPH_REPORT.md) and not the
# extensionless `graphify-out/memory` directory, which gitleaks tests against
# this list while walking. A new derived subdirectory that is not listed here
# produces noise until it is added — the failure direction that reports too much
# rather than the one that looks away.
#
# Control-armed both ways on gitleaks 8.30.1 with a random synthetic token:
# baseline (no config) → 6 leaks, so the fixture is detectable; with this list →
# `graphify-out/graph.json` and `graphify-out/wiki/x.md` skipped, and
# `graphify-out/memory/note.md` → 2 leaks. `tests/test_gitleaks_scope.py` pins it.
#
# `^sources/` stays BROAD, and that is a deliberate residual: `extractions/`,
# `media/` and `*.manifest` under it ARE committed, but every byte there is
# ingested external content whose secret-like strings are the noise this
# allowlist exists for. Nothing this repo authors writes there.
paths = [
  '''^sources/''',
  # The single self-extraction sub-graph (#101, 2026-08-02). Same derived class
  # as `graphify-out/cache/` one path over, and it produced the same false
  # positives the moment it existed: `gitleaks dir` scans directories rather
  # than tracked files, so a brand-new gitignored output tree lands in scope
  # immediately — 3 hits on `stat-index.json` content hashes.
  #
  # BROAD, and unlike `^graphify-out/` that is safe here rather than a residual:
  # `graphify-out/` needed a narrow pattern because `memory/` under it IS
  # committed. `.self-graph/` has no such subdirectory — `git ls-files
  # .self-graph` is 0 against a control of 37 under `python/`, the whole tree is
  # `/.self-graph/` in .gitignore, and only `graphify extract` ever writes it.
  # If anything authored is ever put here, narrow this the way graphify-out was.
  '''^\.self-graph/''',
  '''^raw/''',
  # `.research/` — the `aggregated-research` CLI's `--out` landing zone (slice 1,
  # 2026-08-28). Same class as `.firecrawl/` below, and gitignored beside it:
  # third-party tracker text (issue/PR titles, URLs, up to 600 chars of issue
  # body per hit) written by a tool, never authored here. The first live run —
  # `mise run kb-research -- trackers jdx/hk gitleaks --out .research/…` —
  # produced 1 `aws-access-token` hit: a gitleaks TEST FIXTURE quoted in a jdx/hk
  # PR snippet, which turned `mise run lint` red and refused `kb-ship` for an
  # unrelated commit. Armed both ways the same hour: with the file present and
  # no entry -> rc 1; with this entry -> rc 0. Same accepted residual as
  # `.firecrawl/` (`git add -f` commits past the gate) — see #510.
  '''^\.research/''',
  # `.firecrawl/` — the Firecrawl scrape cache. UNTRUSTED FETCHED CONTENT, and
  # gitignored since #502 precisely for that reason, so nothing here can ever
  # reach a commit. Same class as `^raw/` one line up: someone else's words,
  # landing in scope only because `gitleaks dir` walks directories rather than
  # tracked files.
  #
  # Measured 2026-08-25: ONE 263 KB scraped page produced 24 `aws-access-token`
  # findings — 24 hits of a SINGLE repeated `AKIA`-shaped string in a third
  # party's prose, characterised by digest and prefix without reading the value.
  # It turned `mise run lint` red (real rc 1) and refused an unrelated
  # nine-file commit.
  #
  # ⚠️ THIS ENTRY BLINDS THE COMMIT GATE TOO, and an earlier revision of this
  # comment claimed the opposite. `.gitleaks.toml` is read by EVERY gitleaks
  # invocation, `git` mode included, and `git add -f` puts a gitignored file in
  # the INDEX — which is exactly what `--staged` reads. Armed, control first:
  #
  #   non-ignored staged file, no config    -> rc 1   (the probe discriminates)
  #   `.firecrawl/` staged, no config       -> rc 1   (gitleaks would flag it)
  #   `.firecrawl/` staged, WITH this file  -> rc 0   (this entry blinds it)
  #
  # So `git add -f .firecrawl/<anything>` commits past the gate. That residual is
  # accepted because it is the CLASS this list already has — but state the class
  # ACCURATELY, because the previous two attempts at this comment did not:
  #
  #   `^raw/`, `^\.agent/telemetry/`, `^\.firecrawl/`  gitignored, so reaching
  #       them needs a deliberate `git add -f`.
  #   `^sources/`                                       NOT gitignored. Only
  #       `sources/*/` (the re-fetchable clones) is. **158 files are tracked
  #       under `sources/`** — every `*.manifest`, `sources/extractions/*.json`
  #       and all of `sources/media/**` — so a PLAIN `git add sources/media/x.md`
  #       stages an allowlisted path with NO force flag at all.
  #
  # Armed, control first: a non-allowlisted staged file -> rc 1 with and without
  # this config (so the config does not blind everything); `sources/media/x.md`
  # staged with a plain `git add` -> rc 1 without this config, **rc 0 with it**.
  # See also the note at the top of this list: `^sources/` is deliberately BROAD
  # and is described there as a residual. It is the largest exemption here.
  #
  # Tracked in #510, because nobody had ever decided any of this — the list grew
  # one entry at a time, each with a good local reason.
  #
  # Do not restore the old wording. It read as a safety argument for widening
  # the list, and it was false.
  #
  # Upstream, for the next reader: `gitleaks dir` takes ONE path and silently
  # falls back to `.` when handed more (gitleaks/gitleaks#1888, open since
  # 2025-06-05), and hk's builtin passes `{{files}}`. Allowlisting is the
  # documented remedy (gitleaks/gitleaks#1328), not a workaround we invented.
  '''^\.firecrawl/''',
  # The raw-API-body telemetry sink (Ray, 2026-08-17, approved with the cost
  # stated). `OTEL_LOG_RAW_API_BODIES=file:.agent/telemetry/` writes the ENTIRE
  # conversation on every request, so these files are a verbatim copy of what was
  # said — and `gitleaks dir` scans directories rather than tracked files, so the
  # sink landed in scope the moment it existed: **86 findings and ~500 MB scanned
  # (17.7 s), growing**, turning `mise run lint` red on every run.
  #
  # A finding here is about the CONVERSATION, not about the repository, and the
  # bytes can never be committed — `.agent/` is gitignored and
  # `test_the_sink_is_gitignored` pins that against the real `.gitignore`.
  #
  # THE COST, stated rather than discovered later: if a real secret is ever
  # pasted into a session, the copy in this sink is no longer flagged. The
  # ORIGINAL still is, wherever it actually lives — which is the file anyone
  # would need to fix. Narrowed to `telemetry/` alone, so the rest of `.agent/`
  # (including agent reports and receipts) stays scanned.
  '''^\.agent/telemetry/''',
  # `mise run kb-graphify-native-extract`'s own output tree — a THIRD instance
  # of the identical shape `.self-graph/` and `^\.agent/telemetry/` already
  # cover: `gitleaks dir` walks directories rather than tracked files, so a
  # brand-new gitignored output tree lands in scope the moment it exists. Hit
  # the first real run produced (2026-08-23): 2 findings on
  # `graphify-out/cache/stat-index.json`'s `hashes` field (confirmed by
  # inspecting the file's own schema — `{size, mtime_ns, indexed_at_ns, hashes,
  # word_count}` per entry — not assumed from the redacted gitleaks output).
  # Content hashes read as generic-api-key noise at moderate entropy, same as
  # the `.self-graph/` case.
  #
  # Narrowed to `native-extract/` alone, not all of `.agent/`, for the same
  # reason `^\.agent/telemetry/` is narrow rather than `^\.agent/`: the rest of
  # `.agent/` (reports, receipts, the notepad) is AUTHORED content that must
  # stay scanned — `.agent/kb/reports/agents/a-report.md` is the control arm
  # `tests/test_gitleaks_scope.py` pins for exactly that. Only
  # `graphify_native_extract.py`'s own subprocess ever writes under
  # `.agent/kb/native-extract/`.
  '''^\.agent/kb/native-extract/''',
  '''^graphify-out/[^/]+\.[A-Za-z0-9_]+$''',
  '''^graphify-out/(cache|converted|obsidian|reflections|transcripts|wiki)/''',
  '''^graphify-out/[0-9]{4}-[0-9]{2}-[0-9]{2}/''',
  '''^brain/graphify-out/[^/]+\.[A-Za-z0-9_]+$''',
  '''^brain/graphify-out/(cache|converted|obsidian|reflections|transcripts|wiki)/''',
  '''^brain/graphify-out/[0-9]{4}-[0-9]{2}-[0-9]{2}/''',
]
