# Disk reclamation — WHAT may be reclaimed, and under what conditions.
#
# The engine is `kb_setup.reclaim`; the seam is `mise run kb-reclaim`. This file
# is the whole policy surface: every category below can be disabled, re-scoped,
# or re-thresholded without touching python.
#
# ─── The two safety properties, stated here because this is the file people edit
#
# 1. **Dry run is the default.** `mise run kb-reclaim` measures and prints a plan
#    and deletes NOTHING. Reclaiming requires `-- --apply`, every time. There is
#    no config key that makes apply the default, deliberately: a destructive
#    action at a distance (`probes-need-a-control-arm.md`'s lesson applied to
#    deletion) is exactly what a config-driven deleter would otherwise become.
# 2. **A category can only ever act inside its own declared roots**, and never
#    inside this repository. `reclaim.py` refuses a path that escapes them, so a
#    typo here fails closed rather than deleting something else.
#
# `age_days` everywhere means "not modified / not used for longer than this".

[defaults]
# Fallback for any category that does not set its own.
age_days = 30
# Findings smaller than this are counted in the total but not listed individually.
min_size_mb = 100


# ─── Containers ──────────────────────────────────────────────────────────────
# Docker is usually the largest single reclaimable object on a dev Mac, and it is
# the one with a genuine gotcha: on macOS the engine's storage lives inside ONE
# sparse disk image, so pruning frees space INSIDE the image without shrinking
# the file macOS reports. The engine therefore measures the image before and
# after and tells you whether it actually moved.
[category.docker]
enabled = true
kind = "docker"
age_days = 30
# One entry per engine you actually use. Each is pruned in its own context, so a
# dormant VM (colima here) is reported separately rather than hidden inside a
# single total. `disk_image` is the host-side file whose size is the real signal.
[[category.docker.engines]]
context = "desktop-linux"
disk_image = "~/Library/Containers/com.docker.docker/Data/vms/0/data/Docker.raw"
[[category.docker.engines]]
context = "colima"
disk_image = "~/.config/colima"

[category.docker.prune]
images = true
build_cache = true
containers = true
# Anonymous volumes are OFF by default: unlike an image, a volume is the only
# copy of whatever is in it, and `docker system df` cannot tell you what that is.
volumes = false


# ─── Local model weights ─────────────────────────────────────────────────────
[category.ollama]
enabled = true
kind = "ollama"
age_days = 14
# Model names never removed regardless of age, e.g. ["qwen3:0.6b"].
keep = []


# ─── Regenerable caches — ONE CATEGORY PER ARTIFACT TYPE ─────────────────────
# Deliberately not a single `caches` block with four paths. Ray, 2026-08-07:
# "this should actually have categories for each type. aim for as flexible/
# modular as possible". A lumped category is all-or-nothing — you could not keep
# the npm cache while dropping bun's — and its total hides which tree the space
# is actually in. Splitting them costs four blocks and buys `--only caches_npm`.
#
# All of these rebuild on demand; the only cost of being wrong is a slower next
# build. They are listed newest-cost-first as measured on this machine.

[category.caches_system]
enabled = true
kind = "dirs"
age_days = 30
paths = ["~/Library/Caches"]

[category.caches_xdg]
enabled = true
kind = "dirs"
age_days = 30
paths = ["~/.cache"]

[category.caches_bun]
enabled = true
kind = "dirs"
age_days = 30
paths = ["~/.bun/install/cache"]

[category.caches_npm]
enabled = true
kind = "dirs"
age_days = 30
paths = ["~/.npm/_cacache"]

# Homebrew is its OWN kind, not a `dirs` path, because `brew cleanup` reaches
# things no path can: superseded Cellar versions and vendored portable-ruby
# trees, neither of which is under `brew --cache`. It also brings its own
# `--prune=<days>` window and `--dry-run`, so the age policy and the measurement
# are brew's rather than ours (`use-tool-builtins.md`).
#
# ⚠️ OVERLAP: `brew --cache` is `~/Library/Caches/Homebrew`, which is INSIDE
# `caches_system` above. Both enabled means those bytes appear in two totals.
# Kept enabled anyway because the Cellar portion is uniquely reachable here —
# but if you disable `caches_system`, this is the one that still gets the cache.
[category.homebrew]
enabled = true
kind = "homebrew"
age_days = 30
# `--scrub` also drops downloads for currently-installed versions.
scrub = false

# ─── Stale toolchain versions ────────────────────────────────────────────────
# mise keeps every version it has ever installed. This repo alone has ~50
# graphify builds on disk while `mise.toml` pins one.
[category.mise_installs]
enabled = true
kind = "mise_versions"
root = "~/.local/share/mise/installs"
# Never remove a version any mise config pins, nor the N newest per tool.
keep_pinned = true
keep_newest = 1


# ─── Downloaded installers and archives ──────────────────────────────────────
[category.downloads]
enabled = true
kind = "files"
age_days = 30
min_size_mb = 200
paths = ["~/Downloads"]
extensions = [".dmg", ".pkg", ".zip", ".iso", ".tar.gz"]
