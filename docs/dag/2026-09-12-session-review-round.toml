# Round DAG — the map that must exist before any fan-out.
#
# Ray, 2026-09-12, session kb-20260912.000, verbatim:
#   "i asked for a DAG so we can visualize what can be parallelized via git
#    worktrees / make that requirement and enforce that as how we want to move
#    forward always / we are very behind on work and keep going backwards due to
#    all the technical debt we are incurring"
#
# Settled across SEVEN /grilling rounds (27 answers) in session kb-20260912.000.
# Decision page: docs/artifacts/session-review-3b921834-grill.html
#
# SEMANTICS. `touches` is the merge-conflict predictor, NOT a write lock: every
# mutating unit runs in its own git worktree on its own branch off `main`, so two
# units may WRITE the same path concurrently. What they may not do is merge in an
# arbitrary order — units sharing a `touches` entry are serialized at MERGE time,
# in the order their ids appear here. `depends_on` is the only true ordering.
#
# READ-ONLY units carry `worktree = false` deliberately. A fresh worktree does not
# contain `.agent/` (gitignored) and does not carry another branch's tracked files,
# so a review lane given a worktree would be reviewing material it cannot see. The
# isolation those units need is a unique report path, which is `lane_scratch`'s
# half of the answer, not the worktree's.

[round]
id = "2026-09-12-session-review"
title = "Review session 3b921834, fix what it left, and stop the round going backwards"
base = "main"
pr_policy = "one PR per unit"                                                           # Ray, round 7 Q2
reviewer = "kb-codex-astra-reviewer"                                                    # Ray, round 6 Q3 — cold, by ref

# ---------------------------------------------------------------- prerequisite

[[unit]]
id = "P0"
title = "Fix the three mod_runtime P1s, review, ship and land #754"
branch = "feat/754-plugin-types-contract"                                     # already exists, 4 commits ahead
worktree = false                                                              # the branch itself, not a copy
depends_on = []
touches = ["python/src/kb_setup/mod_runtime.py", "tests/test_mod_runtime.py"]
# CORRECTED on first read: `blocks_all = true` was wrong. Only S9 depends on P0
# (both edit mod_runtime.py). Every other unit branches off the CURRENT main and
# runs now; P0 lands independently. The DAG caught this — which is the point.
note = """
Ray, round 7 Q1: fix the three P1s FIRST, then review, then ship. The P1s are in
#754's own code, so shipping as-is merges a gate whose central claim is measured
FALSE.
"""

