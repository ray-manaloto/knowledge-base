# RE-DERIVED TWICE on 2026-09-12. First the anchor moved (the round-2 fix
# tightened the boundary to `(?![\w$.])`). Then the re-derived row reported
# `red suite did not name the test`, because my prediction about what severing
# the branch would do was WRONG: I expected dotted events to stop matching
# entirely. They do not. `\btool\.call\b` still matches inside `"tool.call"`,
# because a quote is a non-word character on both sides — so the tests asserting
# a dotted event is FOUND all stay green. What actually breaks is the EXTENDED
# name: in `on("tool.call.after", …)` the character after `call` is a dot, which
# `\b` happily accepts, so `tool.call.after` satisfies `tool.call` again.
#
# So this row and A25 name the same test on purpose. They sever different lines,
# and either one alone reopens the same hole — which is the thing worth proving.
# Recorded at length because the `red suite did not name the test` check is what
# caught a confident wrong prediction; a harness that only counted red/green
# would have scored this arm as a pass.

# ─────────────────────────────────────────────────────────────────────────────
# A21-A27 — the SECOND round's arms. A cold `gpt-6-astra` lane reviewed the A12-A20
# fixes above and raised nine findings; FOUR were defects inside those very fixes.
# That is this repo's fifth recorded instance of *the fix is where the defect
# lives*, and it is why these rows exist at all: A16-A20 were armed, died, and
# were still incomplete. **An arm proves a test notices a mutation. It says
# nothing about whether the fix was the right fix.**
#
# Each row below fails on the round-1 code and passes on the round-2 code.

# A21 — drop the member RECEIVER from bracket extraction. Round 1 matched any
# `["name"]`, so a bare array literal `const status = ["bogusMember"]` put
# `bogusMember` into the RUNTIME CONTRACT — ordinary local data promoted to a
# declared runtime dependency, in the safe-looking direction (more tokens reads
# as a stricter gate).
[[arm]]
id = "A21"
file = "python/src/kb_setup/mod_runtime.py"
old = '''_BRACKET_ACCESS = re.compile(r"""(?<=[\w$)\]])\[\s*(?P<q>["'])([A-Za-z_$][\w$]*)(?P=q)\s*\]""")'''
new = '''_BRACKET_ACCESS = re.compile(r"""\[\s*(?P<q>["'])([A-Za-z_$][\w$]*)(?P=q)\s*\]""")'''
test = "test_ordinary_data_and_prose_do_not_become_runtime_dependencies"

