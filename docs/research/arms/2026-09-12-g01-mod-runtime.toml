[[arm]]
id = "A23"
file = "python/src/kb_setup/mod_runtime.py"
old = '''_DESTRUCTURE = re.compile(r"(?:const|let|var)\s*\{([^}]*)\}\s*(?::[^=;]+)?=")'''
new = '''_DESTRUCTURE = re.compile(r"(?:const|let|var)\s*\{([^}]*)\}\s*=")'''
