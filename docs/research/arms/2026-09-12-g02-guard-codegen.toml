# Mutation arms for G02 (#755) — the guard-policy codegen module.
#
# WHAT THIS SUITE IS ACTUALLY ABOUT. The spec names three drift shapes
# `kb-guard-codegen-check` must catch, and the native `datamodel-codegen
# --check` provably misses one of them (a stale extra generated file). These
# arms sever each of the three detection paths independently, plus the
# cross-language values-not-names contract (`settings_guard.is_protected_path`)
# and the C3 rule that expected outputs come from the job table rather than a
# second hard-coded list. Each severs ONE line and requires the suite to
# notice — a check verified only on clean input is decoration
# (`.claude/rules/probes-need-a-control-arm.md` rule 2).
#
# CONTROL DISCIPLINE. A0 is a comment-only edit that must SURVIVE. If A0 dies,
# every other row is void: the suite is failing for a reason that has nothing
# to do with the mutation.

suites = ["tests/test_guard_codegen.py", "tests/test_settings_guard.py"]

# A0 — the control. A comment-only edit that must change nothing.
[[arm]]
id = "A0"
control = true
file = "python/src/kb_setup/guard_codegen.py"
old = '''#: The one schema authority.'''
new = '''#: The one schema authority (control).'''

# A1 — SEVER THE NATIVE-CHECK DEFER. The native `datamodel-codegen --check`
# call is what catches a deleted/differing generated Python file (spec §5, row
# 1 and row 2); ignoring its return code makes this module blind to both.
#
# Re-derived for the fix round (#755 respec, F3): `check()`'s native-check
# logic moved into `_check_native`, and the branch inverted (an early `return
# None` on SUCCESS, rather than an early return on failure) so the
# drift-vs-launch-failure discriminator could live in one place. The anchor
# now severs the branch by making it unconditionally treat the native run as
# successful, which is the equivalent "never detects a failure" mutation in
# the new shape.
[[arm]]
id = "A1"
file = "python/src/kb_setup/guard_codegen.py"
old = '''    native = _run_native(repo_root, ["--all-jobs", "--check"])
    if native.returncode == 0:
        return None'''
new = '''    native = _run_native(repo_root, ["--all-jobs", "--check"])
    if True:
        return None'''
test = "test_a_deleted_generated_python_file_is_caught_by_the_native_check"

# A2 — SEVER THE STALE-EXTRA CHECK. This is the row native datamodel-codegen
# provably cannot catch at all (measured three-armed against the real tree),
# so if this module also stops catching it, the third drift shape has NO
# detector anywhere.
[[arm]]
id = "A2"
file = "python/src/kb_setup/guard_codegen.py"
old = '''    stale = _stale_generated_files(repo_root)
    if stale:'''
new = '''    stale = _stale_generated_files(repo_root)
    if False:'''
test = "test_a_stale_extra_generated_file_is_caught_where_native_check_misses_it"

# A3 — SEVER THE CROSS-LANGUAGE TS COMPARISON. This is the one check native
# datamodel-codegen cannot do at all (it has no TypeScript target), so this
# line is the WHOLE reason this module exists rather than the batch alone.
[[arm]]
id = "A3"
file = "python/src/kb_setup/guard_codegen.py"
old = '''    rendered = render_typescript(schema_path)
    if rendered != committed:'''
new = '''    rendered = render_typescript(schema_path)
    if False:'''
test = "test_a_modified_ts_artifact_is_detected"

# A4 — REINTRODUCE THE C3 VIOLATION: a job's output silently never counted as
# "expected", instead of deriving the set from `pyproject.toml`. The believable
# "simplification" is dropping one line inside the loop; the effect is that
# EVERY real generated file reads as an unclaimed stale extra, which the
# control-arm test (the committed tree reconciling clean) is what notices.
[[arm]]
id = "A4"
file = "python/src/kb_setup/guard_codegen.py"
old = '''        output = job.get("output")
        if isinstance(output, str):
            outputs.add((repo_root / output).resolve())'''
new = '''        output = job.get("output")
        if isinstance(output, str):
            continue'''
test = "test_the_committed_tree_reconciles_clean"

# A5 — REGRESS `is_protected_path` TO A BARE SUBSTRING CHECK. The exact false
# positive `register.ts`'s own comment documents avoiding: matching a name that
# merely CONTAINS a protected suffix, with no `/` boundary and no exact-path
# check, rather than a real path segment.
[[arm]]
id = "A5"
file = "python/src/kb_setup/settings_guard.py"
old = '''    normalized = _normalize(path)
    return any(
        normalized == suffix or normalized.endswith(f"/{suffix}") for suffix in PROTECTED_SUFFIXES
    )'''
new = '''    normalized = _normalize(path)
    return any(suffix in normalized for suffix in PROTECTED_SUFFIXES)'''
test = "test_a_substring_that_is_not_a_path_segment_is_not_protected"

# --- The fix round (#755 respec) — F1/F2/F6/F8's new checks, each armed -----

# A6 — SEVER THE FLOOR (F2). An emptied or shrunk schema must still be a
# reported finding, not a silent clean — checks 1-3 alone are internally
# consistent even with zero entries.
[[arm]]
id = "A6"
file = "python/src/kb_setup/guard_codegen.py"
old = '''    distinct = len({v for v in enum_values if isinstance(v, str)})
    if distinct < _MINIMUM_PROTECTED_PATHS:'''
new = '''    distinct = len({v for v in enum_values if isinstance(v, str)})
    if False:'''
test = "test_an_emptied_schema_reports_below_the_floor"

# --- Round 2's findings (#755, reviewed at `c1932522`) — my OWN fixes, armed --
#
# 🔴 Every arm below attacks a fix I wrote MYSELF in response to round 2. This
# repo's recorded pattern is that the fix is the least-reviewed code in the diff,
# and round 2 proved it twice on this very ticket: the F3 fix made `NOT_RUN`
# UNREACHABLE for its own motivating case, and the F8 test still passed against
# the literal it forbids. There is no round 3, so these arms are the only thing
# standing behind those repairs.

# A10 — REGRESS THE SCHEMA READ back to the unguarded form. This is the exact
# defect round 2 found: a bare `json.loads(read_text())` raises on a deleted or
# malformed schema, and an uncaught traceback exits 1 — numerically FINDINGS —
# so the classifier can never see its own commonest input.
[[arm]]
id = "A10"
file = "python/src/kb_setup/guard_codegen.py"
old = '''    try:
        raw = schema_path.read_text(encoding="utf-8")
    except OSError as err:'''
new = '''    try:
        raw = schema_path.read_text(encoding="utf-8")
    except ZeroDivisionError as err:'''
test = "test_a_missing_schema_reports_not_run_rather_than_findings"

# A11 — REGRESS THE FLOOR from DISTINCT back to a raw count. `["mise.toml"] * 10`
# then clears a floor of 5 with ONE path actually protected. A count is a weak
# invariant; this arm is what keeps it from quietly becoming one again.
[[arm]]
id = "A11"
file = "python/src/kb_setup/guard_codegen.py"
old = '''    distinct = len({v for v in enum_values if isinstance(v, str)})'''
new = '''    distinct = len([v for v in enum_values if isinstance(v, str)])'''
test = "test_a_duplicate_padded_policy_is_caught_by_the_distinct_floor"

# A12 — REGRESS `PROTECTED_SUFFIXES` to a hand-maintained literal holding the
# SAME values. Every equality assertion in the suite still passes against this —
# round 2 proved that, rc 0 — so only the AST provenance check can kill it.
[[arm]]
id = "A12"
file = "python/src/kb_setup/settings_guard.py"
old = '''PROTECTED_SUFFIXES: tuple[str, ...] = _protected_suffixes_from(ProtectedPathSuffix)'''
new = '''PROTECTED_SUFFIXES: tuple[str, ...] = tuple(m.value for m in ProtectedPathSuffix)'''
test = "test_protected_suffixes_is_assigned_from_a_call_not_a_literal"

# A13 — REGRESS THE PATH NORMALISATION. `.claude/./settings.json` and
# `.claude//settings.json` then fail OPEN again, and absence of a match is the
# ALLOW signal in this guard.
[[arm]]
id = "A13"
file = "python/src/kb_setup/settings_guard.py"
old = '''    normalized = _normalize(path)'''
new = '''    normalized = path.replace("\\", "/")'''
test = "test_equivalent_spellings_of_a_protected_path_are_protected"

# A7 — SEVER THE CONSUMER CHECK (F1). `register.ts` can lose its only live
# reader of the generated policy while every other check still agrees.
[[arm]]
id = "A7"
file = "python/src/kb_setup/guard_codegen.py"
old = '''    if not _register_ts_consumes_policy(register_source):'''
new = '''    if False:'''
test = "test_register_ts_with_the_import_commented_out_has_no_live_consumer"

# A8 — REGRESS THE PROVENANCE BUILDER (F8) BACK TO NAMES. The exact defect two
# prior tests could not catch: `PROTECTED_SUFFIXES` built from a mangled
# member NAME instead of its VALUE.
[[arm]]
id = "A8"
file = "python/src/kb_setup/settings_guard.py"
old = '''    return tuple(member.value for member in enum_cls)'''
new = '''    return tuple(member.name for member in enum_cls)'''
test = "test_protected_suffixes_are_built_from_enum_values_not_names"

# A9 — SEVER THE TS-RATIONALE DIVERGENCE CHECK (F6). A schema description that
# drops the TS header's hardcoded rationale sentence must be a reported
# finding — this is the ONE thing that would otherwise let the two headers
# desynchronise silently.
[[arm]]
id = "A9"
file = "python/src/kb_setup/guard_codegen.py"
old = '''    if not _ts_rationale_is_current(schema.get("description", "")):'''
new = '''    if False:'''
test = "test_a_schema_whose_description_dropped_the_rationale_reports_findings"
