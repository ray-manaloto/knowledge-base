new = '''    except (OSError, TimeoutError) as e:'''

# P3: pages written inside the loop again (partial state on a crash).
[[arm]]
id = "F7"
test = "test_a_crash_mid_loop_leaves_the_mirror_untouched"
file = "python/src/kb_setup/ccdocs_mirror.py"
old = '''            writes[target] = resp.body'''
new = '''            target.write_bytes(resp.body)
            writes[target] = resp.body'''

# P3 (X4): any status accepted as a page — a 404 body overwrites a real page.
