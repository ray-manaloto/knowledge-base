id = "S1"
test = "test_staleness_reports_an_old_mirror"
file = "python/src/kb_setup/docs_mirror.py"
old = '''    if age >= STALE_AFTER_DAYS:
        return f"{site.mirror}: fetched {age} days ago — run `mise run {site.refresh_task}`"'''
new = '''    if age > 10_000:
        return f"{site.mirror}: fetched {age} days ago — run `mise run {site.refresh_task}`"'''

