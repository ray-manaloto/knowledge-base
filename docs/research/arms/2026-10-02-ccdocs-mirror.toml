file = "python/src/kb_setup/ccdocs_mirror.py"
old = '''    except (OSError, ValueError, KeyError, TypeError) as e:'''
new = '''    except (OSError, ValueError, KeyError) as e:'''

# P3 (X1): only a missing stamp is UNKNOWN.
[[arm]]
id = "F4"
test = "test_an_unusable_stamp_is_unknown_never_fresh"
file = "python/src/kb_setup/ccdocs_mirror.py"
old = '''    except (OSError, ValueError, KeyError, TypeError) as e:'''
new = '''    except OSError as e:'''

# P3: a future-dated stamp reads as fresh.
[[arm]]
