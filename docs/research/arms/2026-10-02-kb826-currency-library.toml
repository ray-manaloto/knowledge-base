# Mutation arms for #826 — `library = true`, a binaryless Python library as a
# currency target.
#
# Each arm severs ONE detection the change added and requires the NAMED test in
# `tests/test_currency_library.py` to go red. The breaks are the realistic
# ones: a routing call dropped, a comparison neutered, a refusal deleted, a
# reader pointed at the wrong environment. A0 is the comment-only control and
# must SURVIVE; if it dies every other row is void.
#
# A8 is the one most worth having: pointing `importlib.metadata` at the RUNNING
# interpreter rather than the project venv answers for kb_setup's own
# environment. It dies here only because githubkit is absent from this repo's
# venv (checked 2026-10-02: `importlib.util.find_spec('githubkit')` -> None).

suites = ["tests/test_currency_library.py"]

[[arm]]
id = "A0"
control = true
file = "python/src/kb_setup/currency/sync.py"
old = '''    """A git-pinned package: compare the commit its install recorded with the pin."""'''
new = '''    """A git-pinned package: compare the commit its install recorded with the pin (control)."""'''

# A1 — drop the library route: resolution falls back to `.venv/bin/<binary>`,
# the founding defect.
[[arm]]
id = "A1"
test = "test_installed_library_at_the_pin_is_in_sync"
file = "python/src/kb_setup/currency/sync.py"
old = '''        return _check_library_resolution(repo_root, spec, pinned)'''
new = '''        pass'''

# A2 — never compare the installed version with the pin.
[[arm]]
id = "A2"
test = "test_installed_library_at_another_version_is_drift"
file = "python/src/kb_setup/currency/sync.py"
old = '''    if observed != pinned:
        return (
            Finding(
                "resolution",
                DRIFT,
                f"{venv} has'''
new = '''    if False:
        return (
            Finding(
                "resolution",
                DRIFT,
                f"{venv} has'''

# A3 — an absent library reads as green.
[[arm]]
id = "A3"
test = "test_library_absent_from_the_venv_is_drift_not_ok"
file = "python/src/kb_setup/currency/sync.py"
old = '''        return Finding("resolution", DRIFT, f"{spec.python_package} {why} in {venv}"), ""'''
new = '''        return Finding("resolution", OK, f"{spec.python_package} {why} in {venv}"), ""'''

