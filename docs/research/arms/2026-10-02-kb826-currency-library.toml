# A17 — the TRAP found while arming: read `dist.files`, which on Python 3.14
# omits paths absent from disk — and an absent script is the very case asked.
[[arm]]
id = "A17"
test = "test_a_package_shipping_any_executable_gets_no_library_hint"
file = "python/src/kb_setup/currency/sync.py"
old = '''    record = dist.read_text("RECORD")'''
new = '''    record = "\\n".join(str(f) for f in dist.files or ()) if dist.files is not None else None'''

# A18 — an install with no RECORD is treated as binaryless.
[[arm]]
id = "A18"
test = "test_a_package_with_no_record_gets_no_library_hint"
file = "python/src/kb_setup/currency/sync.py"
old = '''        return True  # no RECORD: a legacy script cannot be ruled out'''
new = '''        return False  # no RECORD: a legacy script cannot be ruled out'''

# A19 — review F1: read only the first `python*/site-packages`.
[[arm]]
