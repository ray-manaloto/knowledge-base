test = "test_the_memory_probe_reports_files_the_store_could_not_index"
file = "python/src/kb_setup/recall_work.py"
old = '''    if report.unparsable:'''
new = '''    if False:'''

# A8 — P2: saturation from distinct names instead of raw rows.
[[arm]]
