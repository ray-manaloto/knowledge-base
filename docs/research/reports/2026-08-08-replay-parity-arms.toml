# Mutation arms for the shared replay loop (`kb-watch` recompose parity).
#
# The defect these arms guard: `build()` and `refresh_self()` each had their own
# replay loop over the same committed chunks. `build()`'s applied
# `chunks.replay_order` and threaded `--prior-<field>`; the recomposition loop
# did NEITHER — it replayed `manifest.chunks` in stored (alphabetical) order and
# passed no counts. Same corpus, two graphs, chosen by the alphabet.
#
# Observed 2026-08-08 as a hard `kb-watch` failure: `claude-code-docs-mirror`
# (captured 07-30, 26 nodes) replayed AFTER `claude-code-docs-2026-08-05-refresh`
# (captured 08-05, 116 nodes) and superseded it — `hooks.md` 69 nodes to 5,
# `skills.md` 47 to 15, net -90 — and only graphify's #479 shrink guard refusing
# the write kept the regression off disk.
#
# WHAT THESE ARMS CANNOT MEASURE, stated because a clean sweep is a statement
# about the TESTS and never about the premise:
#
#   * whether capture date is the RIGHT supersession rule. It is asserted by
#     `chunks.replay_order`'s docstring and predates this change; no arm here
#     re-establishes it. If capture dates are wrong in the chunks themselves,
#     every arm below still passes and the graph is still wrong.
#   * whether the 22 chunks whose derived root does not exist on disk are
#     harmed by that. Measured separately and found survivable — the roots are
#     only used to relativise — but that is a measurement, not a test.
#   * whether `kb-watch` now SUCCEEDS end to end. That needs the real corpus and
#     a real graphify; these arms stub `_run`.

suites = ["tests/test_merge_counts_wiring.py"]

[[arm]]
id = "control"
control = true
file = "python/src/kb_setup/graph.py"
old = '    counts_out = out.with_name(".merge-counts.tmp.json")'
new = '    counts_out = out.with_name(".merge-counts.tmp.json")  # inert control edit'

# --- the ordering half -------------------------------------------------------

# THE defect, reintroduced exactly. Replaying `pairs` as given is what the
# recomposition path did for its whole life, and it is the one-token edit a
# future refactor is most likely to make ("the caller already sorted it").
[[arm]]
id = "replay-order-dropped"
test = "test_recompose_replays_in_capture_order_not_the_order_it_was_given"
file = "python/src/kb_setup/graph.py"
old = "    for chunk, root in sorted(pairs, key=lambda pair: _chunks.replay_key(pair[0])):"
new = "    for chunk, root in pairs:"

# Sorting by the WRONG key — the naming accident in its original form. Distinct
# from the arm above because a sort that runs but sorts alphabetically looks
# correct at a glance and passes any test that only checks "something sorted".
[[arm]]
id = "replay-order-keyed-by-name"
test = "test_recompose_replays_in_capture_order_not_the_order_it_was_given"
file = "python/src/kb_setup/graph.py"
old = "    for chunk, root in sorted(pairs, key=lambda pair: _chunks.replay_key(pair[0])):"
new = "    for chunk, root in sorted(pairs, key=lambda pair: pair[0].name):"

# The key itself drifting. `replay_key` exists so the two paths cannot each
# derive one; dropping the date from it re-opens that by making the shared key
# alphabetical, which no amount of sharing would then save.
[[arm]]
id = "replay-key-loses-the-date"
test = "test_recompose_replays_in_capture_order_not_the_order_it_was_given"
file = "python/src/kb_setup/chunks.py"
old = "    return (chunk_captured_at(path), path.name)"
new = '    return ("", path.name)'

# --- the arithmetic half -----------------------------------------------------

# #191's gate silently switched off. The realistic break: `--counts-out` is what
# makes the NEXT chunk's prior knowable, so deleting it turns every merge after
# the first into "arithmetic NOT checked" while every merge still succeeds.
[[arm]]
id = "counts-handoff-not-requested"
test = "test_recompose_threads_each_merges_count_into_the_next"
file = "python/src/kb_setup/graph.py"
old = '        argv += ["--counts-out", str(counts_out)]'
new = "        pass"

# The prior never reaching argv. Distinct from the arm above: the handoff is
# still written and consumed, so the loop looks fully wired and the flag simply
# never arrives at the subprocess that would check it.
[[arm]]
id = "prior-counts-not-passed"
test = "test_recompose_threads_each_merges_count_into_the_next"
file = "python/src/kb_setup/graph.py"
old = """        for field, value in prior.items():
            if value is not None:
                argv += [f"--prior-{field}", str(value)]"""
new = "        pass"

# --- the seam itself ---------------------------------------------------------

# The regression that matters most: someone restores the bare loop in
# `_recompose_into_temp`. This is the literal pre-fix code, and it must take
# BOTH properties down at once — which is the point of there being one loop.
[[arm]]
id = "recompose-bypasses-the-shared-loop"
test = "test_recompose_replays_in_capture_order_not_the_order_it_was_given"
file = "python/src/kb_setup/graph.py"
old = "        _replay_pairs(repo_root, gpy, tmp_out, replay)"
new = """        for chunk, root in replay:
            _run([gpy, str(_MERGE_SCRIPT), str(chunk), root, str(tmp_out)], repo_root)"""

# The root being re-derived inside the shared loop instead of taken from the
# caller. This is the plausible "simplify it" edit — the two callers then agree
# on everything, and every recorded `chunk_roots` override is silently
# discarded. It passes both ordering and threading arms, which is exactly why
# the root has its own test.
[[arm]]
id = "shared-loop-rederives-the-root"
test = "test_recompose_replays_under_the_root_it_was_handed"
file = "python/src/kb_setup/graph.py"
old = "        argv = [gpy, str(_MERGE_SCRIPT), str(chunk), root, str(out)]"
new = '        argv = [gpy, str(_MERGE_SCRIPT), str(chunk), str(chunk.parent), str(out)]'

# `build()`'s path must keep routing through the shared loop too. Without this
# the fix could be "recompose got better" rather than "there is one loop", and
# the next divergence starts from the other side.
[[arm]]
id = "build-path-stops-sharing-the-loop"
test = "test_replay_threads_each_count_into_the_next_chunk"
file = "python/src/kb_setup/graph.py"
old = "    _replay_pairs(repo_root, gpy, out, [(c, _derived_root(sources, c)) for c in chunk_paths])"
new = "    return"

# The parity assertion's own arm: `replay_order` quietly stopping to use the
# shared key. Both would still be date-ordered today, so only the identity
# assertion notices — and the identity is the whole guarantee.
[[arm]]
id = "replay-order-stops-using-the-shared-key"
test = "test_both_replay_paths_order_by_the_same_key"
file = "python/src/kb_setup/chunks.py"
old = "    return sorted(paths, key=replay_key)"
new = "    return sorted(paths, key=lambda p: (p.name, chunk_captured_at(p)))"
