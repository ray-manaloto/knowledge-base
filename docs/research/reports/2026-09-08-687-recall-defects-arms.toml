# Mutation arms for the three #687 defects in `kb_setup.recall`.
#
# THE DEFECTS, all three found by a cold `codex review` whose `--base` was one
# commit too early (it diffed against a point before PR #684 merged `recall.py`
# to main, so it read the whole file as new). The base mistake did not make the
# findings wrong — but it did make them LEADS rather than readings, and one of
# the three turned out to be described incorrectly:
#
#   1. `_answer_body` truncated at the FIRST footer marker, so an answer that
#      DOCUMENTS the memory format — quoting `## Outcome` / `- Signal:`
#      verbatim, which this store invites — lost every word after the quote.
#   2. `render_report` printed `len(hits)` against `searched`, the whole
#      post-filter population. #687 predicted the header would read "2 of 2";
#      measured on the live store 2026-09-08 it read **"2 of 382 matched (382
#      total memories in the store)"** — two printings of one number, naming
#      the match count nowhere. The real shape is the more misleading one.
#   3. The `unparsable` count was rendered "present but unreadable", but it is
#      `real_total` minus what `load_memory_docs` returned, and that
#      subtraction cannot separate a read failure from a readable `.md` that
#      simply is not a memory document. The COUNT was right; the WORD was not.
#
# WHAT THESE MEASURE, and it is narrower than "the fixes are right": whether
# this repo's tests can go red when each fixed behaviour is removed. No arm
# here says the new wording is ACCURATE. Accuracy for (2) was settled by
# RUNNING `mise run kb-recall -- "graphify fork" --top 2` and reading the
# header, not by a mutation — which is also how the ticket's own prediction was
# refuted.
#
# WHY THE MUTATIONS ARE THE REALISTIC BREAKS. Each one restores the exact code
# that shipped, not an invented weakening: `rfind` -> `find` is the one-token
# regression that caused (1); dropping `matched` back to `searched` in the
# f-string is (2); putting the word "unreadable" back is (3). All three could
# really happen — the first two by a reviewer "simplifying", the third by
# anyone who reads the field name and trusts it.

suites = ["tests/test_recall.py"]

[[arm]]
id = "C0"
control = true
file = "python/src/kb_setup/recall.py"
old = '''    marker = "\n## Answer"'''
new = '''    marker = "\n## Answer"  # control'''

# A1 — defect 1, replayed exactly. `rfind` back to `find`. graphify writes the
# real footer LAST, so scanning from the front stops at any quoted example.
[[arm]]
id = "A1"
test = "test_answer_body_survives_an_answer_that_documents_the_footer_format"
file = "python/src/kb_setup/recall.py"
old = '''        idx = remainder.rfind(footer)'''
new = '''        idx = remainder.find(footer)'''

# A2 — defect 2, replayed exactly: the header's denominator goes back to the
# searched population. This is the mutation that reproduces "2 of 382 matched".
#
# ⚠️ IT SURVIVED ON THE FIRST RUN, and the code was already correct. The test's
# fixture had three records, all three matching, so `matched` and `searched`
# were both 3 and swapping one for the other changed no character of the output
# — an INERT MUTANT. The fixture now carries a fourth record that survives
# filtering and matches nothing, so the two numbers differ. Recorded rather
# than quietly fixed: a surviving arm is a statement about the FIXTURE before
# it is one about the code, and this is the second time that has bitten here.
[[arm]]
id = "A2"
test = "test_matched_counts_before_top_slices_and_the_header_says_so"
file = "python/src/kb_setup/recall.py"
old = '''            f"{report.matched} matched (searched {report.searched} of "'''
new = '''            f"{report.searched} matched (searched {report.searched} of "'''

# A3 — defect 2's OTHER half, and the reason it is a separate arm. A2 mutates
# only the rendering; the pre-slice count could still be computed correctly and
# merely displayed wrong. This one destroys the count itself at its source, so a
# test that passes here would be asserting the string and not the measurement.
[[arm]]
id = "A3"
test = "test_matched_counts_before_top_slices_and_the_header_says_so"
file = "python/src/kb_setup/recall.py"
old = '''            matched=len(weighted),'''
new = '''            matched=len(ranked),'''

# A4 — defect 3. The word goes back to the one the subtraction cannot support.
[[arm]]
id = "A4"
test = "test_a_readable_non_memory_file_is_reported_as_not_indexed"
file = "python/src/kb_setup/recall.py"
old = '''    return f" ({report.unparsable} {noun} present but not indexed)"'''
new = '''    return f" ({report.unparsable} {noun} present but unreadable)"'''
