file = "python/src/kb_setup/arms.py"
old = '''    if control and table.get("test") is not None:'''
new = '''    if False:'''
test = "test_a_control_arm_naming_a_test_is_refused"
meaning = "a control arm carries an expectation it can never meet"

[[arm]]
id = "A20 suites required"
file = "python/src/kb_setup/arms.py"
old = '''    if not isinstance(suites, list) or not suites or not all(isinstance(s, str) for s in suites):'''
new = '''    if False:'''
test = "test_a_spec_with_no_suites_is_refused"
meaning = "a spec naming no suite runs pytest over the whole repo"

[[arm]]
id = "A21 arms required"
file = "python/src/kb_setup/arms.py"
old = '''    if not isinstance(tables, list) or not tables:'''
new = '''    if False:'''
test = "test_a_spec_with_no_arms_is_refused"
meaning = "an empty spec is accepted and reports nothing wrong"

[[arm]]
id = "A22 toml parse error"
file = "python/src/kb_setup/arms.py"
old = '''    except (OSError, tomllib.TOMLDecodeError) as exc:'''
new = '''    except OSError as exc:'''
test = "test_unparsable_toml_is_a_spec_error_not_a_traceback"
meaning = "a malformed spec raises a traceback instead of a refusal"

[[arm]]
id = "A23 known key set"
file = "python/src/kb_setup/arms.py"
old = '''_ARM_KEYS: frozenset[str] = frozenset({"id", "file", "old", "new", "test", "meaning", "control"})'''
new = '''_ARM_KEYS: frozenset[str] = frozenset({"id", "file", "old", "new", "test", "control"})'''
test = "test_a_valid_spec_loads"
meaning = "a documented key is rejected as unknown"

# A24 originally mutated the missing-required-key `errors.append` into a raise,
# named `test_every_problem_is_reported_in_one_pass`, and SURVIVED. That was a
# PROBE defect, not a coverage gap: the named test's spec has a missing `test`
# and a missing control, never a missing required key, so the mutated line was
# never reached. Re-pointed at the line the test actually exercises, and the
# unreached line got a test of its own (A24b).
[[arm]]
id = "A24 all errors in one pass"
file = "python/src/kb_setup/arms.py"
old = '''        raise SpecError(f"{path}: " + "; ".join(errors))'''
new = '''        raise SpecError(f"{path}: " + errors[0])'''
test = "test_every_problem_is_reported_in_one_pass"
meaning = "only the first problem is reported, so a stale spec takes N runs to fix"

[[arm]]
id = "A24b required key named"
file = "python/src/kb_setup/arms.py"
old = '''            errors.append(f"{where}: missing or non-string `{key}`")'''
new = '''            errors.append(f"{where}: bad arm")'''
test = "test_an_arm_missing_a_required_key_is_refused_and_names_it"
meaning = "a refusal does not say WHICH key is wrong"

[[arm]]
id = "A29 purge honesty"
file = "python/src/kb_setup/arms.py"
old = '''            if cache.exists():
                raise RuntimeError('''
new = '''            if False:
                raise RuntimeError('''
test = "test_a_purge_that_did_not_purge_raises_rather_than_counting"
meaning = "a purge that silently failed still reports the count of one that worked"

[[arm]]
id = "A30 dont-write-bytecode"
file = "python/src/kb_setup/arms.py"
old = '''        env={**os.environ, "PYTHONDONTWRITEBYTECODE": "1"},'''
new = '''        env={**os.environ},'''
test = "test_a_suite_run_writes_no_bytecode_of_its_own"
meaning = "the second bytecode mitigation is unarmed - it survived the first sweep"

