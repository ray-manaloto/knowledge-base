file = "python/src/kb_setup/arms.py"
old = '''    if arms and not any(arm.control for arm in arms):'''
new = '''    if False:'''
test = "test_a_spec_with_no_control_arm_is_refused"
meaning = "a spec with no control arm is accepted"

[[arm]]
