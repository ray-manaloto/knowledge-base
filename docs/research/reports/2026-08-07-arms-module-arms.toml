# Mutation arms for `kb_setup.arms` itself (#160) — the module armed BY the module.
#
#   mise run kb-arms -- docs/research/reports/2026-08-07-arms-module-arms.toml
#   mise run kb-arms -- docs/research/reports/2026-08-07-arms-module-arms.toml --dry-run
#
# This file is the whole point of the ticket: the eighth mutation harness in this
# repo is DATA, not a program someone re-typed. Every `old` below is line-exact
# against the commit that introduced it, so a later refactor makes the arm report
# `PROBE BROKEN - pattern not found` rather than silently passing.
#
# Findings from the run are written up in `2026-08-07-arms-module-mutation-arms.md`.

suites = ["tests/test_arms.py"]

[[arm]]
id = "A0 CONTROL"
control = true
file = "python/src/kb_setup/arms.py"
old = '''def purge_bytecode(root: Path) -> int:'''
new = '''def purge_bytecode(root: Path) -> int:  # control'''

# --- protection 1: bytecode invalidation ----------------------------------- #

[[arm]]
id = "A1 purge call site"
file = "python/src/kb_setup/arms.py"
old = '''    purge(repo_root)
    proc = subprocess.run('''
new = '''    proc = subprocess.run('''
test = "test_two_same_size_arms_die_and_survive_without_the_purge"
meaning = "the purge could be deleted from run_suite and no test would notice"

# A2 was this arm pointed at `test_two_same_size_arms_die_and_survive_without_the_purge`,
# where it SURVIVED: the purge runs before every suite, so a `.pyc` written under
# arm N is gone before arm N+1 and no verdict moves. Not inert though — the purge
# can fail — so it is re-pointed at a test of the OBSERVABLE consequence and now
# lives at A30, beside the other post-first-sweep arms.

# --- protection 2: a probe that never ran is not a death -------------------- #

[[arm]]
id = "A3 absent pattern"
file = "python/src/kb_setup/arms.py"
old = '''    if hits == 0:'''
new = '''    if False:'''
test = "test_a_pattern_that_does_not_match_is_broken_not_a_death"
meaning = "a stale arm is scored instead of refused"

[[arm]]
id = "A4 ambiguous pattern"
file = "python/src/kb_setup/arms.py"
old = '''    if hits > 1:'''
new = '''    if False:'''
test = "test_a_pattern_that_matches_more_than_once_is_broken_not_a_death"
meaning = "an arm mutating the wrong occurrence is scored as a real result"

[[arm]]
id = "A5 no-op mutation"
file = "python/src/kb_setup/arms.py"
old = '''    if mutated == source:'''
new = '''    if False:'''
test = "test_a_no_op_mutation_is_broken_not_a_survivor"
meaning = "an edit that changes nothing is reported as a coverage gap"

[[arm]]
id = "A6 named-test check"
file = "python/src/kb_setup/arms.py"
old = '''    if arm.test is not None and arm.test not in out:'''
new = '''    if False:'''
test = "test_a_red_suite_that_does_not_name_the_test_is_not_a_death"
meaning = "a suite red for an unrelated reason is credited to the mutation"

# --- protection 3: the mandatory green rows --------------------------------- #

[[arm]]
id = "A7 baseline abort"
file = "python/src/kb_setup/arms.py"
old = '''    if baseline_rc != 0:'''
new = '''    if False:'''
test = "test_a_red_baseline_aborts_before_any_arm_runs"
meaning = "arms run against an already-red suite, where every death is free"

[[arm]]
id = "A8 control abort"
file = "python/src/kb_setup/arms.py"
old = '''        if arm.control and row.verdict is not Verdict.CONTROL_HELD:'''
new = '''        if False:'''
test = "test_a_control_arm_that_dies_aborts_the_run"
meaning = "a demonstrably lying harness keeps printing rows people will believe"

[[arm]]
id = "A9 controls first"
file = "python/src/kb_setup/arms.py"
old = '''    ordered = [a for a in spec.arms if a.control] + [a for a in spec.arms if not a.control]'''
new = '''    ordered = list(spec.arms)'''
test = "test_controls_run_before_mutations_whatever_their_spec_order"
meaning = "the control no longer runs before the arms it is supposed to validate"

[[arm]]
id = "A10 restored row in ok"
file = "python/src/kb_setup/arms.py"
old = '''            and self.restored_rc == 0
'''
new = ''''''
test = "test_a_run_whose_restored_row_is_red_is_not_ok"
meaning = "a run that left the tree dirty still reports ok"

[[arm]]
id = "A11 control required in ok"
file = "python/src/kb_setup/arms.py"
old = '''            and any(row.arm.control for row in self.rows)
'''
new = ''''''
test = "test_a_report_with_no_control_row_is_not_ok"
meaning = "a sweep with no control at all reports ok"

# A12 was `and bool(self.rows)` in `Report.ok`. It SURVIVED the first sweep, and
# the question "coverage gap or inert mutation?" was settled by measurement:
# `any(...)` over an empty tuple is already False, so the clause was strictly
# implied by the one below it and the two masked each other. The clause was
# deleted rather than tested, and A11 now arms the empty case too. The arm is
# recorded here as removed rather than dropped silently, because a shrinking
# spec with no explanation reads as arms that were quietly abandoned.

[[arm]]
id = "A13 restore call"
file = "python/src/kb_setup/arms.py"
old = '''        _restore(path, original)'''
new = '''        pass'''
test = "test_the_file_is_restored_after_every_arm"
meaning = "the working tree is left mutated after a run"

[[arm]]
id = "A14 restore on exception"
file = "python/src/kb_setup/arms.py"
old = '''    try:
        rc, out = suite()
    finally:
        _restore(path, original)'''
new = '''    rc, out = suite()
    _restore(path, original)'''
test = "test_the_file_is_restored_even_when_the_suite_raises"
meaning = "an interrupted run leaves production source mutated on disk"

# --- the spec loader -------------------------------------------------------- #

