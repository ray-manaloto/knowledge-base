# Mutation arms for the concurrent gate runner (#248).
#
# Each row breaks ONE thing REALISTICALLY — the membership test that makes the
# safe set mean anything, the flush that keeps a writer alone, the padding that
# survives out-of-order completion — and the named test must go RED.
#
# WHAT THESE ARMS CANNOT MEASURE, said here because a clean sweep is a statement
# about the TESTS and never about the premise
# (`mutation-arms-cannot-measure-the-premise`):
#
#   * whether the four gates are ACTUALLY safe to overlap. That came from
#     measurement — `find -newer <stamp>` over a full run showed `lint` writing
#     only `.rumdl_cache` and `test` only `.pytest_cache` — and no green sweep
#     here re-establishes it. If a gate starts writing tracked files, every arm
#     below still passes.
#   * whether any of this was worth doing. The 12% ceiling on gate parallelism
#     and the 3.8x from `-n auto` are wall-clock measurements recorded in
#     `mise.toml` and `pyproject.toml`, not properties a test asserts.
#
# ONE ARM IS DELIBERATELY ABSENT. A `future.cancel()` loop was written for the
# within-a-batch fail-fast path and then removed, because the pool is sized to
# the batch: every gate has started before any can fail, so `cancel()` could only
# ever return False. Arming it would have produced a PREDICTED survival, which is
# the most dangerous arm there is (`unreachable-by-construction-needs-an-arm`) —
# the honest move was to delete the line, not to score it.

suites = ["tests/test_gates.py"]

[[arm]]
id = "control"
control = true
file = "python/src/kb_setup/gates.py"
old = 'CONCURRENT_SAFE = frozenset({"lint", "test", "brain-audit"})'
new = 'CONCURRENT_SAFE = frozenset({"lint", "test", "brain-audit"})  # inert control edit'

# --- the safe set has to actually be consulted -------------------------------

# The realistic break is an EMPTY set — someone refactors the names out, or a
# future edit narrows it to nothing. Everything then runs exclusive: correct, and
# silently four times slower, which is exactly the failure no result assertion
# can see. Only the barrier notices.
[[arm]]
id = "safe-set-emptied"
test = "test_concurrency_safe_gates_really_do_run_at_the_same_time"
file = "python/src/kb_setup/gates.py"
old = 'CONCURRENT_SAFE = frozenset({"lint", "test", "brain-audit"})'
new = "CONCURRENT_SAFE = frozenset()"

# The fail-CLOSED default, and the most valuable arm here. Treating every gate as
# safe is the single edit that turns this module from "parallel where safe" into
# "parallel", and it would pass every test that only looks at results — a race is
# not a wrong answer, it is a wrong answer *sometimes*.
[[arm]]
id = "unknown-gates-treated-as-safe"
test = "test_a_gate_outside_the_safe_set_never_overlaps_anything"
file = "python/src/kb_setup/gates.py"
old = """        if task in CONCURRENT_SAFE:
            batch.append(task)
            continue"""
new = """        if True:
            batch.append(task)
            continue"""

# --- the writer must stay alone ---------------------------------------------

# Dropping the flush does not stop batching; it DEFERS it, so `lint` and `test`
# end up running together AFTER the `fmt` that was meant to separate them. The
# gates all still pass. This is the arm for Ray's actual constraint.
[[arm]]
id = "writer-does-not-flush-the-pending-batch"
test = "test_a_writer_between_two_readers_separates_them"
file = "python/src/kb_setup/gates.py"
old = """        if batch:
            yield tuple(batch)
            batch = []
        yield (task,)"""
new = """        yield (task,)"""

# --- the record must survive out-of-order completion --------------------------

# The exact prior spelling. It was CORRECT before concurrency and is wrong after
# it, which is the whole shape of this ticket's risk: the line nobody edited is
# the one the change broke.
[[arm]]
id = "padding-by-count-instead-of-multiset"
test = "test_an_interrupt_under_concurrency_pads_the_gates_that_really_did_not_run"
file = "python/src/kb_setup/gates.py"
old = """        missing = Counter(tasks) - Counter(r.task for r in results)
        results.extend(GateResult(t, None, None, None) for t in missing.elements())"""
new = """        results.extend(GateResult(t, None, None, None) for t in tasks[len(results) :])"""

# THE COLD LANE'S P2, armed as its own revert. This is the code AS FIRST
# WRITTEN: a dict comprehension is last-write-wins, so every `lint` row in
# `("lint", "test", "lint")` took index 2 and the first one sorted after `test`.
#
# It passed all eleven concurrency tests written alongside it, because every one
# of them used an ADJACENT repeat — the single case where first-write and
# last-write agree. The lane found it by EXECUTING the function; no amount of
# reading the diff would have, and the sweep that scored 7/7 the round before was
# green over this exact line.
[[arm]]
id = "requested-order-keyed-by-last-occurrence"
test = "test_a_non_adjacent_repeat_keeps_its_first_requested_position"
file = "python/src/kb_setup/gates.py"
old = """    position: dict[str, int] = {}
    for i, task in enumerate(tasks):
        position.setdefault(task, i)"""
new = """    position = {task: i for i, task in enumerate(tasks)}"""

# THE COLD LANE'S ROUND-2 HIGH, armed as its own revert. Deleting the sweep
# restores the shipped behaviour exactly: `as_completed` stops handing over
# results when the loop leaves early, the pool waits for the siblings anyway, and
# gates that RAN TO COMPLETION are recorded `rc: None` — "did not run".
#
# The test that stood here before ASSERTED THAT, so no mutation of production
# code could have found it. It took a lane instrumenting which subprocess calls
# actually completed. Recorded because it is the sharpest instance yet of "a test
# written alongside its own fix cannot fail".
#
# THIS ARM SURVIVED ON ITS FIRST RUN, against
# `test_a_sibling_that_finished_after_the_interrupt_is_not_recorded_as_unrun`,
# and the survival was the finding. That test raises inside the mocked
# subprocess, so the interrupt is a FUTURE'S exception — `future.exception()`
# reports it, the loop runs to the end, everything is consumed, and the sweep is
# never reached. The fix that closed the lane's HIGH for that shape was switching
# `future.result()` to `future.exception()`; the sweep covers a DIFFERENT shape,
# a Ctrl-C on the main thread, which no test had constructed.
#
# So the arm is re-pointed rather than deleted, and the reaching case was built
# (`unreachable-by-construction-needs-an-arm`: construct it, or the claim is not
# earned). Two mechanisms, two shapes, one arm each.
[[arm]]
id = "completed-siblings-are-swept-away"
test = "test_an_interrupt_on_the_main_thread_still_collects_the_gates_that_finished"
file = "python/src/kb_setup/gates.py"
old = """    outcomes.extend(
        f.result()
        for f in futures
        if f not in consumed and not f.cancelled() and f.exception() is None
    )"""
new = "    pass  # siblings dropped"

# The THIRD shape, and the one `.exception()` alone covers: a worker raising
# something the interrupt handler does not name. Reverting to `.result()` lets it
# escape `_run_batch` and take three completed gates with it.
[[arm]]
id = "future-result-lets-a-worker-error-escape"
test = "test_an_unexpected_error_in_one_gate_does_not_discard_the_others"
file = "python/src/kb_setup/gates.py"
old = """            exc = future.exception()
            if exc is None:
                outcomes.append(future.result())
            elif failure is None:
                failure = exc"""
new = """            outcomes.append(future.result())"""

# The tempting simplification, and it is the one that would SILENTLY DISARM
# another arm: rebuilding from `futures` is shorter, still sweeps up every
# straggler, and makes `record-keeps-completion-order` survive because submit
# order already equals requested order. Armed against the test that exists to
# pin completion order, precisely so the two cannot both go quiet.
[[arm]]
id = "batch-outcomes-rebuilt-in-submit-order"
test = "test_results_arrive_in_completion_order_within_a_batch"
file = "python/src/kb_setup/gates.py"
old = """    outcomes.extend(
        f.result()
        for f in futures
        if f not in consumed and not f.cancelled() and f.exception() is None
    )"""
new = """    outcomes[:] = [f.result() for f in futures if not f.cancelled() and f.exception() is None]"""

[[arm]]
id = "record-keeps-completion-order"
test = "test_the_record_keeps_requested_order_despite_completion_order"
file = "python/src/kb_setup/gates.py"
old = "        results[:] = in_requested_order(results, tasks)"
new = "        pass  # order left as scheduled"

# --- concurrent output has to stay attributable ------------------------------

# Both directions, because either constant satisfies one half. Without the
# prefix, four gates interleave into output no reader can attribute; with it
# always on, a lone `kb-gates -- lint` stops printing what it always printed.
[[arm]]
id = "batched-gates-lose-mises-prefix"
test = "test_only_a_shared_terminal_gets_mises_prefix"
file = "python/src/kb_setup/gates.py"
old = "pool.submit(_run_one, repo_root, task, prefix_output=True)"
new = "pool.submit(_run_one, repo_root, task, prefix_output=False)"

[[arm]]
id = "lone-gate-gains-a-prefix-it-never-had"
test = "test_only_a_shared_terminal_gets_mises_prefix"
file = "python/src/kb_setup/gates.py"
old = '    argv = ["mise", "run", "-o", "prefix", task] if prefix_output else ["mise", "run", task]'
new = '    argv = ["mise", "run", "-o", "prefix", task]'

# --- eval must STAY out of the safe set (#321) --------------------------------

# The realistic regression: someone reads `CONCURRENT_SAFE` as a speed knob and
# puts `eval` back, exactly as it was until 2026-08-16. Nothing about the
# RESULTS changes — every gate still passes — so only a test that asserts the
# BATCHING can see it. That is the whole reason the shape is asserted separately
# from the outcomes.
#
# This arm cannot measure the thing that actually justifies the removal: that
# `graphify query` misses its 60s bound when starved. That came from three
# observed `kb-gates` runs, not from a test, and no green sweep here
# re-establishes it (`mutation-arms-cannot-measure-the-premise`).
[[arm]]
id = "eval-put-back-into-the-safe-set"
test = "test_the_shipped_gates_batch_exactly_as_concurrent_safe_declares"
file = "python/src/kb_setup/gates.py"
old = 'CONCURRENT_SAFE = frozenset({"lint", "test", "brain-audit"})'
new = 'CONCURRENT_SAFE = frozenset({"lint", "test", "brain-audit", "eval"})'
