# Mutation arms for #750 Phase 1 — `kb_setup.codex_review_evidence`.
#
# Every arm targets a claim the resolver's docstring or the tagged-union
# contract makes explicit: "join is BOTH parent AND source", "require exactly
# one child", "every turn, not just the first", "never default a missing
# model", "model-observed and review-happened are independent facts", "a
# permission failure is Error, never a guessed Unavailable", "no shape of
# codex_evidence refuses the receipt", and "evidence capture can never cost
# the lane its own rc". Each is the realistic production mutation from
# `docs/research/reports/2026-09-10-codex-model-provenance-advisor.md`'s own
# FAIL-arms table, not a renamed definition.

suites = [
  "tests/test_codex_review_evidence.py",
  "tests/test_codex_lane.py",
  "tests/test_review.py",
]

[[arm]]
id = "C0"
control = true
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''ADAPTER_VERSION = 1'''
new = '''ADAPTER_VERSION = 1  # control'''

# A1 — home+parent binding. Dropping the parent-thread_id equality would let
# ANY rollout under sessions/ match, not just the one bound to this attempt's
# own banner — the exact "hardcode / drop the parent equality" mutation the
# advisor's table names.
[[arm]]
id = "A1"
test = "test_zero_matching_children_is_unavailable"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''        if payload.get("parent_thread_id") != parent_session_id:
            continue'''
new = '''        if False:
            continue'''

# A2 — the other half of the same binding: source == {"subagent": "review"}.
# Without it, an ordinary `exec` child sharing the parent would be read as the
# reviewer sub-agent.
[[arm]]
id = "A2"
test = "test_a_matching_child_with_the_wrong_source_does_not_count"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''        if payload.get("source") != {"subagent": "review"}:
            continue'''
new = '''        if False:
            continue'''

# A3 — complete, unique discovery. "Accept first hit" on an ambiguous match is
# the advisor's own named production mutation: silently picking `hits[0]`
# instead of refusing turns a genuine ambiguity into a confident wrong answer.
[[arm]]
id = "A3"
test = "test_two_matching_children_is_ambiguous_not_a_guess"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''        if len(hits) > 1:
            named = ", ".join(str(h) for h in hits)
            return Unavailable(
                UnavailableReason.ambiguous_child_rollout,
                f"{len(hits)} rollouts bind to parent {parent_session_id}: {named}"[
                    :_MAX_DIAGNOSTICS
                ],
            )'''
new = '''        if len(hits) > 1:
            return _resolve_child(attempt, parent_session_id, hits[0])'''

# A4 — lane/model agreement: "read only the first turn". `turn_models` and
# `resolved_model` both depend on scanning every turn_context record.
[[arm]]
id = "A4"
test = "test_a_later_turn_changing_model_is_recorded_not_dropped"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''        model = payload.get("model")
        if isinstance(model, str) and model:
            models.append(model)
    return models'''
new = '''        model = payload.get("model")
        if isinstance(model, str) and model:
            models.append(model)
    return models[:1]'''

# A5 — required schema: "default a missing model to the requested one". A
# turn_context record with no `model` key must be Unavailable, never
# silently filled in from what the caller asked for.
[[arm]]
id = "A5"
test = "test_a_turn_context_with_no_model_field_is_unavailable"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''        return Unavailable(
            UnavailableReason.missing_model_field,
            f"{child_path}'s turn_context record(s) carry no model field"[:_MAX_DIAGNOSTICS],
        )'''
new = '''        return Resolved(
            CodexReviewEvidence(
                schema_version=SCHEMA_VERSION,
                adapter_version=ADAPTER_VERSION,
                attempt_id=attempt.attempt_id,
                codex_home=attempt.codex_home,
                cli_version=attempt.cli_version,
                requested_model=attempt.requested_model,
                requested_effort=attempt.requested_effort,
                base_ref=attempt.base_ref,
                subprocess_rc=attempt.subprocess_rc,
                timed_out=attempt.timed_out,
                output_path=str(attempt.output_path) if attempt.output_path else None,
                outcome=OutcomeKind.resolved,
                parent_session_id=parent_session_id,
                child_rollout_path=str(child_path),
                turn_models=[],
                resolved_model=attempt.requested_model,
                review_completion=ReviewCompletion.unknown,
                unavailable_reason=None,
                error_kind=None,
                diagnostics=None,
            )
        )'''

# A6 — review completion: "ignore exit/terminal outcome because a model was
# observed". Model-observed and review-happened are two independent facts
# (the advisor's own sharpest catch, from its own bogus-slug arm) — collapsing
# an aborted review to `complete` loses exactly that distinction.
[[arm]]
id = "A6"
test = "test_an_api_rejected_review_is_recorded_aborted"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''        outcome = (
            ReviewCompletion.aborted if has_error or not has_message else ReviewCompletion.complete
        )'''
new = '''        outcome = ReviewCompletion.complete'''

# A7 — resolver failure: "catch-and-return-success" for a genuine permission
# error. This is a regression arm for the fix in this same change — without
# the `os.scandir` preflight, `Path.rglob` silently SKIPS an unreadable
# directory rather than raising, so a real permission failure reads as
# "nothing found" (Unavailable) instead of "could not look" (Error). Measured
# live on this host before the preflight was added.
[[arm]]
id = "A7"
test = "test_an_unreadable_sessions_dir_is_a_typed_error"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''    with os.scandir(sessions_root) as _preflight:
        next(_preflight, None)
    hits: list[Path] = []'''
new = '''    hits: list[Path] = []'''

# A8 — receipt binding: "make evidence optional" the OTHER way — a resolved
# outcome silently degrading to the honest label anyway would hide real
# evidence that exists. `receipt_reference` must return the attempt id
# whenever (and ONLY whenever) the outcome is actually `resolved`.
[[arm]]
id = "A8"
test = "test_receipt_reference_is_model_unverified_otherwise"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''    if record.outcome is OutcomeKind.resolved:
        return record.attempt_id
    return "model-unverified"'''
new = '''    return record.attempt_id'''

# A9 — the diagnostics bound (#750's own explicit ask: "bound the diagnostics
# field"). Dropping the truncation lets an unbounded string — a full
# traceback, a long path list — reach disk.
[[arm]]
id = "A9"
test = "test_diagnostics_are_bounded"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''        diagnostics=result.diagnostics[:_MAX_DIAGNOSTICS],
    )'''
new = '''        diagnostics=result.diagnostics,
    )'''

# A10 — the receipt actually carries the field at all. Phase 1's headline
# requirement ("the receipt carries the evidence OR model-unverified") is
# worth nothing if the payload silently drops the key.
[[arm]]
id = "A10"
test = "test_codex_evidence_survives_a_write_read_roundtrip"
file = "python/src/kb_setup/review.py"
old = '''            "codex_evidence": list(self.codex_evidence),'''
new = '''            # "codex_evidence": list(self.codex_evidence),'''

# A11 — THE OUTAGE ARM's own regression guard: removing `_run_review`'s outer
# try/except must break the test that exists specifically to prove evidence
# capture can never cost the lane its own exit code.
[[arm]]
id = "A11"
test = "test_run_review_returns_the_lanes_own_rc_even_when_evidence_capture_raises"
file = "python/src/kb_setup/codex_run.py"
old = '''    try:
        from kb_setup import codex_review_evidence as evidence

        evidence.capture_and_persist(
            Path.cwd(),
            requested_model=args.model,
            requested_effort=args.effort,
            base_ref=args.base,
            subprocess_rc=rc,
            timed_out=rc == _RC_TIMED_OUT,
            output_path=output_path,
        )
    except Exception as exc:
        print(
            f"kb-codex --review: evidence capture unavailable (outer guard): {exc}",
            file=sys.stderr,
        )'''
new = '''    from kb_setup import codex_review_evidence as evidence

    evidence.capture_and_persist(
        Path.cwd(),
        requested_model=args.model,
        requested_effort=args.effort,
        base_ref=args.base,
        subprocess_rc=rc,
        timed_out=rc == _RC_TIMED_OUT,
        output_path=output_path,
    )'''

# NOT ARMED, stated rather than assumed covered:
#
#   1. `capture_and_persist`'s OWN inner `except Exception` (the module's one
#      BLE001 exemption). `test_capture_and_persist_never_raises_on_an_
#      unanticipated_failure` already exercises it directly via monkeypatch —
#      a source-level mutation would just be deleting a try/except, which
#      `kb-arms`' `old`/`new` string match handles no more informatively than
#      that existing test already proves.
#   2. The retry/backoff timing (`_RETRY_ATTEMPTS`/`_RETRY_DELAY_SECONDS`).
#      `test_a_delayed_child_resolves_within_the_retry_budget` already proves
#      the PASS direction with a real thread and a real sleep; there is no
#      single-line mutation that isolates "retries too few times" from
#      "retries work at all" without reintroducing timing flakiness into the
#      arms suite itself.

# ---------------------------------------------------------------------------
# ROUND 1 of the cold antigravity review of `3cc9c93a`, and the arms for the
# ORCHESTRATOR's own fixes to it — the least-reviewed code in the diff.
#
# Two of agy's six findings survived reconciliation. Both are one class, and it
# is the class this module already solved once: an environment fault folded into
# an ordinary absence. `_candidate_children` carries an `os.scandir` preflight
# for exactly that reason, and the same lesson was NOT applied at the two sites
# below — one module, one class, two answers.
#
# Three of the six were rejected as false positives, with reasons: reading
# `$CODEX_HOME/sessions` is the design rather than an escape from the repo, and
# the two broad `except Exception` guards are deliberate, pyproject-exempted,
# and are the ticket's central invariant (A11 exists to prove one holds).
# A fourth is real-but-minor and deliberately unfixed: `_completion`'s
# `bool(last_agent_message)` conflates None with "", but errs toward `aborted`,
# never toward a false `complete`.
#
# ⚠️ Every `old` pattern below was re-derived AFTER the fixes landed, because
# a previous edit to this same file was silently reverted by a concurrent
# `kb-arms` run (#751). Arms and edits do not overlap; check `pgrep` first.

# D1 — the tee read. Restore the fold agy rejected: swallow the OSError and
# return None, so an EACCES tee reads as "no session id" and the caller reports
# `Unavailable`. The realistic break, because it is the literal pre-fix code.
[[arm]]
id = "D1"
test = "test_an_unreadable_tee_is_an_error_not_an_absent_flag"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''    text = output_path.read_text(encoding="utf-8", errors="replace")
    text = _ANSI_RE.sub("", text)'''
new = '''    try:
        text = output_path.read_text(encoding="utf-8", errors="replace")
    except OSError:
        return None
    text = _ANSI_RE.sub("", text)'''

# D2 — the caller. Keep the raise but drop the handler, so the OSError escapes
# `resolve_reviewer_model` instead of becoming a typed Error. This is the
# SEPARATE half: D1 proves the raise exists, D2 proves it is CLASSIFIED.
[[arm]]
id = "D2"
test = "test_an_unreadable_tee_is_an_error_not_an_absent_flag"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''        return Error(
            ErrorKind.resolver_io_error,
            f"could not read the tee at {attempt.output_path}: {exc}"[:_MAX_DIAGNOSTICS],
        )'''
new = '''        raise'''

# D3 — the candidate open. Restore `continue`, so an unreadable matching child
# vanishes and the scan reports "zero children" — a fault as an absence.
[[arm]]
id = "D3"
test = "test_an_unreadable_candidate_is_an_error_not_zero_children"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''            raise OSError(f"could not read candidate rollout {path}: {exc}") from exc'''
new = '''            continue'''

# D4 — the CONTROL FOR THE FIX ITSELF, not a no-op. If the fix over-corrected and
# made every unreadable-ish case an Error, the "read fine, no session id" test
# would also demand Error and this mutation could not kill it. Making that path
# return Error too must break the control test — proving the fix discriminates
# rather than having traded one conflation for its mirror.
[[arm]]
id = "D4"
test = "test_a_readable_tee_with_no_session_id_is_still_unavailable"
file = "python/src/kb_setup/codex_review_evidence.py"
old = '''        return Unavailable(
            UnavailableReason.banner_session_id_unavailable,'''
new = '''        return Error(
            ErrorKind.resolver_io_error,'''
