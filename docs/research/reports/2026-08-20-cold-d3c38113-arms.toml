# ── F8: every parallel tool_use in one record, not just the first ──────────
# The realistic break is the original code: `return` inside the loop. It reads
# as correct for the common single-call record and silently drops the rest — and
# this codebase issues parallel Bash calls constantly, so the tool reported a
# quieter window than actually occurred, in a module whose only job is reporting
# what ran.
[[arm]]
id = "F8"
test = "test_every_parallel_tool_call_in_one_record_is_reported"
