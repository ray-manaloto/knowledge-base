# ══ PR #406 THIRD bot pass (graphify-labs on f4fa88ed) ═════════════════════
# 4 findings; 2 REFUTED. Both refutations were "high" severity and BOTH anchored
# at `:312` — of two different files. A repeated line number across unrelated
# files is itself evidence the anchor is fabricated, and both files parse, hold
# no stray name and no unterminated docstring, with the suite green.
#
# The two real ones are ONE defect: a valued flag with nothing after it.

# ── F10: a valued flag at the END of argv is refused, not swallowed ────────
# `[target, "--window"]` left `pending` empty, so `--window` fell through to
# `positional` and became the TARGET PATH — the caller's flag silently ignored
# and the DEFAULT window searched, then reported as if it had answered. This is
# the same failure the not-a-number guard (F9) exists to prevent; that guard
# covered only half the pair, which is why the mutation here restores the `and
# pending` form rather than deleting the check.
[[arm]]
id = "F10"
test = "test_a_flag_at_the_end_of_argv_is_refused_not_swallowed"
file = "python/src/kb_setup/write_attribution.py"
old = '''            if not pending:
                print(f"write-attribution: {item} needs a value")
                return int(Rc.NOT_RUN)'''
new = '''            if not pending:
                pass'''

# ── F11: the SAME guard must cover `--transcripts` ─────────────────────────
# The first parser handled `--window`/`--limit` as a set and `--transcripts` on
# its own `elif`, so a guard written for the pair would have missed the third.
# A finding is a SAMPLE of a class; this arm is the class.
[[arm]]
id = "F11"
test = "test_the_transcripts_flag_is_covered_by_the_same_guard"
file = "python/src/kb_setup/write_attribution.py"
old = '''    valued = {"--window", "--limit", "--transcripts"}'''
new = '''    valued = {"--window", "--limit"}'''

# ══ PR #406 FOURTH bot pass (graphify-labs on 851949be) ════════════════════
# 5 findings: 2 real, 1 not-a-defect ("no-arg kb-gates now runs an additional
# gate" — that IS the feature), and the `:312` phantom AGAIN, twice, now three
# passes running. Across four passes: 17 findings, 5 refuted, 11 real, 1 no-op.

# ── F12: the pgid is the PID, never a lookup ──────────────────────────────
# `os.getpgid(proc.pid)` fails exactly when the leader has already exited — the
# case where the group still holds the WEDGED GRANDCHILDREN this function exists
# to kill. The lookup failing dropped us to `proc.kill()`, reaping a dead leader
# and leaving the linters running. Under `start_new_session` the pgid EQUALS the
# pid, so the lookup was never needed. The fixture stubs `getpgid` to RAISE, so
# this mutation cannot pass by accident.
[[arm]]
id = "F12"
test = "test_timeout_kills_the_whole_process_group"
file = "python/src/kb_setup/hk_test.py"
old = '''        os.killpg(proc.pid, signal.SIGKILL)'''
new = '''        os.killpg(os.getpgid(proc.pid), signal.SIGKILL)'''

# ── F13: an UNREADABLE transcript is not an empty one ─────────────────────
# `events_in` caught OSError and returned, so a file nobody could read
# contributed no events and counted as SCANNED — reporting a permissions problem
# as "nothing ran in this window". That is the DRIFT/SKIP/OK collapse this whole
# module exists to refuse, inside the module itself.
[[arm]]
id = "F13"
test = "test_an_unreadable_transcript_is_counted_not_swallowed"
file = "python/src/kb_setup/write_attribution.py"
old = '''            unreadable += 1'''
new = '''            pass'''

