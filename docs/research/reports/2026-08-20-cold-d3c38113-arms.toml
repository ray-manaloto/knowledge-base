# Mutation arms for the CODE fixes made against the cold review of
# `d3c381139f2b37d9c06fb07516bc8e741bb18c1d` (lane `cold:codex`, batches 1-3,
# 8 findings, 0 blocking).
#
# Each arm reverts one fix to the shape the reviewer cited, and the test written
# alongside that fix must go RED. A SURVIVOR does not mean the fix is fine — it
# means the test cannot fail, which is the class no sweep over production code
# can otherwise see, because the arm mutates production while the blindness is
# in the test (kb-review SKILL.md § "Arm your own fixes").
#
# SCOPE, stated so a clean sweep is not over-read. Three of the eight findings
# are NOT code and have no arm here:
#   - the `currency.toml` comment whose stated rationale was false (prose)
#   - the `HK_TIMING_JSON` static-path collision (config)
#   - the memory-file "11 tests" vs CLAUDE.md "46" ambiguity (prose)
# A green run below covers the four python fixes plus the timeout-ordering guard.
#
# WHAT A CLEAN SWEEP WOULD NOT MEAN: it says these four assertions can fail. It
# says nothing about whether killing the process group is the RIGHT remedy for a
# wedged linter, nor whether `_MIN_TESTS = 40` is the right floor — an arm
# measures the TESTS, never the premise.

# Every file holding a test named by an arm below. F6 SURVIVED on its first run
# purely because `test_write_attribution.py` was missing here — the mutation
# applied, the named test never ran, and the report read "no test fails under
# this mutation". A hand-run of the same mutation failed BOTH its tests. That is
# the arm-measuring-something-its-id-does-not-name failure, and the fix is to
# keep this list in step with the arms rather than to trust a survivor.
suites = [
  "tests/test_hk_test.py",
  "tests/test_gates.py",
  "tests/test_write_attribution.py",
]

# ── the control ────────────────────────────────────────────────────────────
[[arm]]
id = "C0"
control = true
file = "python/src/kb_setup/hk_test.py"
old = '''_KILL_GRACE = 5'''
new = '''_KILL_GRACE = 5  # control'''

# ── F1: the timeout must kill the process GROUP, not just hk ───────────────
# The realistic break is not deleting the call — it is "simplifying" it back to
# the `Popen.kill()` that looks equivalent and signals the direct child only,
# leaving the wedged linter alive holding the pipes.
[[arm]]
id = "F1"
test = "test_timeout_kills_the_whole_process_group"
file = "python/src/kb_setup/hk_test.py"
old = '''        os.killpg(proc.pid, signal.SIGKILL)'''
new = '''        proc.kill()'''

# ── F2: `start_new_session` is what MAKES the group addressable ────────────
# Dropping it is the quieter half of the same defect: `killpg` still runs, still
# looks correct in a diff, and now signals the group the test runner is in.
[[arm]]
id = "F2"
test = "test_it_spawns_in_its_own_session_or_the_group_kill_cannot_work"
file = "python/src/kb_setup/hk_test.py"
old = '''            start_new_session=True,'''
new = '''            start_new_session=False,'''

# ── F3: a hang must still print what hk managed to say ─────────────────────
# The break that actually happened: the branch returned the Err without printing
# the partial output, so the one failure with nothing else to go on produced no
# diagnostic. Reverting the print is exactly the pre-fix code.
[[arm]]
id = "F3"
test = "test_timeout_prints_the_partial_output_it_captured"
file = "python/src/kb_setup/hk_test.py"
old = '''            if partial:
                print(partial)'''
new = '''            if partial and False:
                print(partial)'''

# ── F4: undecodable linter output is NOT_RUN, not a crash ──────────────────
# `gates.py:282` already handles this for `git status`. The realistic break is a
# reviewer "tidying" the tuple back to the two obvious exceptions, since
# UnicodeDecodeError is neither an OSError nor a SubprocessError and reads as a
# mistake to anyone who has not hit it.
[[arm]]
id = "F4"
test = "test_undecodable_output_is_not_run_not_a_crash"
file = "python/src/kb_setup/hk_test.py"
old = '''    except (OSError, subprocess.SubprocessError, UnicodeDecodeError) as exc:'''
new = '''    except (OSError, subprocess.SubprocessError) as exc:'''

# ── F5: the inner gate bound must stay strictly under the outer one ────────
# The realistic break is the one that already happened: someone raises a slow
# gate's bound to the round number that matches `_GATE_TIMEOUT`. It looks like a
# matching pair and is actually a race. Mutating the CONFIG, not the checker,
# because the checker is what must notice.
[[arm]]
id = "F5"
test = "test_every_gate_task_bound_is_strictly_under_the_outer_gate_timeout"
file = "mise.toml"
old = '''# `tests/test_gates.py` asserts the ordering for every GATE_TASK.
timeout = "25m"'''
new = '''# `tests/test_gates.py` asserts the ordering for every GATE_TASK.
timeout = "30m"'''

# ══ PR #406 bot findings (graphify-labs + CodeRabbit, both confirmed) ═══════

# ── F6: an offsetless transcript timestamp must not crash the scan ─────────
# BOTH bots found this independently and a control arm confirmed it:
# `naive - aware` raises TypeError, so ONE offsetless line anywhere aborted the
# whole run. The realistic break is the exact edit that caused it — ruff flagged
# the `.replace("Z", "+00:00")` as redundant (it is, on 3.11+), and removing it
# looked like a pure cleanup while deleting the only thing that guaranteed a
# tzinfo. So the mutation is "return what fromisoformat gave you".
[[arm]]
id = "F6"
test = "test_an_offsetless_timestamp_does_not_crash_the_scan"
file = "python/src/kb_setup/write_attribution.py"
old = '''    return parsed if parsed.tzinfo is not None else parsed.replace(tzinfo=UTC)'''
new = '''    return parsed'''

# ── F7: no unbounded wait on any path out of `run` ─────────────────────────
# `Popen.__exit__` calls `wait()` with NO timeout. Using `with` reads as the
# tidier, more idiomatic form — which is exactly why it is the realistic
# regression — and it reintroduces the hang the timeout exists to bound, one
# frame later. The fake `_Proc` deliberately has no `__enter__`/`__exit__`, so a
# revert to `with` fails rather than silently passing.
[[arm]]
id = "F7"
test = "test_the_pipes_are_closed_even_on_the_happy_path"
file = "python/src/kb_setup/hk_test.py"
old = '''        finally:
            _close_pipes(proc)'''
new = '''        finally:
            pass'''

