# Mutation arms for the graph-first DENY guard (#253).
#
# Each row breaks ONE thing REALISTICALLY — the wiring line that calls a check,
# or the exact prior spelling of a line a fix corrected — and the named test must
# go RED. A check whose test still passes without it is decoration
# (`mutation-arms-are-a-floor-not-a-ceiling`).
#
# Two rows are not hypothetical. `lstrip-instead-of-removeprefix` and
# `git-grep-routed-to-grep` are the code AS FIRST WRITTEN: both shipped in the
# first draft, both were caught by this suite's ALLOW/DENY arms within a minute
# of each other, and both are pinned here so the same slip cannot return
# unnoticed. That is the point of arming your own fixes rather than only the
# reviewer's (`a-remedy-needs-its-own-arm`).
#
# What these arms CANNOT measure: whether denying broad searches actually moves
# the graph-first ratio. That is a claim about behaviour, and the control for it
# is `mise run kb-session-reflect` on the session that implements this
# (acceptance criterion 6) — not a green sweep here
# (`mutation-arms-cannot-measure-the-premise`).

suites = ["tests/test_graph_first.py", "tests/test_hook_guard.py"]

[[arm]]
id = "control"
control = true
file = "python/src/kb_setup/graph_first.py"
old = '_SOURCE_EXT = frozenset({".py", ".pkl", ".toml", ".js", ".ts"})'
new = '_SOURCE_EXT = frozenset({".py", ".pkl", ".toml", ".js", ".ts"})  # inert control edit'

# --- the wiring, which is the FAIL arm the ticket asks for -------------------

# Rule 4 of #253, and `probes-need-a-control-arm.md` rule 2: delete the line
# that CALLS the check, not the definition. A renamed definition leaves the
# original as a substring and proves nothing.
[[arm]]
id = "hook-never-calls-the-guard"
test = "test_the_hook_denies_a_broad_search_and_a_query_unblocks_it"
file = "python/src/kb_setup/hook_guard.py"
old = """        reason = _graph_first(payload, tool_name, tool_input)"""
new = """        reason = None"""

# The Bash branch returns immediately after a graphify deny. Without that, a
# hand-run graphify would emit the graphify redirect AND fall through, printing a
# second JSON object — a malformed hook response no "was it denied" assertion
# would catch.
[[arm]]
#
# This arm SURVIVED on its first run against
# `test_the_graphify_redirect_still_wins_over_this_guard`, and the survivor was
# a no-op rather than a dead line: `graphify label` is not also a search, so
# nothing fell through to emit a second decision. The command that exhibits the
# harm has to trip BOTH guards at once, which is the test named below.
id = "graphify-deny-falls-through"
test = "test_a_command_tripping_both_guards_emits_exactly_one_decision"
file = "python/src/kb_setup/hook_guard.py"
old = """            _deny(reason)
            return 0"""
new = """            _deny(reason)"""

# --- the session marker ------------------------------------------------------

[[arm]]
id = "state-never-consulted"
test = "test_a_query_marks_the_session_and_nothing_else_does"
file = "python/src/kb_setup/graph_first.py"
old = """        return _state_path(root, session_id).exists()"""
new = """        return True"""

# Marking on ANY command hands out the unblock for free — the escape hatch Ray
# explicitly rejected, arriving by accident rather than by design.
[[arm]]
id = "any-command-counts-as-a-query"
test = "test_a_query_marks_the_session_and_nothing_else_does"
file = "python/src/kb_setup/graph_first.py"
old = """    if not session_id or not _GRAPH_QUERY.search(command):
        return"""
new = """    if not session_id:
        return"""

# `graphify query` is DENIED by hook_guard, so it never runs and cannot orient
# anyone. Admitting it to the query pattern is the same free unblock by a
# different route.
[[arm]]
id = "denied-graphify-query-counts"
test = "test_a_denied_graphify_query_does_not_earn_the_unblock"
file = "python/src/kb_setup/graph_first.py"
old = '''_GRAPH_QUERY = re.compile(r"\bmise\s+run\s+kb-query\b|\bgraphify\s+(?:explain|path|god-nodes)\b")'''
new = '''_GRAPH_QUERY = re.compile(r"\bmise\s+run\s+kb-query\b|\bgraphify\s+(?:query|explain|path|god-nodes)\b")'''

# The session id IS the invalidation rule. A shared marker would unblock every
# future session from one query, which is not the directive's scope.
[[arm]]
id = "marker-not-scoped-to-a-session"
test = "test_the_marker_is_scoped_to_one_session"
file = "python/src/kb_setup/graph_first.py"
old = '''    return root / ".agent" / "state" / "graph-first" / f"{session_id}.queried"'''
new = '''    return root / ".agent" / "state" / "graph-first" / "shared.queried"'''

# --- the two defects this guard actually shipped with ------------------------

# AS FIRST WRITTEN. `lstrip` strips a character SET, so `.agent/plans/` lost its
# leading dot and a prose root was graded as source.
[[arm]]
id = "lstrip-instead-of-removeprefix"
test = "test_allows_targeted_prose_and_piped_searches"
file = "python/src/kb_setup/graph_first.py"
old = '''    clean = target.removeprefix("./").rstrip("/")'''
new = '''    clean = target.lstrip("./").rstrip("/")'''

# AS FIRST WRITTEN. Routing `git grep` through the `grep` branch asked for a
# `-r` it never carries, so every repo-wide `git grep` was allowed.
[[arm]]
id = "git-grep-routed-to-grep"
test = "test_denies_a_broad_source_search_before_any_query"
file = "python/src/kb_setup/graph_first.py"
old = '''        words, head, rest = [words[0], *rest[1:]], "rg", rest[1:]'''
new = '''        words, head, rest = [words[0], *rest[1:]], "grep", rest[1:]'''

# --- the ALLOW arm, which is the direction this guard family actually fails ---

# A searcher after a pipe reads bytes already in hand. Denying it punishes the
# habit the guard exists to encourage — the same shape as `session_reflect`'s
# `_last_arg` calling two properly-armed probes UNARMED.
[[arm]]
id = "a-pipe-is-treated-as-a-tree-walk"
test = "test_allows_targeted_prose_and_piped_searches"
file = "python/src/kb_setup/graph_first.py"
old = """    if piped:
        return None"""
new = """    if False:
        return None"""

# A heredoc body is DATA. hook_guard denied the very commit message documenting
# itself by reading one as code; this guard inherits both the pattern and the
# lesson.
[[arm]]
id = "heredoc-body-read-as-commands"
test = "test_allows_targeted_prose_and_piped_searches"
file = "python/src/kb_setup/graph_first.py"
old = """    body = HEREDOC.split(command, maxsplit=1)[0]"""
new = """    body = command"""

# Ray's scope in one line: ONE file is targeted work, not orientation.
[[arm]]
id = "a-single-file-target-is-not-honoured"
test = "test_allows_targeted_prose_and_piped_searches"
file = "python/src/kb_setup/graph_first.py"
old = """    if paths and all(_is_single_file(p, cwd) or _is_prose_target(p, cwd) for p in paths):
        return None"""
new = """    if False:
        return None"""

# A `--glob`/`--type` restriction that cannot match a source extension means the
# walk cannot reach source.
[[arm]]
id = "glob-restriction-ignored"
test = "test_allows_targeted_prose_and_piped_searches"
file = "python/src/kb_setup/graph_first.py"
old = """    if not recursive or _restricted_to_prose(words):
        return None"""
new = """    if not recursive:
        return None"""

# --- the Grep TOOL, which no Bash probe can reach ----------------------------

[[arm]]
id = "grep-tool-branch-removed"
test = "test_denies_a_broad_grep_tool_call"
file = "python/src/kb_setup/graph_first.py"
old = """    if tool_name == "Grep":"""
new = """    if False:"""

[[arm]]
id = "grep-tool-path-not-honoured"
test = "test_allows_a_targeted_or_prose_grep_tool_call"
file = "python/src/kb_setup/graph_first.py"
old = """    if (
        isinstance(path, str)
        and path
        and (_is_single_file(path, cwd) or _is_prose_target(path, cwd))
    ):
        return None"""
new = """    if False:
        return None"""

# --- ROUND 1 FIX ARMS: the four cold-lane findings against 599584a ------------
#
# Each reverts the fix to the code AS SHIPPED — the realistic break, since it is
# literally what was there. `a-remedy-needs-its-own-arm`: a fix is the
# least-reviewed code in the diff, and two of these four were introduced by the
# same wrong idea (identify a path by POSITION), so a shared root cause gets two
# independent arms rather than one.

# P1. `rg --sort path decide` was ALLOWED: an unlisted value-flag shifted the
# positional split, so the pattern was read as a path.
[[arm]]
id = "paths-identified-by-position-not-shape"
test = "test_denies_a_broad_source_search_before_any_query"
file = "python/src/kb_setup/graph_first.py"
old = """        if _looks_like_a_path(word, cwd):
            paths.append(word)
    return paths"""
new = """        paths.append(word)
    return paths[1:]"""

# P2, the same defect from the other side: `-e` consumes the pattern, so the
# unconditional "drop the first positional" dropped the real file.
[[arm]]
id = "first-positional-dropped-as-the-pattern"
test = "test_allows_targeted_prose_and_piped_searches"
file = "python/src/kb_setup/graph_first.py"
old = """        if _looks_like_a_path(word, cwd):
            paths.append(word)
    return paths"""
new = """        paths.append(word)
    return paths[1:]"""

# P1. A negated glob names what a walk SKIPS, so the extension test answers it
# backwards. `rg -g '!*.md' decide .` reaches every source file.
[[arm]]
id = "negated-glob-read-as-a-restriction"
test = "test_denies_a_broad_source_search_before_any_query"
file = "python/src/kb_setup/graph_first.py"
old = """    if not values or any(v.startswith(("!", "^")) for v in values):
        return False"""
new = """    if not values:
        return False"""

# P2. A regex cannot see quoting, so `git commit -m "docs && rg decide"` split
# into a segment that read as a search and was DENIED.
[[arm]]
id = "segments-split-without-quote-awareness"
test = "test_allows_targeted_prose_and_piped_searches"
file = "python/src/kb_setup/graph_first.py"
old = """        elif ch in "'\\"":
            quote = ch"""
new = """        elif False:
            quote = ch"""
