# Mutation arms for the eight cold cross-family findings closed on #331.
#
# WHY THESE EXIST AND NOT JUST THE SUITE. Every test armed below was written by
# the same session, in the same turn, as the fix it covers — the shape
# `.claude/rules/probes-need-a-control-arm.md` rule 2 names as least-reviewed. A
# test written alongside its own fix routinely cannot fail, and reading it cannot
# tell you so. These arms revert each fix and check the suite goes red NAMING the
# right test.
#
# THE SUITE LIST IS DELIBERATELY MISSING `tests/test_graphify_semantic_corpus.py`,
# and that is not an oversight. `runner_sha256`, `semantic_slice_sha256` and
# `adapter_sha256` are digests of the very files these arms mutate, and they live
# inside `execution-config.json`, which `AUTHORITY_JSON` is a digest of. So ANY
# byte change to those modules — including the control arm's inert comment —
# invalidates the authorization and fails
# `test_recorded_authority_authorizes_this_plan_and_only_this_plan`. Including
# that suite does not add a row; it breaks the CONTROL, which makes every other
# row unreadable. Measured on 2026-08-16, recorded, and obeyed here.
#
# The cost of that split, stated rather than hidden: no arm below says anything
# about whether the authorization notices a code change. One dedicated test
# already covers exactly that, and it is the test this split excludes.
#
# WHAT A CLEAN SWEEP HERE WOULD AND WOULD NOT MEAN. It is a statement about the
# TESTS, never about the premise. Specifically it does NOT establish:
#
#   * that finding 3's remedy is right. Collapsing `resumed` into `repaid` rests
#     on a MEASUREMENT of the pinned graphify — that `extract_corpus_parallel`
#     has no cache read in its call chain — and no mutation of this repo can
#     confirm or refute a fact about a dependency. If graphify adds a cache read,
#     every arm below still passes and the accounting silently becomes wrong
#     again in the other direction.
#   * that the truncation hint will keep working. That rests on graphify's
#     private marker list, and the only thing guarding it is
#     `test_the_installed_graphify_classifies_our_truncation_hint_as_retryable`,
#     which is armed here for its own logic but cannot predict an upstream
#     reword.
#   * anything about findings 6 or 8. Finding 6 was two stale version stamps
#     (data, not code) and finding 8 a false comment; neither has a mutation.
#     Their evidence is the refreshed stamp files and the corrected comment, and
#     saying so beats an arm that pretends to cover them.
#
# EVERY ARM IS A REALISTIC BREAK. The recurring temptation across these fixes is
# "this check is redundant, the next layer catches it" — which is precisely the
# reasoning that left the original verifier uncalled. A renamed symbol is never
# used: it leaves the original as a substring and proves nothing.

suites = [
  "tests/test_graphify_semantic_corpus_run.py",
  "tests/test_graphify_semantic_slice.py",
]

[[arm]]
id = "control"
control = true
file = "python/src/kb_setup/graphify_semantic_corpus_run.py"
old = "    outcomes: list[ChunkOutcome] = []"
new = "    outcomes: list[ChunkOutcome] = []  # inert control edit"

# --------------------------------------------------------------------------
# Finding 1 — a stage directory was trusted because it EXISTED
# --------------------------------------------------------------------------

# The original defect, restored exactly: decide "already staged" from the
# filesystem rather than from the evidence. This is what let an unrelated
# directory stand in for all 58 stages and still exit 0.
[[arm]]
id = "stage-existence-replaces-verification"
test = "test_a_stage_directory_that_is_not_this_chunks_evidence_is_a_failure"
file = "python/src/kb_setup/graphify_semantic_corpus_run.py"
old = "            staged[chunk.ordinal] = () if verification.state == \"complete\" else verification.reasons"
new = "            staged[chunk.ordinal] = ()"

# The HALF-FIX, and the more likely one to be written by someone tidying up: the
# failure is still recorded, but the chunk also counts as staged. `failed == 1`
# passes, and the completeness gate goes green over a hole in the corpus. This is
# why the test asserts `repaid == 0` and not merely that a failure appeared.
[[arm]]
id = "unverifiable-stage-recorded-as-failed-and-still-counted"
test = "test_a_stage_directory_that_is_not_this_chunks_evidence_is_a_failure"
file = "python/src/kb_setup/graphify_semantic_corpus_run.py"
old = "                    return\n                # REPAID, with no \"resumed\" alternative"
new = "                    repaid.append(chunk.ordinal)\n                    return\n                # REPAID, with no \"resumed\" alternative"

# --------------------------------------------------------------------------
# Finding 2 — the callback guard checked RANGE, not ordinal uniqueness
# --------------------------------------------------------------------------

# Delete the uniqueness check and keep the range check, which is the exact state
# the cold lane found: 58 callbacks over 57 unique indices reporting
# `skipped=0, failed=0, success`.
[[arm]]
id = "callback-uniqueness-check-removed"
test = "test_one_callback_per_chunk_is_enforced_rather_than_assumed"
file = "python/src/kb_setup/graphify_semantic_corpus_run.py"
old = "            if index in visited:\n                raise ValueError(f\"provider chunk callback repeated index {index}\")\n            visited.add(index)"
new = "            visited.add(index)"

# --------------------------------------------------------------------------
# Finding 4 — adaptive retries were inert for truncation
# --------------------------------------------------------------------------

# Collapse truncation back into the generic refusal. graphify then cannot tell a
# too-long chunk from a malformed one, and `graphify_max_retry_depth=2` goes
# inert for the single failure it was raised to survive.
[[arm]]
id = "truncation-collapsed-into-the-generic-refusal"
test = "test_success_envelope_fails_closed_one_field_at_a_time"
file = "python/src/kb_setup/graphify_semantic_slice.py"
old = "            TRUNCATED_STOP_REASON if stop_reason == \"max_tokens\" else \"stop-reason-invalid\","
new = "            \"stop-reason-invalid\","

# The hint stops being emitted while the reason survives. Nothing about the
# refusal changes — only graphify's ability to classify it — so this is the
# quietest available way to reintroduce the finding, and it is why the decision
# was pulled out of the adapter into a function a test can reach at all.
[[arm]]
id = "truncation-hint-never-emitted"
test = "test_only_a_truncation_refusal_earns_the_retry_hint"
file = "python/src/kb_setup/graphify_semantic_slice.py"
old = "    return TRUNCATION_RETRY_HINT if TRUNCATED_STOP_REASON in reasons else None"
new = "    return None"

# The opposite error, and the more expensive one: hint on EVERY refusal, so
# graphify bisects chunks whose halves fail identically and burns the retry
# budget to reach the same answer.
[[arm]]
id = "truncation-hint-emitted-for-every-refusal"
test = "test_only_a_truncation_refusal_earns_the_retry_hint"
file = "python/src/kb_setup/graphify_semantic_slice.py"
old = "    return TRUNCATION_RETRY_HINT if TRUNCATED_STOP_REASON in reasons else None"
new = "    return TRUNCATION_RETRY_HINT"

# The coupling test itself, armed. It is the only thing standing between an
# upstream reword and this recovery dying silently, so a version of it that
# cannot fail is worse than none — it would report the coupling as guarded.
[[arm]]
id = "graphify-classification-probe-cannot-discriminate"
test = "test_the_installed_graphify_classifies_our_truncation_hint_as_retryable"
file = "python/src/kb_setup/graphify_semantic_slice.py"
old = "    \"the model stopped at max_completion_tokens: this chunk's prompt is too long \"\n    \"for one response and must be extracted in halves\""
new = "    \"the model stopped early and the chunk must be extracted in halves\""

# ==========================================================================
# ROUND 2 — the cold codex lane's findings on the fix commit itself
#
# The first round's fixes went to a real `codex exec` cross-family lane (verified
# by process tree, not by a label). It returned 5 findings, 1 HIGH, on the FIX
# COMMIT — which is the shape `.claude/rules` keeps naming: a fix is the
# least-reviewed code in a diff, and one of these was CAUSED by a fix above.
#
# The HIGH deserves its own note. graphify's adaptive retry bisects a chunk into
# N provider calls and merges them into ONE callback, so the adapter's
# single-path metadata ends up describing the last leaf while the fragment covers
# the whole chunk. That was already unstageable — but it was refused as
# `provider-prompt-bytes-mismatch`, a reason meaning the retained bytes are not
# what was sent, when the truth was that the evidence was partial. The
# `truncation-hint` fix above WIDENED the path into it, by making truncation
# trigger a bisect where it previously failed the chunk outright.
#
# What is NOT armed here, stated rather than implied:
#
#   * that a bisected chunk can now stage. It cannot, and the fix does not claim
#     to make it. Per-call metadata plus a proof that the leaves' prompts cover
#     the chunk's members would be needed. The fix converts a wrong diagnosis
#     into a right one and makes `attempts` stop lying.
#   * the `cache_policy` string or the `accepted_graphify_runtime` docstring.
#     Both are values, not behaviour; the plan digest covers the first and
#     nothing can mutate the second into a failure.
#   * the graphify serialization tripwire. Killing it means mutating the pinned
#     package inside `.venv`, which no arm here will do.
# ==========================================================================

# The HIGH, reverted: stop counting the markers. A bisected chunk goes back to
# being refused for the wrong reason, after paying for every leaf.
[[arm]]
id = "multi-call-evidence-goes-unnoticed"
test = "test_a_bisected_chunk_is_refused_by_name_rather_than_as_corrupt_evidence"
file = "python/src/kb_setup/graphify_semantic_corpus_run.py"
old = "    if provider_calls > 1:"
new = "    if False:"

# The false-red twin, and the failure mode a count-based guard invites: refuse
# the ordinary single-call chunk too. This is what the test's control half is
# for, and without it the arm above could pass against a guard that refuses
# everything.
[[arm]]
id = "single-call-chunk-refused-as-multi-call"
test = "test_a_bisected_chunk_is_refused_by_name_rather_than_as_corrupt_evidence"
file = "python/src/kb_setup/graphify_semantic_corpus_run.py"
old = "    if provider_calls > 1:"
new = "    if provider_calls > 0:"

# The marker count is read BEFORE `clear_stale_evidence` wipes the directory.
# Moving it after is the natural tidy-up — one glob beside the other — and it
# silently makes the count always zero.
[[arm]]
id = "marker-count-taken-after-the-rotation"
test = "test_a_bisected_chunk_is_refused_by_name_rather_than_as_corrupt_evidence"
file = "python/src/kb_setup/graphify_semantic_corpus_run.py"
old = "    markers = (\n        len(tuple(boundary_dir.glob(\"provider-boundary-*.json\"))) if boundary_dir.is_dir() else 0\n    )\n    try:"
new = "    markers = 0\n    try:"
