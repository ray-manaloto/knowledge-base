# The tracked ticket chain for the aggregated-research build (#574), and for
# repo-internal enablers of it (e.g. #616, the review-CLI invocation wrapper).
# #616 is deliberately placed LAST (Ray, 2026-08-30): get the aggregated-research
# plugin build done first, deny-hook scope decision after.
#
# One entry per ticket, in the order they should be worked.
# The FILE is the ordering; the TRACKER (GitHub Issues) is the status.
#
# `mise run kb-next-ticket` (or, from `/clear-prep`, `uv run kb-setup next-ticket`
# directly) reads this file against the live tracker and reports the first ticket
# whose `blockers` are all CLOSED. Adding, removing or re-ordering a ticket is an
# ordinary reviewed commit — that is what makes the chain survive sessions the
# way transcripts do not. `blockers` holds ISSUE numbers; a blocker need not be an
# entry in this file (a dependency outside this chain resolves the same way). A
# ticket that is done is expected to be REMOVED from this file in the commit that
# closes it — the tool does not infer "done" from a ticket's own tracker state,
# only from its blockers'; it will, however, REFUSE to name an entry the tracker
# says is CLOSED (a STALE CHAIN report naming that one entry) rather than
# reporting it READY or BLOCKED, so a forgotten removal is caught on the next
# run instead of silently skipped past.

# HISTORICAL NOTE — this header describes an entry that NO LONGER SITS BELOW IT.
# #638 was placed first deliberately (Ray, 2026-08-30, verbatim): "update
# docs/roadmap/aggregated-research-chain.toml to point to the new github issue so
# that it is instructed to have codex lanes run after /clear-prep and /clear on
# the next session to review the session for anything missed/incorrect/vague".
#
# #638 CLOSED 2026-08-31 (session kb-20260830.005). Its §10 assignment is done:
# the codex-lane review ran (comment 5472992777) and the re-grill ran
# (comment 5478091373). It was then held open only because decisions 3 and 5 of
# `docs/artifacts/five-decisions-before-the-spec.html` were unanswered — decision 3
# has since DISSOLVED under measurement (the inherited "hk-test 40/6" was really
# 46 passed / 0 failed, so there was never a red baseline) and decision 5 was
# answered by Ray ("full" = every pin site, 35). Its two STILL-OWED bumps were
# carved out to #641 rather than closed with it. #581 is therefore now the head.
#
# PHASE V — the reusable dependency-upgrade workflow (Ray, 2026-09-09; parent #726).
# Placed at the HEAD deliberately: Ray, verbatim, "add this as pwf task plan items
# with linked github issues to ensure all of this is the top priority and completed
# first". Until now the head (#581) had been outranked by hand fourteen rounds
# running; putting the ruled priority IN the chain is what lets `kb-next-ticket`
# agree with the handoff instead of contradicting it. Blockers encode Ray's
# ordering: recall first (V0), then the fork rebase (V1) and the research (V2) in
# parallel, build (V3) after the spec, the Claude Code docs resync (V4) after
# recall, the roster (V5) after both the build and the resync, the full run (V6)
# last. Remove each entry in the commit that closes it.
#
# PHASE F — the function-hooks enforcement programme (Ray, 2026-09-11; map #766).
# Placed at the HEAD by Ray's ruling in session kb-20260911.001, after a four-round
# /grilling settled the design and a kb-codex-astra-advisor lane planned the chain.
# Ray, verbatim: "i want to start using function hooks whenever possible as it
# provides more flexibility than conventional hooks and we can expand it
# functionality easier instead of having to make the switch going forward / so
# enforce that so the agents in both claude and codex know this is how we want to
# move forward with everything".
#
# Phase V's #728 V1 resumes after the reference guard ships (through G04).
# Plan + every measurement: docs/research/reports/2026-09-11-function-hooks-enforcement-programme.md

