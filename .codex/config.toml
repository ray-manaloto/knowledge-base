[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD = "1"
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"

# Defaults for every subagent codex spawns from `.codex/agents/*.toml`.
# An agent that declares its own model or effort still wins — the config
# reference is explicit: "An explicit spawn model takes precedence"
# (sources/codex-docs/.../config-file/config-reference/index.md:638,644).
#
# This is the NATIVE fix for the model never having been pinned. Before it,
# every codex lane inherited its model from `~/.codex/config.toml` — a file
# this repo neither owns nor watches, so the correct resolution to gpt-5.6-sol
# was an accident of one machine's user config. Project config is layer 2 and
# user config is layer 4 (config-basic/index.md:35), so this overrides it.
#
# Two lines here rather than a `model` key in all seven mirrors: the mirrors
# stay free to differ, and nothing is locked in.
[agents]
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"

# TWO SERVERS, TWO NAMES. `graphify` is the HOSTED service; `kb` is this repo's
# own graph. Ray's ruling 2026-09-03, after a capability comparison: *"the
# app.graphify.com mcp provides more features we dont yet support / so we should
# keep that / and our code for the rest"* and *"can we just name ours
# knowledge-graph or kb for short"*.
#
# 🔴 THE NAMES ARE NOT COSMETIC — SHARING ONE BREAKS CODEX OUTRIGHT. This block
# briefly defined `mcp_servers.graphify` as a stdio command while
# `~/.codex/config.toml` defined the same key as a URL. codex merged them and
# refused to start at all: `Error: failed to load bootstrap configuration /
# Caused by: url is not supported for stdio / in mcp_servers.graphify`. Not a
# soft ambiguity about which server answers — a total outage of the CLI. Renaming
# this entry to `kb` fixed it; `codex mcp list` then shows both.
#
# WHAT EACH IS FOR, measured 2026-09-03 from the code we run
# (`sources/graphify/graphify/serve.py:1614-1744`), not from a docs page:
#   graphify (hosted, 23 tools as of 2026-08-17) — workspace/repository
#     discovery, seed search, file ranking, callers/callees/references, traces,
#     import-export maps, tests-for, impact_and_risk, remember/recall. Roughly
#     thirteen capabilities the local server has no answer for. Its corpus is
#     this repo's own files only.
#   kb (local, 10 tools) — the 359,146-node aggregate: every ingested source,
#     which is the whole point of this project and is reachable nowhere else. It
#     also carries `list_prs`, `get_pr_impact` and `triage_prs`, which the
#     hosted inventory did NOT list — so this is not a subset either way.
#
# Seven tool names exist on both. That is precisely why they are registered
# under distinct prefixes: `mcp__graphify__query_graph` and
# `mcp__kb__query_graph` are distinguishable, where one shared name would leave
# the model picking blind.
#
# `kb` is expected to GROW — replicating the hosted formal-verification and
# review surfaces locally is a project goal, tracked in the plan.
#
# `uv run kb-setup serve` is what `mise run kb-serve` runs (mise.toml:1061). It
# is registered DIRECTLY rather than through mise because the task depends on
# `raw = true` to connect stdio: without it mise reads the task's stdio by LINE,
# the server hits EOF on its first read and exits rc=0 with empty stderr —
# serving nothing, silently, on the path every rule points consumers at
# (2026-08-02). Invoking the underlying command removes that dependency entirely.
#
# Proven live, not assumed: `tests/test_mcp_serve.py` speaks real JSON-RPC
# against the REAL `graphify-out/graph.json` and skips loudly if that file is
# absent ("it is NOT a pass"). 14 passed 2026-09-03.
#
# No auth line on `kb`: a stdio server on this machine has nothing to
# authenticate to. `graphify` DOES need `codex mcp login graphify` — codex is the
# one client that does not sign in on first use, which graphify's own MCP page
# states outright. Ray ran it 2026-09-03 and it reported "Successfully logged
# in"; that state lives in `codex mcp list`'s Auth column, not here, so ask it
# rather than trusting this comment.
#
# ⚠️ `codex mcp add graphify --url …` writes a GLOBAL entry
# (`~/.codex/config.toml`) — its own output says "Added global MCP server". That
# is what collided with this file's entry. Nothing here may write that file
# (`do-not.md` #11); this repo owns only the `kb` half.
[mcp_servers.kb]
command = "uv"
args = ["run", "kb-setup", "serve"]

# `update_plan` became OPT-IN in codex 0.152.0 (PR #41744, "Make the update_plan
# tool opt-in", merged 2026-08-31T00:55:03Z — verified via `gh api`, before the
# rust-v0.152.0 release at 2026-09-01T01:58:32Z).
#
# Without this block the bump SILENTLY removes the planning tool from every lane
# here, and `without_update_plan_instructions()` also strips its instructions
# from the system prompt — so a lane would neither have the tool nor be told it
# once had one. Neither this file nor `~/.codex/config.toml` set it before the
# bump (control arm: the same grep matches `default_subagent_model` at line 22).
#
# This lands in the SAME change as the pin, because a version bump that quietly
# removes a capability is the shape `tool-currency-and-native-first.md` exists
# to catch.
[tools.update_plan]
enabled = true
