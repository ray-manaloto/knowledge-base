[[owned]]
glob = ".codex/agents/*.toml"
[[owned]]
glob = ".codex/config.toml"
[[owned]]
glob = ".claude/agents/kb-codex-*.md"
[[owned]]
glob = ".claude/skills/kb-review/**"
[[owned]]
glob = ".agents/skills/kb-review/**"
[[owned]]
glob = "CLAUDE.md"
[[owned]]
glob = ".claude/CLAUDE.md"
[[owned]]
glob = "mise.toml"
[[owned]]
glob = ".claude/workflows/kb-tool-review.js"
[[owned]]
glob = "python/src/kb_setup/codex_run.py"
[[owned]]
glob = "python/src/kb_setup/lane_recording.py"
[[owned]]
glob = "python/src/kb_setup/graphify_native_extract.py"

[[agent_pairs]]
glob = ".codex/agents/*.toml"

[[argv_site]]
glob = ".claude/agents/kb-codex-*.md"
flag = "--model"
value = "{by-agent-role}"

[[wrapper_logs]]
glob = ".claude/agents/kb-codex-*.md"
launch = "mise run kb-codex --"
lane_log = '"$KB_LANE/lane.log"'
lane_rc = '"$KB_LANE/lane.rc"'
rolecheck = '"$KB_LANE/lane.log.rolecheck"'
check = "mise run codex-log-check --"
note = "A non-zero `lane.log.rolecheck` is a FAIL; report the malformed role."

[[wrapper_logs]]
glob = ".codex/agents/kb-codex-*.toml"
launch = "mise run kb-codex --"
lane_log = '"$KB_LANE/lane.log"'
lane_rc = '"$KB_LANE/lane.rc"'
rolecheck = '"$KB_LANE/lane.log.rolecheck"'
check = "mise run codex-log-check --"
note = "A non-zero `lane.log.rolecheck` is a FAIL; report the malformed role."

[exempt]
globs = ["docs/**", "sources/**", "graphify-out/**", "tests/**"]

[effort_excluded]
globs = [".claude/workflows/*.js", ".claude/agents/*.md#effort"]
