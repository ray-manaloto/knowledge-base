schema_version = 1

[codex.pins.sol]
slug = "gpt-6.1-sol"
effort = "xhigh"

[codex.pins.astra]
slug = "gpt-6-astra"
effort = "xhigh"

[codex.dispatch.sdlc_team]
role = "sol"
effort = "xhigh"

[codex.dispatch.codex_lane]
role = "sol"
effort = "xhigh"

[codex.dispatch.review_lens]
role = "astra"
effort = "xhigh"

[codex.dispatch.kb_codex]
role = "sol"
effort = "xhigh"

[codex.agents]
"codex-sol-*" = { role = "sol", effort = "xhigh" }
"codex-astra-*" = { role = "astra", effort = "xhigh" }
"codex-sdlc-*" = { role = "sol", effort = "high", authored = true }
"kb-codex-advisor" = { role = "sol", effort = "xhigh", authored = true }
"kb-codex-implementer" = { role = "sol", effort = "xhigh", authored = true }
"kb-codex-astra-advisor" = { role = "astra", effort = "spawn" }
"kb-codex-astra-reviewer" = { role = "astra", effort = "xhigh", authored = true }
"premise-verifier" = { role = "sol", effort = "xhigh", authored = true }
"kb-adversarial-verifier" = { role = "sol", effort = "high", authored = true }
"kb-synthesist" = { role = "sol", effort = "high", authored = true }
"kb-tool-researcher" = { role = "sol", effort = "high", authored = true }
"kb-corpus-curator" = { role = "sol", effort = "medium", authored = true }
"kb-extraction-worker" = { role = "sol", effort = "medium", authored = true }

# Claude subagent launch behavior, independent of the Codex TOML roster above.
[codex.launch_agents]
"codex-sol-*" = "sol"
"codex-astra-*" = "astra"
"codex-sdlc-*" = "sol"
"kb-codex-advisor" = "sol"
"kb-codex-implementer" = "sol"
"kb-codex-astra-advisor" = "astra"
"kb-codex-astra-reviewer" = "astra"

[codex.config_fallback]
role = "sol"
effort = "high"

