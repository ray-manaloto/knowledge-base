# Tool-currency config — what `kb-setup currency` checks in THIS repo.
#
# One `[tool.<name>]` table per tracked tool. graphify is the pilot; mise, hk,
# uv, ruff and ty adopt the same shape with no engine change, which is the whole
# reason this is config and not code.
#
# Each repo carries its own config and runs independently (decided 2026-07-23).
# There is deliberately NO cross-repo assertion here: this repo must never learn
# anything about a consumer, which is the same rule that had
# `sources/dotfiles.manifest` reverted.

[tool.graphify]
# Graphify is an exported runtime dependency owned by pyproject.toml + uv.lock.
# mise only runs the locked uv sync provider; it does not install Graphify.
python_package = "graphifyy"
binary = "graphify"
# mise's pipx backend installs from PyPI, so PyPI — not the newest GitHub tag —
# is the installable truth. On 2026-07-23 v1.0.0 was tagged on GitHub while PyPI
# was still 0.9.25; tracking the tag would have pinned something uninstallable.
pypi = "graphifyy"
github = "Graphify-Labs/graphify"
extras = ["all"]
# Packages the `all` extra must ACTUALLY deliver — comparing two config files
# cannot tell you the install is intact. Deliberately NOT the full extra set:
# graspologic/leidenalg/igraph auto-skip by PEP 508 marker on Python 3.14 (the
# accepted Louvain fallback), so demanding them would report drift that is not
# drift. Verified present on this host 2026-07-24.
extra_probes = [
  "faster_whisper",
  "tree_sitter",
  "tree_sitter_cpp",
  "tree_sitter_ocaml",
]
# The ingested corpus must describe the release we actually run.
manifest = "sources/graphify.manifest"
# The project-scoped `/graphify` skill, refreshed by `currency.apply` in the SAME
# step that moves the pin — so the skill can never describe a version we stopped
# running. It sat at 0.9.23 while the pin reached 0.9.32: eight releases of drift
# that nothing reported, because `.graphify_version` is gitignored (`.gitignore:72`)
# and therefore leaves no tracked trace.
#
# `--project` is load-bearing and is spelled out here on purpose (`do-not.md` #1):
# WITHOUT it the installer mutates `~/.claude`, appends a `# graphify` H1 to
# `~/.claude/CLAUDE.md`, and sprays version stamps into every other platform's
# user skill dir. With it, control-armed 2026-08-03, home is untouched.
skill_dir = ".claude/skills/graphify"
# `mise exec --` and NOT a bare `graphify`, which is the whole point. Measured
# 2026-08-03, minutes after this field was first written with the bare name:
# `command -v graphify` reached
# `~/.local/share/mise/installs/pipx-graphifyy/0.9.31/bin/graphify` while the pin
# was already 0.9.32, so the refresh reinstalled the OLD skill and the stamp came
# back reading 0.9.31 — a refresh that ran, reported success, and changed nothing.
# That is the same stale-install-dir-ahead-of-the-shims defect this whole currency
# engine was written for (`sync.py`'s module docstring), reached through the one
# path `graphify_env.graphify_exe` cannot cover: an argv in a config file.
skill_install = ["uv", "run", "graphify", "install", "--project"]
# The REPORTER half of `skill_dir` (#315). `currency.apply` refreshes the skill on
# the bumps it applies; nothing ever asked whether the stamp AGREED with the pin,
# so a bump applied by any other route left the skill behind in silence. Measured
# both times it happened: 0.9.23 against a 0.9.32 pin (eight releases), and 0.9.42
# against a 0.9.43 pin on 2026-08-15.
#
# This file is gitignored (`.gitignore:72`), so the drift leaves NO tracked trace
# and no reviewer reading a diff can see it. That is the argument for a check
# rather than a convention.
skill_stamp = ".claude/skills/graphify/.graphify_version"
# graphify stamps no version into its own output (`export.to_json()` writes only
# `built_at_commit`), so the build task writes this sidecar instead — otherwise
# "which version built this graph?" is unanswerable from the artifact.
artifact = "graphify-out/graph.json"
# The GENERATED outputs `kb-artifacts` derives from the graph. Ray's step 1 said
# "in sync with the graph AND generated outputs", so the stamp fingerprints
# these too (a stat, so it is cheap) and step 1 flags one that MOVED — was
# rewritten, or went missing — the same way it flags a stale graph.
# `kb-artifacts` re-stamps them.
#
# It cannot flag one that is stale precisely BECAUSE nothing regenerated it: such
# a view never moves, so `size:mtime_ns` reads OK for it forever (#182, measured —
# graphml and wiki sat ~11h behind the graph with every row green). That question
# is answered separately by `kb_setup.currency.views`, off the `views` map this
# same stamp now carries, and it reports under its own `[views]` header.
#
# Directories (wiki/) are fingerprinted HERE by their own mtime/size — cheap
# enough for a per-session hook, and it catches a regeneration that adds or
# removes a page. It does NOT catch one that rewrites the same page names in
# place: a directory's mtime only moves when an entry is added or removed
# (measured). `views` therefore uses `sync.deep_artifact_fingerprint` instead,
# which walks the tree — 35.6-63.3 ms over this wiki — and is paid only at STAMP
# time, never on the hook path.
#
# svg is DELIBERATELY absent, though the handoff suggested it. `kb-artifacts`
# skips svg above 5,000 nodes (unreadable hairball + a mathtext `$` crash), and
# this graph is ~128k nodes — so svg is never regenerated here. Declaring it
# would make step 1 report a permanent "missing/stale svg" for an output the
# build correctly never produces: the exact absence-of-evidence false-drift this
# engine exists to avoid. Re-add it only for a repo whose graph stays under the
# limit. (Control-armed 2026-07-24: graph.json is 128,205 nodes.)
artifacts = [
  "graphify-out/GRAPH_REPORT.md",
  "graphify-out/graph.graphml",
  "graphify-out/wiki",
]
# The committed INPUTS `kb_setup.graph.build()` actually reads — the two globs
# and no more. Digested (sha256) into the same stamp, so step 1 can answer the
# question nothing could answer before: does the built graph still match the
# corpus it was built from? Editing a manifest or landing an extraction chunk
# previously left a graph describing an older corpus with every check green.
#
# sha256 here while `artifacts` above stays `size:mtime_ns`, and the asymmetry is
# measured, not stylistic: the inputs are 2.4 MB against the outputs' 341 MB
# (142x), and a stat CANNOT discriminate on the input side — `git checkout --`,
# a branch round-trip touching `sources/`, and a stash+pop each move it on
# byte-identical files, firing on every row of that class
# (docs/research/reports/2026-07-31-size-mtime-false-drift.md). sha256 is clean
# on all three, still fires on a real edit, and costs 1.8 ms over 43 files.
# `git hash-object` was checked as the tool built-in and is ~480x slower here
# (subprocess start-up dominates a 2.4 MB hash) — recorded so nobody re-runs it.
#
# The CLONES under `sources/<name>/` are deliberately absent: they are gitignored
# and re-fetched from the manifest's pinned SHA, so the manifest IS their
# identity. Fingerprinting them would report drift every time a clone was
# refreshed at the same pin.
inputs = ["sources/*.manifest", "sources/extractions/*.json"]
stamp = "graphify-out/.currency-stamp.json"
# graphify is host-only here. On a Linux CI runner these checks must report
# NOT-APPLICABLE rather than fail: "cannot check here" and "checked and wrong"
# are different answers.
os = ["macos"]

# ---- Every OTHER place in this repo that names the same revision -------------
#
# The manifest check asks "does the corpus describe the code we run". These ask
# the question one layer in: **does the repo agree with itself about which
# revision that is.** Different questions, and on 2026-08-15 the first was green
# while the second was two releases wrong — pyproject, the manifest, the clone
# and `graphify_semantic_corpus` all read v0.9.43 while `graphify_baseline` and
# the committed disposition catalog still read v0.9.42. `kb-currency-check`
# reported NO graphify manifest drift, entirely correctly, because manifest ==
# pin. The split was simply outside everything that looked. That is issue #225's
# class, and this table is the fix for the class rather than for the instance.
#
# A pattern that matches NOTHING is DRIFT, never a pass — a renamed anchor turns
# a declared check into a silent no-op, which is the shape this engine refuses.

# ── FORKED 2026-08-24 (Ray) ────────────────────────────────────────────────
# graphify is the ONE tool this repo installs from our own fork. It is a
# deliberately uncomfortable state and this block exists so it stays legible
# rather than becoming the way things are.
#
# WHY: graphify 0.9.48 has no codex backend, and neither does upstream `v8`
# (byte-identical to the v0.9.48 tag — control-armed, `compare/v0.9.47...v8`
# reports ahead_by 14, so the endpoint discriminates). PR #2981 adds `openai-cli`,
# a sibling of `claude-cli` that shells to the locally authenticated `codex` CLI.
# It is OPEN, CI-green, applies cleanly to our pin, and has no maintainer review.
# Ray's ruling was to take the WHOLE branch rather than cherry-pick, so the fork
# carries four unrelated features too: a per-repo extract lock,
# `--fallback-backend`, `watch --semantic`, and a batched neo4j/falkordb push.
#
# THE TRAP THIS BLOCK EXISTS FOR: the fork reports the SAME package name and the
# SAME version string as the release it sits on — `graphifyy`, `0.9.48`. Nothing
# about the version distinguishes a forked install from an upstream one, so every
# check that reasons from the version number was blind to the fork and two of them
# reported confident, permanent FALSE drift the moment the pin moved.
#
# WHAT DID NOT CHANGE: the upstream version check. Ray chose fork-aware state AND
# rebase-on-each-release, so a new upstream release is still a finding — it is the
# REBASE TRIGGER. Upstream ships roughly daily (15 releases in 15 days, measured
# 2026-08-24), so expect this row to move often and treat it as work, not noise.
#
# HOW TO REBASE: rebase `kb-pin/openai-cli-backend` in the fork onto the new
# upstream tag, push, then move THREE things in one commit — `base_ref` and
# `base_commit` below, `commit` in `sources/graphify.manifest`, and the `@<sha>`
# in `pyproject.toml`.
#
# THE SPLIT WAS 4/4 while the semantic-corpus layer existed: `graphify_baseline.py`
# and `sources/graphify.dispositions.json` describe WHAT RUNS — the live AST
# baseline for the installed graphify — so they track the manifest onto the fork.
# The other four bindings, on `graphify_semantic_{corpus,slice}.py`, were
# `tracks = "frozen"` — SNAPSHOT IDENTITIES of completed runs, pinned to an exact
# commit rather than following the moving manifest. That layer was removed
# 2026-08-24 (see `docs/archive/README.md`), and its four `ref_binding` rows left
# with it — the four below, all `tracks = "manifest"`, are what remains.
#
# Read `frozen` above literally: the comment that stood here until 2026-08-24
# called those four `tracks = "fork_base"`, and the rows themselves said
# `frozen` the whole time. The prose was wrong, not the config, and the first
# rewrite of it inherited the error before a cold review caught it against the
# deleted rows. `base_ref`/`base_commit` at the bottom of this block belong to
# the FORK SPEC and are unrelated to any binding's `tracks` mode — the rebase
# instructions above stay correct however many bindings remain.
[tool.graphify.fork]
upstream = "Graphify-Labs/graphify"
base_ref = "v0.9.49"
base_commit = "282976b2f4066b55cf2fa346c3d5568f7ac044e2"
pr = "#2981"
reason = "graphify 0.9.48 and upstream v8 have no codex backend; PR #2981 adds openai-cli, which shells to the locally authenticated codex CLI"
clears_when = "#2981 merges and ships to PyPI — then revert pyproject.toml to an == pin, point sources/graphify.manifest back at Graphify-Labs, and delete this block"

[[tool.graphify.ref_binding]]
path = "python/src/kb_setup/graphify_baseline.py"
pattern = '_ACCEPTED_GRAPHIFY_REF = "([^"]+)"'
field = "ref"
tracks = "manifest"
note = "the deterministic AST baseline's accepted source tag"

[[tool.graphify.ref_binding]]
path = "python/src/kb_setup/graphify_baseline.py"
pattern = '\n    source_commit="([0-9a-f]{40})",'
field = "commit"
tracks = "manifest"
note = """`_ACCEPTED_AUTHORITY.source_commit`. Bound SEPARATELY from the ref
because the two are independent: `_check_manifest_commit` exists precisely
because a manifest can pin a correct tag beside the previous release's commit,
and the same split is available to a code constant. Anchored on the leading
newline + indent so it matches the authority literal rather than the identically
named struct FIELD in the `BaselineAuthority` definition above it."""

[[tool.graphify.ref_binding]]
path = "sources/graphify.dispositions.json"
pattern = '"source_ref": "([^"]+)"'
field = "ref"
tracks = "manifest"
note = "the committed disposition catalog — an ARTIFACT, not code, and it drifted too"

[[tool.graphify.ref_binding]]
path = "sources/graphify.dispositions.json"
pattern = '"source_commit": "([0-9a-f]{40})"'
field = "commit"
tracks = "manifest"

# ---- Step 4: what we are tracking upstream, and what we owe ourselves --------

[[tool.graphify.watch]]
kind = "local"
ref = "label-communities-schema-gap"
note = """`label_communities` (llm.py) has no JSON-schema constant, unlike
`_EXTRACTION_JSON_SCHEMA`. Extraction is fixed; LABELLING is still broken —
probed on 0.9.25, 42/42 batches failed. Community names come from the free
deterministic `label_communities_by_hub` instead. Re-probe on each bump.

STILL PRESENT on 0.9.30 (re-probed 2026-07-29). Counts unchanged —
`_EXTRACTION_JSON_SCHEMA` x2, label-side schema constant x0,
`def label_communities` x1 — with a bogus symbol at 0 in the same file, so the
zero is an absence rather than a broken probe.

The cheap byte-identical arm did NOT settle it this time: `llm.py` grew
3070 -> 3115 lines between 0.9.26 and 0.9.30. Reading the diff did: every
changed line is on the BEDROCK path (`_bedrock_response_text` for #2287, and
the botocore timeout/retry config for #2284). **Zero** label-touching diff
lines, so the gap provably cannot have moved — and Bedrock is a backend this
repo forbids anyway (`AWS_REGION` is stripped by `graphify_env.clean_env()`).

Method for the next bump, in order: diff `llm.py`; if it changed, grep the diff
for `label` before assuming anything; only run the 42-batch probe if a
label-touching line actually moved.

RE-PROBED 2026-08-03 for 0.9.32, by exactly that method, from the pinned clone:
`git diff v0.9.31..v0.9.32 -- graphify/llm.py` reports **0 changed lines** and 0
label-touching lines. Control arm on the SAME diff — `graphify/build.py` +168/-27
and `extractors/engine.py` +168/-10 — so the command discriminates rather than
returning empty for every input. The 42-batch probe was therefore NOT run: with
zero changed lines the gap cannot have moved. STILL PRESENT on 0.9.32.

RE-PROBED 2026-08-05 for 0.9.34, same method, via the GitHub compare API
(`gh api .../compare/v0.9.33...v0.9.34`) because the local clone was absent at
probe time. `graphify/llm.py` +12/-0 — the first llm.py movement since 0.9.30,
so the cheap zero-diff arm did NOT settle it this time. Reading the patch did:
all 12 added lines are the #2486 hyperedge member-ref coercion in
`_sanitize_fragment`, zero label-touching lines. Control arm on the SAME
compare — `graphify/build.py` +117/-21 and `cli.py` +78/-11 — so the probe
discriminates. The 42-batch probe was therefore NOT run. STILL PRESENT on
0.9.34.

RE-PROBED 2026-08-07 for 0.9.35, from `graphify/llm.py` at tag v0.9.35
(raw.githubusercontent; the clone was absent at probe time). Counts unchanged:
`_EXTRACTION_JSON_SCHEMA` x2, `def label_communities` x1, label-side schema
constant x0 — with a bogus symbol at x0 in the same file, so the zero is an
absence rather than a broken probe. `llm.py` grew 3115 -> 3127 lines. The
42-batch probe was NOT run, per this item's own recorded method. STILL PRESENT
on 0.9.35.

RE-PROBED 2026-08-08 for 0.9.36. The cheap zero-diff arm did NOT settle it:
`gh api .../compare/v0.9.35...v0.9.36` reports `graphify/llm.py` +6/-1 AND
`tests/test_labeling.py` +70/-6, so a label-touching line moved for the first
time since 0.9.30. Control arm on the SAME compare — `dedup.py` +87/-7,
`cli.py` +66/-16 — so the command discriminates.

Reading the patch settled it, and it is a DIFFERENT label defect: #2534, the
community-label prompt colliding with the discard sentinel. `_community_label_lines`
changed `f"Community {cid}: ..."` to a bare `f"{cid}: ..."` because the old
string doubled as `_placeholder_community_labels`' sentinel, so a model echoing
the key back produced a name the caller's filter dropped. The prompt gained one
line explaining the new input format. Neither touches the schema.

STILL PRESENT on 0.9.36, structurally, against the INSTALLED
`0.9.36/.../graphify/llm.py`: `_EXTRACTION_JSON_SCHEMA` x2, label-side schema
constant x0, `def label_communities` x1, and zero schema/response_format on the
label path. Control: a bogus symbol x0 in the same file, and the x2 above is
what proves the command finds things. The 42-batch probe was NOT run — it needs
an LLM backend, and graphify's is Claude-only-and-broken here (#2076).

RE-PROBED 2026-08-13 for 0.9.42 using the pinned source diff. `llm.py` changed
only for POSIX `source_file` normalization. Counts remain
`_EXTRACTION_JSON_SCHEMA` x2, `def label_communities` x1, label-side schema x0.
No label-touching line moved, so the backend-dependent 42-batch probe remains
unwarranted. The gap is STILL PRESENT.

RE-PROBED 2026-08-14 for 0.9.43 from the exact tag. `graphify/llm.py` is
byte-identical to 0.9.42 (Git blob `46a4785d32b2a9236346d7f95ded1c92e18545a7`).
Counts remain `_EXTRACTION_JSON_SCHEMA` x2, `def label_communities` x1, and
label-side schema x0. Control arm on the same release diff: four changed paths
under `graphify/build.py` or `graphify/extractors/`. No label code moved, so the
backend-dependent 42-batch probe remains unwarranted. The gap is STILL PRESENT.

RE-PROBED 2026-08-16 for 0.9.45, and deliberately spanning **0.9.43...0.9.45**
rather than only the newest bump: the last recorded probe here was 0.9.43 while
the repo was already pinned at 0.9.44, so probing one release would have left
that gap unexamined while looking complete. `gh api .../compare/v0.9.43...v0.9.45`
lists 30 changed paths and `graphify/llm.py` is **not among them** — 0 matches
against a 30-file control, so the zero is an absence and not a broken filter.
No label-touching line moved across either release, so the gap provably cannot
have moved and the backend-dependent 42-batch probe stays unwarranted. STILL
PRESENT on 0.9.45.

METHOD NOTE, recorded because it produced a false negative first: this item's
recorded method says to diff from the pinned clone, and the first attempt ran
`git -C sources/graphify diff` from a shell whose cwd was ALREADY inside
`sources/graphify`. That path does not exist from there, so git printed
`fatal: cannot change to ...` and the label grep returned **0** — a broken probe
wearing the exact shape of a clean answer. It was caught only because the
control arm errored identically. Prefer the compare API, or assert the cwd."""

[[tool.graphify.watch]]
kind = "local"
ref = "mcp-major-pin-is-what-makes-kb-serve-installable"
note = """0.9.30 (#2277/#2279/#2291) pins `mcp>=1,<2` in the `mcp` and `all`
extras. That pin is load-bearing for THIS repo, because `mise run kb-serve` is
the MCP server and we install `extras = ["all"]`.

MEASURED 2026-07-29, both arms, in a throwaway venv:
  fresh resolve of `graphifyy[all]==0.9.26`  -> mcp 2.0.0  -> server rc=1
  fresh resolve of `graphifyy[all]==0.9.30`  -> mcp 1.29.0 -> server rc=0
This host's pre-existing 0.9.26 env holds mcp 1.28.1 and works, so the defect
was never a live outage here — it was an INVARIANT-3 (reproducibility) failure:
a fresh clone could not stand up the server the old pin claimed to provide.

TWO PROBES THAT LOOK CONCLUSIVE AND ARE NOT: under the broken combination,
`import graphify.serve` exits 0 and `--help` exits 0, because the mcp imports
are lazy (inside `_build_server`). Only actually STARTING the server fails. And
the failure is misreported: graphify swallows the real
`cannot import name 'AnyUrl' from 'mcp.types'` and re-raises
`ImportError: mcp not installed. Run: pip install "graphifyy[mcp]"` — so the
message says NOT INSTALLED while mcp is installed at the wrong major.

Upstream tracks the port to the mcp 2.x API in #2308 (below). When that lands
the `<2` ceiling lifts; until then, do not "helpfully" relax it.

**RESOLVED in 0.9.31 — #2308 landed, and this repo bumped to it.** The cap is
now `mcp>=1,<3`: `_build_server` binds the same handlers through either the 1.x
decorator API or the 2.x `on_*` constructor callbacks at runtime, and adapts
`Tool.inputSchema`, `Resource.uri` and the dropped `AnyUrl` re-export. Upstream
reports full stdio handshakes verified under both mcp 1.29 and 2.0.

The item is KEPT rather than deleted because its warning has outlived its
version condition and inverted: the ceiling was load-bearing on 0.9.30 and is
not on 0.9.31, so a reader who finds `mcp<2` reasoning in an older branch or a
consumer repo needs to know which side of 0.9.31 it belongs to. The two probes
that look conclusive and are not — `import graphify.serve` and `--help` both
exiting 0 while the server is broken, because the mcp imports are lazy inside
`_build_server` — still hold on ANY version, and are the reason `mise run
kb-serve` is the only probe that answers this question.

RE-PROBED 2026-08-03 for 0.9.32: `v0.9.32:pyproject.toml` carries `mcp>=1,<3` in
BOTH the `mcp` and `all` extras — unchanged from 0.9.31. The ceiling stays
lifted, so this remains RESOLVED. Read from the pinned clone's tag rather than
from an installed tree, which is what makes it a claim about 0.9.32 and not about
whatever happens to be on this host.

RE-PROBED 2026-08-05 for 0.9.34: `pyproject.toml` at tag v0.9.34 carries
`mcp>=1,<3` in BOTH the `mcp` and `all` extras — unchanged. Read via the GitHub
contents API at the tag (the local clone was absent at probe time), which keeps
it a claim about v0.9.34 rather than about whatever this host has installed.
Remains RESOLVED.

SERVER PROBE RUN 2026-08-06 (#194) — the one this note says is the only
conclusive one, and it had never been run against 0.9.34 even though
`graphify/serve.py` moved +114/-69 in the bump. `mise run kb-serve` against the
installed 0.9.34 (mise shim, no stale install dir shadowing it) completed a real
JSON-RPC handshake in 15.0s: **10 tools** (`query_graph`, `get_node`,
`get_neighbors`, `get_community`, `god_nodes`, `graph_stats`, `shortest_path`,
`list_prs`, `get_pr_impact`, `triage_prs`), **6 resources**, 6,012 bytes of tool
schema, negotiated protocol version matching (empty detail). Same 10/6 surface
0.9.31 and 0.9.32 advertised — the serve rewrite changed no advertised surface.
Control-armed by the same run: `tests/test_mcp_serve.py` is 11 tests, 0 skipped,
and its negative arms (rc=0-with-no-reply, refused initialize, errored
`tools/list`, dropped `resources/list`) all still report failure, so the probe
can produce the other answer. No `graphify-mcp` process survived shutdown.

RE-PROBED 2026-08-07 for 0.9.35: `pyproject.toml` at v0.9.35 carries
`mcp>=1,<3` in BOTH extras — UNCHANGED since 0.9.31, so RESOLVED still stands.
**Read this item's OPENING sentence with its version condition attached.** It
states the 0.9.30 situation (`mcp<2`, load-bearing), and the 2026-08-07 run read
it as the CURRENT disposition and reported the ceiling as newly widened by
0.9.35. It was widened in 0.9.31. This item is kept precisely because its
warning outlived its version condition — and that is the trap it then sprang on
its next reader. SERVER PROBE RUN, because `graphify/serve.py` moved +38/-2 in
this bump and this note says starting the server is the only conclusive probe:
`kb_setup.mcp_probe.probe(["mise", "run", "kb-serve"])` completed a real
JSON-RPC handshake against the installed 0.9.35 — **10 tools** (`query_graph`,
`get_node`, `get_neighbors`, `get_community`, `god_nodes`, `graph_stats`,
`shortest_path`, `list_prs`, `get_pr_impact`, `triage_prs`) and **6 resources**,
the same surface 0.9.31/0.9.32/0.9.34 advertised. No `graphify-mcp` process
survived shutdown.

RE-PROBED 2026-08-08 for 0.9.36: `pyproject.toml` at tag v0.9.36 carries
`mcp>=1,<3` in BOTH the `mcp` extra (:59) and `all` (:88) — unchanged since
0.9.31, so RESOLVED still stands. Control on the same file: a bogus `mcp>=9`
-> 0 hits, so the grep discriminates. Read at the TAG via the contents API,
which keeps it a claim about v0.9.36 rather than about this host.

NO SERVER PROBE RUN, and this is the recorded method rather than a shortcut:
the note says starting the server is the only conclusive probe, AND that it is
owed when `graphify/serve.py` moves. It did not — `gh api compare
v0.9.35...v0.9.36` lists **0** files matching `serve`, against a control of 4
matching `dedup|cli` on the same compare, so the filter discriminates and the
zero is an absence. (Read this item's OPENING sentence with its version
condition attached; it describes 0.9.30, not today.)

