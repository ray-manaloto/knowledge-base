1. The 200-subagent-per-session spawn cap is REMOVED. Directly relevant: a long
   session previously refused new agents, which bites `kb-extract` fan-outs and
   multi-round `kb-review`.
2. Plugin install records were silently corrupted when one plugin is installed in
   multiple projects — FIXED. This repo enables 10 project-scope plugins and the
   sibling dotfiles repo has its own, so we were in scope for it.
3. New `archive` plugin source (zip over HTTPS, optional SHA-256 pinning). A
   candidate fix for the standing complaint that `skillopt`'s pin `main` cannot be
   compared with upstream `v0.2.0`, so its drift reports UNKNOWN every session.
   Evaluating it is a separate piece of work, not this bump.

NOT applicable, armed rather than assumed: the >200-char project-path session-dir
collision — this project's path is 56 characters.

SUPERSEDED 2026-08-08 by the 2.1.226 review. Its one follow-up IS now done:
this entry recorded that the mirror's pin predated 2.1.224 and that advancing
`agent-harness-docs` was "the follow-up, NOT done here" — it advanced to
33aef930 in this change, alongside `sources/claude-code.manifest` reaching
v2.1.226. The `ANTHROPIC_BEDROCK_REGION_PREFIX` finding is unchanged and still
deliberately NOT added to `_STRIP_BACKEND_ENV`."""


# ---------------------------------------------------------------------------
# hk — the git-hook gate this repo's `mise run lint` IS (#87)
# ---------------------------------------------------------------------------
# The ordinary PINNED-tool shape, not `[tool.mise]`'s self-managed one: hk is in
# this repo's `[tools]`, so `mise_key` resolves and `expected` is deliberately
# ABSENT — the engine reads `expected` as "self-managed", which hk is not.
#
# No `version_pattern`: `hk --version` prints exactly `hk 1.52.0`, so the
# engine's default `text.split()[-1].lstrip("v")` returns `1.52.0` already.
# mise and claude-code need patterns because their output carries a platform and
# a build date after the version; adding one here would only create a way for
# the match to stop working.
#
# On `kind = "issue"` for hk — read this before adding one. `jdx/hk` has
# `has_issues: false`; its tracker is DISCUSSIONS (probed 2026-07-31; control
# arm: this repo returns `has_issues: true`, so the probe discriminates).
#
# That does NOT make `kind = "issue"` universally impossible here, and an earlier
# version of this comment wrongly said it did. Measured, three arms:
#
#   repos/jdx/hk/issues/1099   -> 200  (a PR — the issues endpoint serves PRs)
#   repos/jdx/hk/issues/1098   -> 404  (a DISCUSSION — not on that endpoint)
#   repos/jdx/hk/issues/999999 -> 404  (control)
#
# So a watch pointing at a hk PR NUMBER would resolve, and `issues.py` never
# checks `has_issues` before fetching, so nothing pre-empts it either way. What
# cannot be watched is hk's actual tracker: a discussion 404s permanently, and a
# watch whose lookup always fails blocks the unambiguous-bump gate forever rather
# than failing loudly.
#
# The two items below are `local` for a different and simpler reason: neither is
# an upstream item whose state we are waiting on. One records a DECISION (the
# depends ban stays) and one a fact about this repo's SHAPE (the version is
# written in three places). Nothing upstream will ever close them.
[tool.hk]
mise_key = "hk"
binary = "hk"
github = "jdx/hk"
# The ingested corpus must describe the release we actually run — the same
# invariant `[tool.graphify]` states above, and it is NOT optional here just
# because these manifests are newer.
#
# ⚠️ ADDED 2026-08-03 AFTER A COLD REVIEW CAUGHT ITS ABSENCE. `sources/hk.manifest`
# landed 2026-08-02, but this table was never told about it — and
# `sync.py`'s manifest check turns an absent `ToolSpec.manifest` into **SKIP with
# the reason "this repo pins no source manifest for the tool"**. That reason was
# true when written and became false the day the manifest landed, so the checker
# reported a clean SKIP over a real drift: this repo bumped hk in `mise.toml`
# while the manifest still pinned the previous release, and `kb-build` went on
# extracting the OLD source into the corpus.
#
# That is precisely the DRIFT/SKIP/OK collapse this engine refuses everywhere
# else, arriving through the one door nothing was watching: a SKIP whose stated
# reason is a fact about the repo that can silently stop being true.
manifest = "sources/hk.manifest"

# ⚠️ ADDED 2026-08-19 AFTER THIS EXACT DRIFT WENT LIVE AND UNNOTICED. `hk.pkl`'s
# two package URIs are a THIRD copy of the hk version, and until now this table
# declared no bindings — so `sync.py` reported `ref-binding | skip | this tool
# declares no revision bindings`, a SKIP whose stated reason was a true fact
# about the repo, which is the same hole the `manifest` key above records twice.
#
# What it cost: the 1.55.0 bump moved `mise.toml` and `sources/hk.manifest` and
# left `hk.pkl` on **v1.54.1**. Every other check was correctly green — pin vs
# upstream agreed, manifest vs pin agreed — because none of them can see a URI.
# `hk validate` could not catch it either: 1.54.1 schemas evaluate fine under a
# 1.55.0 binary, so the mismatch is silent until a schema field actually moves.
# That is precisely the "new BINARY against the old SCHEMAS" failure the
# `hk-version-is-written-three-times` watch item below exists to warn about — and
# a watch item is prose, so it warned nobody. This is the machine-enforced half.
#
# Anchored on the URI prefix and capturing the leading `v` so the value compares
# directly against the manifest's `ref = v1.56.0`.
#
# The `hk@1.56.0` fragment later in the same URI is NOT bound separately, and the
# reason stated here until 2026-08-20 was FALSE: it said the two are "the same
# literal in the same string", which they are not — one carries the `v` prefix
# and one does not, so a partial hand-edit genuinely can desync them and this
# binding would not see it. (Cold lane, batch 2.)
#
# It stays unbound for a different and weaker reason, recorded honestly rather
# than dressed up: a desync here is not silent. Pkl resolves the package by the
# whole URI, so `download/v1.57.0/hk@1.56.0` fails to load the config outright
# and `mise run lint` exits non-zero on the next run. The failure mode this
# mechanism exists to catch is the QUIET one — a version that drifts while
# everything still works — and that is not this. Binding it would also need a
# `field` holding the bare version, which `currency.toml` does not carry.
[[tool.hk.ref_binding]]
path = "hk.pkl"
pattern = 'amends "package://github\.com/jdx/hk/releases/download/(v[0-9]+\.[0-9]+\.[0-9]+)/'
field = "ref"
note = "hk.pkl's `amends` — the Config.pkl schema the config is written against"

[[tool.hk.ref_binding]]
path = "hk.pkl"
pattern = 'import "package://github\.com/jdx/hk/releases/download/(v[0-9]+\.[0-9]+\.[0-9]+)/'
field = "ref"
note = """hk.pkl's `import` — the Builtins.pkl schema. Bound SEPARATELY from the
`amends` above rather than with one pattern matching both, because they are two
independent edits: a bump that updates one and misses the other is exactly the
mistake a human makes here, and a single binding that matched either would pass
on the half-done edit."""

[[tool.hk.watch]]
kind = "local"
ref = "depends-ban-is-now-a-choice-not-a-workaround"
note = """`hk.pkl` bans `depends` in favour of `exclusive = true` because a failed
dependency used to deadlock every dependent (`hk.pkl:152`, and the same doctrine
in `long-running-command-hangs.md` rule 5 + dotfiles' `no_hk_depends` step). The
trigger condition is `fail_fast = false` AND a step carrying `depends`. This
repo sets the first at `hk.pkl:12` and, because of this very ban, has ZERO of the
second — the only occurrence of `depends` in `hk.pkl` is the comment forbidding
it. So the deadlock could never have fired here; the ban is what made it
unreachable, which is the point rather than a caveat to it.

**Upstream FIXED it in v1.53.0 (#1099): dependents no longer hang after a failed
dependency.** So the ban is no longer a workaround for a live defect — it is a
choice, and `tool-currency-and-native-first.md` says custom avoidance kept alive
by a fixed defect is exactly what to re-examine.

Deliberately NOT retired (Ray, 2026-07-31): `exclusive` works, the doctrine spans
both repos, and dotfiles machine-enforces it — retiring it here alone would split
the two repos' rules. Recorded WITH its version condition so a future reader knows
which of the two it is, and so any revival is a decision rather than a rediscovery.

RE-PROBED 2026-08-03 for v1.54.0: unchanged in substance. 1.53.0 carried the
#1099 fix already recorded; 1.54.0 adds `check_failed_files`, command-effect
declarations and perf (17% smaller binary, 31% faster startup) with no
dependency-graph change. The ban stays a CHOICE, still deliberately not retired.

RE-PROBED 2026-08-08 for v1.54.1: unchanged in substance, and the release is
adjacent to this item without moving it. 1.54.1 is four bug fixes; the relevant
one (#1140) makes hk print an end-of-run hint on a git `index.lock` conflict
"pointing to `exclusive = true`, `depends`, or separate groups", and the docs
now steer authors toward `stage` for hk-owned staging and `exclusive` for
legacy commands that write the index directly. That is GUIDANCE, not a
dependency-graph change — upstream's own advice now names `exclusive` first,
which is what this repo already does. The ban stays a CHOICE, still
deliberately not retired.

RE-PROBED 2026-08-19 for v1.55.0 -> v1.56.0: unchanged in substance, and this
release does not touch the dependency graph at all. 1.56.0 is a Pkl package
cache + offline mode (`HK_PKL_CACHE_DIR`, `HK_PKL_OFFLINE`), pinact v3/v4
builtins, `HK_OUTPUT_FILE`, the `allow_binary` step option, and five fixes
(argv boundaries, linked worktrees, annotated tags, expr v2 conditions). Nothing
in it mentions `depends`, dependents, or deadlock. The ban stays a CHOICE, still
deliberately not retired.

Its ONE breaking change is also inert here, and worth recording because it is
the kind that looks alarming: builtins migrated to structured argv (#1194) now
require LIST-form prefixes (`prefix = List("mise", "x", "--")`) instead of
shell-string ones. `hk.pkl` sets ZERO builtin prefixes — `prefix` occurs 5 times
and every one is prose in a comment, two of them (`hk.pkl:243-244`) already
documenting this very migration and why a `(Builtins.ruff){prefix=…}` panics
here. So this repo had already adapted to the change before it shipped."""

[[tool.hk.watch]]
kind = "local"
ref = "hk-version-is-written-three-times"
note = """dotfiles' `hk_version_parity` step does not port — it exists because
that repo carries THREE pkl files whose hk pins can drift apart, and this repo has
exactly ONE (`hk.pkl`, verified 2026-07-31).

But a drift surface remains on a DIFFERENT axis: the version appears three times
across two files — `mise.toml`'s `hk` pin, and `hk.pkl`'s `amends` and `import`
URLs. A `mise.toml`-only bump runs a new BINARY against the old SCHEMAS. Bump all
three together, or the mismatch shows up as a pkl error with nothing pointing at
the pin.

RE-PROBED 2026-08-03 at the 1.52.0 -> 1.54.0 bump, and the method held: the
version occurred exactly TWICE in `hk.pkl` (`amends` + `import`) and once in
`mise.toml`. All three moved in one edit, asserted on the count rather than
replaced blindly, then `hk validate` (rc=0) and `mise run lint` (rc=0) confirmed
the new binary agrees with the new schemas — which is this item's whole point.

RE-PROBED 2026-08-08 at the 1.54.0 -> 1.54.1 bump, and the method held again:
the version occurred exactly TWICE in `hk.pkl` (`amends` + `import`) and once in
`mise.toml`. Asserted on the count before editing (2, with a control of 0 for a
version not present), moved all three in one change, then `hk validate` rc=0 and
`mise run lint` rc=0 confirmed the new binary agrees with the new schemas.

NEW this round, and it is the failure this item exists to prevent wearing a
different hat: after `mise install`, a bare `hk` still ran **1.54.0** while
`mise which hk` reported 1.54.1. `MISE_ENV_CACHE=1` and the stale install dirs
sit at PATH positions 4/5/8, ahead of the shims. So "did the bump take?" cannot
be answered with `hk version`; use `mise exec -- hk version` or the absolute
path. The engine's own `resolution` check reports this independently.

⚠️ RE-PROBED 2026-08-19 at the 1.55.0 -> 1.56.0 bump, and THIS TIME THE ITEM
FIRED — it was live, not hypothetical. `hk.pkl`'s two URLs read **v1.54.1**
while `mise.toml` pinned **1.55.0**: the 1.55.0 bump moved the pin alone, which
is exactly the "new BINARY against the old SCHEMAS" failure this item exists to
prevent, and it had been sitting in the tree unnoticed since.

Nothing caught it, and the reason is structural rather than an oversight: the
engine's own checks compare the `mise.toml` pin against upstream and against
`sources/hk.manifest`, and BOTH agreed — the manifest tracked 1.55.0 correctly.
The pkl URLs are a third copy no check reads. `hk validate` did not catch it
either; the 1.54.1 schemas evaluate fine under a 1.55.0 binary, so the drift is
silent right up until a schema field moves. This is the count-based method's
blind spot in its own item: asserting "2 occurrences moved" verifies the EDIT,
never that the value matches the pin.

Method held once it was found, same as the previous three rounds: counted first
(2 occurrences of `1.54.1`, control 0 for `1.56.0`), replaced, re-counted (0 and
2), then `mise exec -- hk validate` rc=0 with the new binary against the new
schemas. The stale-PATH skew above ALSO reproduced verbatim this round — bare
`hk version` printed 1.55.0 while `mise exec -- hk version` printed 1.56.0 —
which is why the validate was run through `mise exec`."""

# ---------------------------------------------------------------------------
# fnox — the credential tool the shell's secrets come from (#86)
# ---------------------------------------------------------------------------
# Ray's call, 2026-07-31: track it "like hk" — an ordinary pinned tool. So fnox
# is now pinned in `[tools]` too, and this block takes `mise_key`, NOT
# `[tool.mise]`'s self-managed `expected` shape.
#
# The problem it closes: fnox resolved from the user's GLOBAL mise, which
# installs it into a directory literally named `latest` and self-updates out of
# band. Installed 1.31.1 and upstream latest 1.31.1 (probed 2026-07-31, both
# arms), so there was no drift — only no way to notice any.
#
# Scope, so the `do-not.md` #11 tension is not re-derived from scratch: this
# tracks a VERSION and touches nothing under `~/.config/fnox`. fnox's real
# enforcement — the `env = "exec"` baseline and the `mde-py bootstrap_config()`
# wipe that silently drops the mode plus all four opt-ins — lives in dotfiles'
# `doctor.toml` as `fnox-baseline`, and stays there. Before this, NOTHING tracked
# fnox's version anywhere: dotfiles' `currency.toml` carries only `[tool.graphify]`
# (control arm: `mise` appears 8 times in that file, so the grep discriminates).
[tool.fnox]
mise_key = "fnox"
binary = "fnox"
github = "jdx/fnox"
# The ingested corpus must describe the release we actually run — the same
# invariant `[tool.graphify]` states above, and it is NOT optional here just
# because these manifests are newer.
#
# ⚠️ ADDED 2026-08-03 AFTER A COLD REVIEW CAUGHT ITS ABSENCE. `sources/fnox.manifest`
# landed 2026-08-02, but this table was never told about it — and
# `sync.py`'s manifest check turns an absent `ToolSpec.manifest` into **SKIP with
# the reason "this repo pins no source manifest for the tool"**. That reason was
# true when written and became false the day the manifest landed, so the checker
# reported a clean SKIP over a real drift: this repo bumped fnox in `mise.toml`
# while the manifest still pinned the previous release, and `kb-build` went on
# extracting the OLD source into the corpus.
#
# That is precisely the DRIFT/SKIP/OK collapse this engine refuses everywhere
# else, arriving through the one door nothing was watching: a SKIP whose stated
# reason is a fact about the repo that can silently stop being true.
manifest = "sources/fnox.manifest"

[[tool.fnox.watch]]
kind = "local"
ref = "pinned-here-global-stays-on-latest"
note = """Pinning fnox in this repo's `[tools]` means the shim resolves to the
pinned version INSIDE this directory while the global install stays on `latest`
— an accepted skew, chosen deliberately so this repo states the fnox it expects.
Bump the two together; a bump here alone narrows the skew rather than closing it,
and the global side is not this repo's to edit (`do-not.md` #11).

RE-PROBED 2026-08-03 at the 1.31.1 -> 1.32.0 bump: the skew is UNCHANGED and
still accepted. 1.32.0 is purely additive (credential proxy, `exec --replace`,
Azure App Configuration provider, AWS IAM role assumption) with no change to how
a pinned shim resolves. Checked and explicitly NOT true: it does not address
knowledge-base #74 (`env="exec"` silently emptying env-var credentials) —
`exec --replace` is a new process-replacement MODE, not a fix to that path, so
#74 stays open. **The global fnox bump is still owed** and is Ray's to make."""

# ---------------------------------------------------------------------------
# Doppler — runtime secret delivery for devcontainers and CI/CD
# ---------------------------------------------------------------------------
[tool.doppler]
mise_key = "doppler"
binary = "doppler"
github = "DopplerHQ/cli"
manifest = "sources/doppler.manifest"
version_pattern = '^v?(\d+\.\d+\.\d+)'
docs_watch = [
  "https://docs.doppler.com/llms.txt",
  "https://docs.doppler.com/docs/cli.md",
  "https://docs.doppler.com/docs/accessing-secrets.md",
  "https://docs.doppler.com/docs/service-tokens.md",
  "https://docs.doppler.com/docs/automatic-fallbacks.md",
  "https://docs.doppler.com/docs/installation-docker.md",
  "https://docs.doppler.com/docs/dockerfile.md",
  "https://docs.doppler.com/docs/docker-container-env-vars.md",
  "https://docs.doppler.com/docs/docker-compose.md",
  "https://docs.doppler.com/docs/docker-high-availability.md",
  "https://docs.doppler.com/docs/high-availability.md",
]

[[tool.doppler.watch]]
kind = "local"
ref = "devcontainer-secret-file-lifecycle"
note = """Doppler 3.76.0 added fallback-file caching for every mounted format.
The devcontainer design must keep fallback behavior explicit: prefer an
ephemeral `doppler run --mount` source feeding the devcontainer CLI's native
`--secrets-file` boundary, scrub `DOPPLER_TOKEN` before the container process,
and never persist a plaintext env file. This remains tracked until the broader
lifecycle-scoped secret-delivery architecture is implemented and verified."""

[tool.skillopt]
# SkillOpt (microsoft/SkillOpt) is both INGESTED and installed from the same
# immutable commit. The root pyproject owns the Python dependency; mise owns no
# duplicate tool pin. Two distinct things ship from that one repo:
#
#   * the SkillOpt python package (PyPI `skillopt`), a research framework that
#     trains a SKILL DOCUMENT against a benchmark behind a held-out validation
#     gate. This first slice installs the package only to establish its reviewed
#     public API/CLI contract; it does not run a real backend or a benchmark.
#   * SkillOpt-Sleep, the deployment-time companion. Its mutable Claude Code
#     marketplace plugin is disabled in this slice; only the installed package's
#     read-only contract and isolated mock probe are authorized.
#
# There is deliberately no `[tools]` entry: `uv` resolves the sole Python
# dependency from the exact VCS revision and records it in `uv.lock` and
# `direct_url.json`. The currency engine checks that revision, the installed
# console script, and the source manifest together.
#
# `pypi` remains absent: upstream still labels main as 0.2.0, so that version can
# never certify which of the post-release commits is installed.
python_package = "skillopt"
binary = "skillopt-sleep"
github = "microsoft/SkillOpt"
manifest = "sources/skillopt.manifest"

[[tool.skillopt.watch]]
kind = "local"
ref = "sleep-handoff-mode-needs-a-main-checkout"
note = """SkillOpt's own plugin README, re-read at commit 93bdf3d7: "PyPI 0.2.0
provides the base Sleep CLI, but handoff mode and `--preferences` require a
source checkout from `main` until the next release."

The Python dependency and source manifest now use the exact reviewed main commit,
so the needed feature set is reproducible. Re-check on the next release: once
handoff mode ships to PyPI the VCS dependency may be replaceable by a release pin.

RE-PROBED 2026-08-05 at the v0.2.0 review: upstream's latest release is STILL
v0.2.0 (no "next release" yet), and the claim is still in the pinned clone at
61735e39 (`plugins/claude-code/README.md:59`). The `main` pin therefore remains
the required shape, and the engine's "'main' -> 'v0.2.0' could not be parsed"
ambiguity is a version-string artifact, not a pending upgrade: the pinned
commit post-dates the tag. Re-probed 2026-08-13 at 93bdf3d7; the latest release
is still v0.2.0, so version metadata alone remains non-authoritative. Item stays open."""

[[tool.skillopt.watch]]
kind = "local"
ref = "sleep-writes-outside-this-project"
note = """SkillOpt-Sleep's upstream SessionEnd hook appends to
`~/.skillopt-sleep/session-end.log` (async, exit 0, no API spend, verified by
reading `hooks/on-session-end.sh` at 93bdf3d7), and the consolidation cycle
proposes edits to `CLAUDE.md` / `SKILL.md` files. The mutable marketplace plugin
is disabled locally, so neither surface is active in this provenance-only slice.

Nothing is written live until a human runs `/skillopt-sleep adopt`, and every
adopt backs up the prior file. That review is the control: `do-not.md` #11 keeps
this repo out of `~/.claude`, and an unreviewed self-edit would route around it.
Re-read the hook on every version bump — a change from marker-append to anything
that spends budget or writes a tracked file is a different bargain.

RE-PROBED 2026-08-05 at the v0.2.0 review: `plugins/claude-code/hooks/
on-session-end.sh` re-read at the pinned 93bdf3d7 — still exactly a
timestamp+PWD append to `~/.skillopt-sleep/session-end.log`, unconditional
`exit 0`, no API spend, no tracked-file write. Same bargain. Also noted from
the v0.2.0 notes: "Redact secrets before persisting cycle diagnostics" — a fix
in the right direction for the surface this item watches."""

# ─── Added 2026-08-08 (#242): the four tools with BOTH a pin and a manifest that
# this table had never heard of. Until now a currency run checked 7 tools while
# the repo pinned 11, so uv/ruff/codex/ty drifted in BOTH directions unwatched —
# the pin against upstream, and the manifest against the pin. Nothing reported a
# problem, because a tool absent from this file produces no row at all: not a
# DRIFT, not even a SKIP. That is the one failure mode this engine is otherwise
# built to refuse, arriving as silence rather than as a green tick.
#
# All four are ordinary pinned tools, so they take `mise_key` (like hk) rather
# than `expected` (like mise/claude-code, which self-update).
# ─────────────────────────────────────────────────────────────────────────────

[tool.uv]
mise_key = "uv"
binary = "uv"
github = "astral-sh/uv"
pypi = "uv"
# `uv --version` prints `uv 0.12.3 (5072309 2026-08-07 aarch64-apple-darwin)` —
# the last whitespace field is the target triple, so anchor rather than take the
# default heuristic. Same trap as mise and claude-code above.
version_pattern = '^uv (\d+\.\d+\.\d+)'
manifest = "sources/uv.manifest"

[tool.ruff]
# NOT a `[tools]` pin: ruff is a `dev` dependency in the root pyproject.toml
# (`ruff==0.16.4`), reached as `uv run ruff`. So there is no `mise_key` — the
# engine offers exactly three managers and none of them is uv, which is why this
# takes `expected` (the version we have REVIEWED) rather than pretending mise
# owns it. Bump `expected` and the pyproject pin in the same change, or this row
# asserts a review that did not happen.
expected = "0.16.4"
binary = "ruff"
github = "astral-sh/ruff"
pypi = "ruff"
version_pattern = '^ruff (\d+\.\d+\.\d+)'
manifest = "sources/ruff.manifest"

[tool.ty]
# Same shape as ruff: a `dev` dependency (`ty==0.0.69`), not a mise pin, so
# `expected` for the same reason. Pre-1.0 and moving fast, which is exactly why
# it needs a row rather than trust — a 0.0.x bump can carry a breaking change
# with no marker to trip gate 3.
expected = "0.0.73"
binary = "ty"
github = "astral-sh/ty"
pypi = "ty"
version_pattern = '^ty (\d+\.\d+\.\d+)'
manifest = "sources/ty.manifest"

[tool.codex]
mise_key = "codex"
binary = "codex"
github = "openai/codex"
# ⚠️ codex tags releases `rust-v<version>`, NOT `v<version>` — so
# `manifest.resolve_tag`'s `v<x>` / `<x>` pair resolves NEITHER, and an apply
# would abort rather than mispin. Recorded here so that abort reads as a known
# shape rather than a bug; advance `sources/codex.manifest` by hand.
#
# ⚠️ `mise ls-remote codex` is the WRONG instrument for "does this version
# exist" — the aqua registry lags GitHub by a day or more (mise.toml records the
# measurement: 0.146.1 was Latest upstream for ~4h and absent from all 277 rows).
# Verify a codex bump by attempting the install.
version_pattern = '^(?:codex-cli )?(\d+\.\d+\.\d+)'
# `manifest` is DELIBERATELY ABSENT, and this is the one row where that is the
# correct answer rather than the #242 hole this whole section closes.
#
# It was declared, run, and REFUTED by its own first output: the check compares
# the manifest ref to the installed version, and `rust-v0.147.0` != `0.147.0`,
# so it reported `the corpus describes code we do not run` for a manifest that
# is pinned exactly right. A permanent false DRIFT is worse than a SKIP — it
# trains a reader to ignore the line, which is how the real one gets missed.
# Same reasoning as `[tool.graphify]`'s absent `svg` artifact above.
#
# The fix belongs in the ENGINE (teach it a ref prefix), not in a row that lies
# in the meantime. Until then codex's manifest is advanced by hand, and this
# comment is what stops the next reader "fixing" the omission.
#
# THE SAME PREFIX ALSO DEFEATS VERSION TRACKING, and that one is KEPT. The first
# full run reported `codex 0.147.0, latest UNKNOWN` — the engine cannot read
# `rust-v0.147.0` as a version, so no upstream baseline is ever recorded.
#
# Keeping that row while deleting the manifest row is not inconsistent, and the
# difference is the whole doctrine of this engine: UNKNOWN is an HONEST answer
# ("checked, could not tell"), and the run renders it under `NOT CHECKED against
# upstream (this is not a pass)`. The manifest row produced a false DRIFT —
# an assertion that something was wrong when it was right. One is silence about
# a question; the other is a wrong answer to it. Only the second had to go.
#
# FIXED 2026-08-08, in TWO commits, and the history is kept because it is the
# lesson: this comment claimed "BOTH ARE FIXED" while only the reporting half
# was, the cold lane caught it, and the correction then had to say "PARTLY"
# for a round. `tag_prefix` reached exactly ONE call site — `sync.py`'s
# manifest-ref compare — so the check stopped lying about codex while an
# authorized auto-apply would still have aborted on `no tag found`.
#
# The acting half now lands too: `manifest.resolve_tag` takes `prefix=` and
# tries `<prefix><version>` FIRST, falling back to `v<version>` and the bare
# form so a stale prefix degrades rather than turning a hit into a miss, and
# `apply.py` passes `spec.tag_prefix`. Armed both ways against a fake remote
# holding only `rust-v0.9.26`: the bump resolves with the prefix and aborts
# without it, leaving mise.toml byte-identical.
#
# THE GENERALISABLE PART: a config key can be read by the reporting path and by
# nothing that ACTS. Wiring one call site is not wiring the feature, and the
# comment describing it is the least reliable evidence that it is done.
#
# WHAT WAS FIXED EARLIER, armed and measured:
# `_check_manifest_commit` now accepts EITHER identity of an annotated tag
# (#246), because `ls-remote` records the tag OBJECT while `git rev-list` peels
# to the commit and both name the same tree.
#
# Armed both ways on a real clone of jdx/mise at the annotated v2026.8.3: a
# correct manifest reports OK where it reported DRIFT, and a deliberately wrong
# `commit =` still reports DRIFT — the check was widened, not lost. Control:
# astral-sh/uv's `0.12.3` is a LIGHTWEIGHT tag with one SHA, so the widening
# costs no precision there.
#
# The first attempt at #246 did NOT work and the arm is why: `rev-list` peels
# for both `<ref>` and `<ref>^{}`, so it compared peeled against peeled and
# still reported drift. `rev-parse` is what returns the tag object.
#
# That arm was MANUAL, on a clone this repo does not carry, and the cold lane's
# sharpest finding was that the tests shipped beside it could not fail: all
# three used manifests with no clone, reached the `resolved is None` SKIP, and
# stayed green when `tag_object` was dropped entirely. `_clone_at(…,
# annotated=True)` now builds a real annotated tag in `tmp_path`, and that same
# regression is a mutation arm that DIES.
tag_prefix = "rust-v"
manifest = "sources/codex.manifest"

[tool.antigravity-cli]
# Google's Antigravity CLI (Gemini 3.x). Ray, 2026-08-19: a CRITICAL currency
# dependency, and it earns that outright — with `codex` out of credits it IS the
# cold-review lane, so a stale antigravity is a stale review gate.
#
# It was absent from this file entirely until now, which is the whole point of
# the row: the engine reported green for it forever by never asking. It was also
# where an inherited-false number came from — a handoff recorded "agy 1.1.14 vs
# currency.toml pin 1.1.13" when the pin was `mise.toml`'s 1.1.11 and this file
# did not mention antigravity at all. Both halves wrong, and the figure reached
# Ray's own directive text before anyone re-derived it.
mise_key = "antigravity-cli"
binary = "agy"
github = "google-antigravity/antigravity-cli"
# The HOUSE form (`^v?(\d+\.\d+\.\d+)`, as at `[tool.hk]` and `[tool.fnox]`),
# plus an end anchor. Measured: `mise exec -- agy --version` prints a BARE
# `1.1.15`, so nothing more is needed and a non-matching pattern returns "" —
# rendered as "could not read", an honest UNKNOWN, never a false green.
#
# It was briefly `^\D*?v?(...)` to tolerate any leading name. Ray, 2026-08-19:
# remove it "if it isnt necessary anymore". It was not — no other row in this
# file matches an arbitrary prefix; every one names what it expects
# (`^uv `, `^ruff `, `^ty `, `^(?:codex-cli )?`), and hardening against a
# hypothetical future output was config carrying a fact nothing had observed.
#
# The `$` STAYS, and it is not the speculative half: without it `re.search`
# truncates `agy v1.1.15.1` and `agy 1.1.15rc1` to a false `1.1.15` instead of
# refusing to read them. That hole is in the ORIGINAL bare-anchored form too, so
# reverting further would restore a real defect rather than remove speculation.
version_pattern = '^v?(\d+\.\d+\.\d+)$'
# ⚠️ ASK THE BINARY, NEVER THE INSTALL DIRECTORY. `agy` SELF-UPDATES IN PLACE:
# the binary inside the `1.1.5` install dir once reported 1.1.10, so the
# directory name is mise's label and `mise which` can never answer "which
# version is this". `binary` above is what makes this row honest; a
# path-derived check here would be decoration.
#
# `manifest` is deliberately absent for now: there is no
# `sources/antigravity-cli.manifest`, and declaring one before the source is
# pinned would report DRIFT against a file that does not exist — the same false-
# DRIFT shape `[tool.codex]` above documents at length. Add both together.

[tool.agnix]
# The agent-documentation validator. Ray, 2026-08-19: "make a critical/currency
# dependency / make github repo a graphify source it syncs with".
#
# It earns CRITICAL for a reason no other row here has: agnix runs
# **warnings-as-errors** (`mise run lint-docs` is `agnix . --strict`, and the hk
# `agnix` step is the same check), so a rule ADDED upstream becomes a lint
# FAILURE here the moment the pin moves. Every other tracked tool can drift
# quietly; this one converts upstream's editorial decisions into our red gate.
# v0.49.0 is the worked example — it added CC-SET-024, warning on a
# project-level `sandbox.ripgrep` override that Claude Code silently ignores.
# We do not set that key, so `--strict` stayed green, but that was verified by
# RUNNING it rather than by reading the note.
mise_key = "github:agent-sh/agnix"
binary = "agnix"
github = "agent-sh/agnix"
# `mise exec -- agnix --version` prints `agnix 0.49.0` — the house form with the
# tool's own name anchored, as at `[tool.ruff]` / `[tool.ty]`.
version_pattern = '^agnix (\d+\.\d+\.\d+)'
manifest = "sources/agnix.manifest"

[[tool.agnix.watch]]
kind = "local"
id = "agnix-tags-are-annotated-and-unsorted"
note = """TWO probe traps live on this repo's tag list, both hit on the 0.49.0
bump and both recorded in `sources/agnix.manifest`.

1. **The tags are ANNOTATED.** `git ls-remote --tags --refs .../agnix v0.49.0`
   returns `dc388699…`, which is the TAG OBJECT, not the commit. The commit is
   `b0401135…` (`gh api repos/agent-sh/agnix/commits/v0.49.0 --jq .sha`). Two
   routes, two different 40-hex strings, and only one of them is a commit — a
   manifest pinned to the tag object still clones, so nothing would have
   reported it. Contrast graphify and datamodel-code-generator, whose
   lightweight tags make both routes agree.

2. **The tag list is not sorted by version.** `git ls-remote --tags` ends at
   `v0.9.3`, which reads like the latest and is THREE MINORS behind v0.49.0.
   Ask `gh api repos/agent-sh/agnix/releases/latest --jq .tag_name` instead.
   This is a display-order bound wearing the clothes of an answer — exactly
   `probes-need-a-control-arm.md` rule 3.

Re-probe both on each bump: an upstream that switches to lightweight tags
retires (1), and nothing retires (2) short of a version-sorted listing."""

[tool.datamodel-code-generator]
# Ray, 2026-08-19: "make a critical/currency dependency / make github repo a
# graphify source it syncs with". Directive R6 (2026-08-08) makes it the ONE
# owner of generated models.
#
# ⚠️ IT IS USED. THREE GENERATORS DEPEND ON IT, and this row nearly shipped
# saying the opposite. The claim here was "DECLARED BUT NOT YET USED", sourced
# to `docs/directives-2026-08-08.md`'s `git log -S datamodel --all` -> 0 hits —
# an INHERITED NUMBER, true on 2026-08-08 and false by 2026-08-19. It was used
# to argue that 0.73.0's breaking changes cost nothing *because nothing invokes
# it*, which is a right answer resting on a wrong premise: the most disarming
# shape a comment can take. The cold lane rated it P1.
#
#   schemas/generate_fetch_receipt.py  -> python/src/kb_setup/generated/fetch_receipt.py
#   schemas/generate_source_groups.py  -> python/src/kb_setup/generated/source_groups.py
#   schemas/generate_session_select.py -> python/src/kb_setup/generated/session_select.py
#
# The REAL reason 0.73.0's breaking changes (validated `--additional-imports`,
# reserved `--extra-template-data` keys now erroring, built-in templates
# serializing values as non-executing literals) cost this repo nothing is a
# MEASUREMENT, not an absence: all three generators were re-run at 0.74.0 and
# `git diff --stat python/src/kb_setup/generated/` came back EMPTY. That probe
# discriminates — the same command failed loudly minutes earlier at the version
# guard.
#
# ⚠️ THE STRUCTURAL CLAIM THAT USED TO SIT HERE WAS FALSE, and it was written
# while CORRECTING a different false claim four lines up. It read "none of the
# three passes `--additional-imports`, `--extra-template-data` or a custom
# template dir". All three DO pass `--custom-template-dir`
# (`schemas/generate_*.py`, one call site each), and the cold lane caught it in
# round 2 — a correction can be wrong twice, and the replacement sentence gets
# LESS scrutiny than the one it replaces.
#
# What is TRUE, and it is stronger: `schemas/templates/` supplies
# `msgspec.jinja2` and `Enum.jinja2`, and the output type is `msgspec.Struct` —
# so that directory provides the ROOT template, not just includes. 0.73.0 states
# that "trusted custom root templates (`--custom-template-dir` providing the root
# template) keep the previous unrestricted raw behavior", and its
# include-only-directory change explicitly does NOT reach a directory that
# supplies the root. So this repo is on the path 0.73.0 left alone, by
# construction rather than by luck.
#
# The two claims that ARE structural and ARE checked: none of the three passes
# `--additional-imports` or `--extra-template-data`, which is what the other two
# breaking changes key on. Verified by grep across `schemas/*.py`, zero hits
# against a control of three hits for `--custom-template-dir` in the same files.
#
# Each generator pins its own `GENERATOR_VERSION` and refuses to run under a
# different one, so a bump MUST move four places at once: this row, the
# pyproject pin, all three generator constants. #393 is about that class.
#
# NOT a `[tools]` pin: it is a `codegen` dependency-group entry in the root
# pyproject.toml, reached as `uv run datamodel-codegen`. Same shape as
# `[tool.ruff]` / `[tool.ty]`, so it takes `expected` rather than pretending
# mise owns it. Bump `expected` and the pyproject pin in the same change, or
# this row asserts a review that did not happen.
expected = "0.74.0"
binary = "datamodel-codegen"
github = "koxudaxi/datamodel-code-generator"
pypi = "datamodel-code-generator"
version_pattern = '^datamodel-codegen (\d+\.\d+\.\d+)'
manifest = "sources/datamodel-code-generator.manifest"

[[tool.datamodel-code-generator.watch]]
kind = "local"
id = "codegen-version-literal-is-load-bearing-in-a-test"
note = """`tests/test_skillopt_contract.py` copies the REAL `pyproject.toml`
into a tmp dir and `.replace()`s the exact string
`codegen = ["datamodel-code-generator==<version>"]`. The bump to 0.74.0 made
that replace a silent no-op and the assertion failed — loudly, which is the
only good part.

The repair is more fragile than it looks, and that is the finding: the literal
also depends on the ARRAY BEING ON ONE LINE. `uv add --group codegen` writes
it multi-line; `mise run fmt` (taplo) collapses it back. So the test passes
today because two independent tools happen to agree on formatting, not because
anything asserts it. A taplo config change would break it with no bump at all.

The durable fix is for that test to construct its own fixture rather than
string-replace a copy of a real config file — a test must own its own
environment. Until then: bump the pin, update BOTH literals, and run
`mise run fmt` before `pytest`.

Re-probe on each bump by running `pytest tests/test_skillopt_contract.py`
BEFORE assuming the pin change is complete."""

[[tool.datamodel-code-generator.watch]]
kind = "local"
id = "codegen-tags-carry-no-v-prefix"
note = """Tags here are bare (`0.74.0`), not `v0.74.0`. A resolver that tries
only `v<x>` finds nothing and an apply aborts rather than mispinning — the same
class as `[tool.codex]`'s `rust-v<version>`, in the opposite direction. Stated
so that abort reads as a known shape rather than a bug."""
