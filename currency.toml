# Tool-currency config — what `kb-setup currency` checks in THIS repo.
#
# One `[tool.<name>]` table per tracked tool. graphify is the pilot; mise, hk,
# uv, ruff and ty adopt the same shape with no engine change, which is the whole
# reason this is config and not code.
#
# Each repo carries its own config and runs independently (decided 2026-07-23).
# There is deliberately NO cross-repo assertion here: this repo must never learn
# anything about a consumer, which is the same rule that had
# `sources/dotfiles.manifest` reverted.

[tool.graphify]
# The mise pin this tool is installed from. Both the bare-string and table forms
# of a pin are read, because both are in use across these repos.
mise_key = "pipx:graphifyy"
binary = "graphify"
# mise's pipx backend installs from PyPI, so PyPI — not the newest GitHub tag —
# is the installable truth. On 2026-07-23 v1.0.0 was tagged on GitHub while PyPI
# was still 0.9.25; tracking the tag would have pinned something uninstallable.
pypi = "graphifyy"
github = "Graphify-Labs/graphify"
extras = ["all"]
# Packages the `all` extra must ACTUALLY deliver — comparing two config files
# cannot tell you the install is intact. Deliberately NOT the full extra set:
# graspologic/leidenalg/igraph auto-skip by PEP 508 marker on Python 3.14 (the
# accepted Louvain fallback), so demanding them would report drift that is not
# drift. Verified present on this host 2026-07-24.
extra_probes = ["faster_whisper", "tree_sitter", "tree_sitter_cpp"]
# The ingested corpus must describe the release we actually run.
manifest = "sources/graphify.manifest"
# graphify stamps no version into its own output (`export.to_json()` writes only
# `built_at_commit`), so the build task writes this sidecar instead — otherwise
# "which version built this graph?" is unanswerable from the artifact.
artifact = "graphify-out/graph.json"
# The GENERATED outputs `kb-artifacts` derives from the graph. Ray's step 1 said
# "in sync with the graph AND generated outputs", so the stamp fingerprints
# these too (a stat, so it is cheap) and step 1 flags a stale wiki/graphml/svg/
# report the same way it flags a stale graph. `kb-artifacts` re-stamps them.
# Directories (wiki/) are fingerprinted by their own mtime/size — a regeneration
# that adds or removes a page changes the directory stat, which is the signal we
# want without walking thousands of files in a per-session hook.
#
# svg is DELIBERATELY absent, though the handoff suggested it. `kb-artifacts`
# skips svg above 5,000 nodes (unreadable hairball + a mathtext `$` crash), and
# this graph is ~128k nodes — so svg is never regenerated here. Declaring it
# would make step 1 report a permanent "missing/stale svg" for an output the
# build correctly never produces: the exact absence-of-evidence false-drift this
# engine exists to avoid. Re-add it only for a repo whose graph stays under the
# limit. (Control-armed 2026-07-24: graph.json is 128,205 nodes.)
artifacts = [
  "graphify-out/GRAPH_REPORT.md",
  "graphify-out/graph.graphml",
  "graphify-out/wiki",
]
stamp = "graphify-out/.currency-stamp.json"
# graphify is host-only here. On a Linux CI runner these checks must report
# NOT-APPLICABLE rather than fail: "cannot check here" and "checked and wrong"
# are different answers.
os = ["macos"]

# ---- Step 4: what we are tracking upstream, and what we owe ourselves --------

[[tool.graphify.watch]]
kind = "local"
ref = "label-communities-schema-gap"
note = """`label_communities` (llm.py) has no JSON-schema constant, unlike
`_EXTRACTION_JSON_SCHEMA`. Extraction is fixed; LABELLING is still broken —
probed on 0.9.25, 42/42 batches failed. Community names come from the free
deterministic `label_communities_by_hub` instead. Re-probe on each bump.

STILL PRESENT on 0.9.26 (re-probed 2026-07-26). The cheap re-probe is a file
diff, not a batch run: `llm.py` is BYTE-IDENTICAL across the two installs, so
the gap cannot have moved. Counts agree in both — `_EXTRACTION_JSON_SCHEMA` x2,
label-side schema constant x0, `def label_communities` x1 — and a bogus symbol
greps to 0 in the same file, so the zero is an absence rather than a broken
probe. Do the diff first on the next bump; only run the 42-batch probe if the
file actually changed."""

[[tool.graphify.watch]]
kind = "issue"
ref = "2101"

[[tool.graphify.watch]]
kind = "issue"
ref = "2086"

[[tool.graphify.watch]]
kind = "issue"
ref = "1653"

[[tool.graphify.watch]]
kind = "issue"
ref = "1824"

# ---- ffmpeg: graphify's video extra depends on it, but it is not a pip dep ----
#
# `graphify add <youtube-url>` shells out to ffmpeg (via faster-whisper) to
# extract audio before transcription. It ships from conda, not PyPI, so nothing
# in graphify's own currency picture covers it — a missing or downgraded ffmpeg
# silently breaks youtube ingestion with no signal. Tracked here as a
# PRESENCE-ONLY tool: no `pypi`/`github`, so step 1 checks the pin resolves and
# the binary is reachable, and the upstream probe reports "not version-tracked"
# rather than manufacturing a permanent unreachable-upstream ambiguity.
[tool.ffmpeg]
mise_key = "conda:ffmpeg"
binary = "ffmpeg"
# Host-only, like graphify: on a Linux CI runner this reports not-applicable
# rather than failing, since the conda install lives on the Mac host.
os = ["macos"]

# ---- mise itself: the one dependency that gates every other one --------------
#
# Every workflow here is a `mise run` task, and mise is installed standalone at
# ~/.local/bin/mise and SELF-UPDATES out-of-band from any terminal on the host.
# Until this entry existed nothing noticed. The cost of that blind spot, from a
# review of all 13 published v2026.7.x releases (25 days): one silent breaking
# change needing no opt-in (Tera v1 -> v2, #10756) and a 12-release window where
# structured env files were shell-expanded, corrupting literals and pulling in
# ambient process values (#11269, fixed in 7.14). This repo escaped the second
# only by not using `env._.file` — luck, not design.
#
# SELF-MANAGED, so there is no `mise_key`. A `[tools] "ubi:jdx/mise"` pin was
# tried and reverted: it installs fine, but the pinned copy then SHADOWS the
# ambient binary that actually runs every task, so this check would compare
# pinned-against-pinned and report in sync forever (measured — `which(mise)`
# moved to the install dir the moment the pin was added). A pin that blinds the
# check it was meant to feed is worse than no pin.
#
# `expected` is therefore the version whose release notes we have READ. Drift
# means the host moved under us; the fix is to review the gap and then bump this
# line, which is what records that the review happened. `mise.toml`'s
# `min_version` is the other half and cannot do this job: both its keys compare
# "lower than", so a floor never fires on a self-update, which always moves up.
[tool.mise]
binary = "mise"
expected = "2026.7.15"
# `mise --version` prints `2026.7.15 macos-arm64 (2026-07-27)`, so the engine's
# default last-whitespace-field heuristic returns the build DATE. Anchored at the
# start so it reads the version and not some later digit run.
# TOML literal string: a basic "..." would need doubled backslashes
version_pattern = '^v?(\d+\.\d+\.\d+)'
# Releases only — mise is not on PyPI, and GitHub is where the notes live.
github = "jdx/mise"
# No `os` restriction: unlike graphify and ffmpeg, mise is required everywhere
# this repo is checked out, so "absent" is a real failure on any platform.

[[tool.mise.watch]]
kind = "local"
ref = "min-version-floor-vs-reviewed-version"
note = """Two versions are declared and they mean different things. Keep them
straight on every bump: `currency.toml` `expected` = the version whose notes we
have read (moves every time we review); `mise.toml` `min_version.soft` = the
version we are verified against; `min_version.hard` = the oldest we will run at
all (2026.7.14, where #11269/#11288/#11296 landed). soft must stay ABOVE hard or
it is inert — hard errors across exactly the range soft would warn in."""

[[tool.mise.watch]]
kind = "local"
ref = "tera-v1-escape-hatch-removal"
note = """mise moved templates from Tera v1 to v2 in v2026.7.1 (#10756) with a
`tera_v1` / `MISE_TERA_V1` escape hatch scheduled for REMOVAL in 2027.4.0
(#10817). This repo sets neither, so it is already on v2 — the item is here so
the 2027.4.0 release is not read as routine."""

[tool.claude-code]
# The harness itself. Tracked NOT for a mise pin — Claude Code manages its own
# updates and is not in `[tools]` — but because `docs_watch` below is the only
# mechanism that notices when a FEATURE's semantics change. `/goal` lives
# entirely in its docs page: Anthropic can revise it any day without a release
# that looks relevant, and every goal+rider pair under `docs/goals/` plus the
# `goal-engineering` skill is built on what that page says.
#
# `expected` (self-managed, like mise) rather than `mise_key`: pinning the
# harness that runs the session is not a thing this repo can or should do. Bump
# it after reviewing the release notes — that act IS the gap analysis.
expected = "2.1.220"
binary = "claude"
github = "anthropics/claude-code"
# `claude --version` prints `2.1.220 (Claude Code)`, whose last whitespace field
# is `Code)` — the same trap mise's `2026.7.15 macos-arm64 (2026-07-27)` set,
# where the default heuristic returned the build DATE. Capture explicitly.
version_pattern = '^(\d+\.\d+\.\d+)'
# Fingerprinted pages. goal.md is the primary interface for the goal-engineering
# skill; hooks.md defines the Stop-hook contract /goal is built on (it is "a
# built-in shortcut for a session-scoped prompt-based Stop hook"), so a change
# there can alter goal behaviour without goal.md moving at all.
docs_watch = [
  "https://code.claude.com/docs/en/goal.md",
  "https://code.claude.com/docs/en/hooks.md",
  "https://code.claude.com/docs/en/skills.md",
]
