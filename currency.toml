# ---------------------------------------------------------------------------
# hk — the git-hook gate this repo's `mise run lint` IS (#87)
# ---------------------------------------------------------------------------
# The ordinary PINNED-tool shape, not `[tool.mise]`'s self-managed one: hk is in
# this repo's `[tools]`, so `mise_key` resolves and `expected` is deliberately
# ABSENT — the engine reads `expected` as "self-managed", which hk is not.
#
# No `version_pattern`: `hk --version` prints exactly `hk 1.52.0`, so the
# engine's default `text.split()[-1].lstrip("v")` returns `1.52.0` already.
# mise and claude-code need patterns because their output carries a platform and
# a build date after the version; adding one here would only create a way for
# the match to stop working.
#
# On `kind = "issue"` for hk — read this before adding one. `jdx/hk` has
# `has_issues: false`; its tracker is DISCUSSIONS (probed 2026-07-31; control
# arm: this repo returns `has_issues: true`, so the probe discriminates).
#
# That does NOT make `kind = "issue"` universally impossible here, and an earlier
# version of this comment wrongly said it did. Measured, three arms:
#
#   repos/jdx/hk/issues/1099   -> 200  (a PR — the issues endpoint serves PRs)
#   repos/jdx/hk/issues/1098   -> 404  (a DISCUSSION — not on that endpoint)
#   repos/jdx/hk/issues/999999 -> 404  (control)
#
# So a watch pointing at a hk PR NUMBER would resolve, and `issues.py` never
# checks `has_issues` before fetching, so nothing pre-empts it either way. What
# cannot be watched is hk's actual tracker: a discussion 404s permanently, and a
# watch whose lookup always fails blocks the unambiguous-bump gate forever rather
# than failing loudly.
#
# The two items below are `local` for a different and simpler reason: neither is
# an upstream item whose state we are waiting on. One records a DECISION (the
# depends ban stays) and one a fact about this repo's SHAPE (the version is
# written in three places). Nothing upstream will ever close them.
[tool.hk]
mise_key = "hk"
binary = "hk"
github = "jdx/hk"
# The ingested corpus must describe the release we actually run — the same
# invariant `[tool.graphify]` states above, and it is NOT optional here just
# because these manifests are newer.
#
# ⚠️ ADDED 2026-08-03 AFTER A COLD REVIEW CAUGHT ITS ABSENCE. `sources/hk.manifest`
# landed 2026-08-02, but this table was never told about it — and
# `sync.py`'s manifest check turns an absent `ToolSpec.manifest` into **SKIP with
# the reason "this repo pins no source manifest for the tool"**. That reason was
# true when written and became false the day the manifest landed, so the checker
# reported a clean SKIP over a real drift: this repo bumped hk in `mise.toml`
# while the manifest still pinned the previous release, and `kb-build` went on
# extracting the OLD source into the corpus.
#
# That is precisely the DRIFT/SKIP/OK collapse this engine refuses everywhere
# else, arriving through the one door nothing was watching: a SKIP whose stated
# reason is a fact about the repo that can silently stop being true.
manifest = "sources/hk.manifest"

[[tool.hk.watch]]
kind = "local"
ref = "depends-ban-is-now-a-choice-not-a-workaround"
note = """`hk.pkl` bans `depends` in favour of `exclusive = true` because a failed
dependency used to deadlock every dependent (`hk.pkl:152`, and the same doctrine
in `long-running-command-hangs.md` rule 5 + dotfiles' `no_hk_depends` step). The
trigger condition is `fail_fast = false` AND a step carrying `depends`. This
repo sets the first at `hk.pkl:12` and, because of this very ban, has ZERO of the
second — the only occurrence of `depends` in `hk.pkl` is the comment forbidding
it. So the deadlock could never have fired here; the ban is what made it
unreachable, which is the point rather than a caveat to it.

**Upstream FIXED it in v1.53.0 (#1099): dependents no longer hang after a failed
dependency.** So the ban is no longer a workaround for a live defect — it is a
choice, and `tool-currency-and-native-first.md` says custom avoidance kept alive
by a fixed defect is exactly what to re-examine.

Deliberately NOT retired (Ray, 2026-07-31): `exclusive` works, the doctrine spans
both repos, and dotfiles machine-enforces it — retiring it here alone would split
the two repos' rules. Recorded WITH its version condition so a future reader knows
which of the two it is, and so any revival is a decision rather than a rediscovery.

RE-PROBED 2026-08-03 for v1.54.0: unchanged in substance. 1.53.0 carried the
#1099 fix already recorded; 1.54.0 adds `check_failed_files`, command-effect
declarations and perf (17% smaller binary, 31% faster startup) with no
dependency-graph change. The ban stays a CHOICE, still deliberately not retired.

RE-PROBED 2026-08-08 for v1.54.1: unchanged in substance, and the release is
adjacent to this item without moving it. 1.54.1 is four bug fixes; the relevant
one (#1140) makes hk print an end-of-run hint on a git `index.lock` conflict
"pointing to `exclusive = true`, `depends`, or separate groups", and the docs
now steer authors toward `stage` for hk-owned staging and `exclusive` for
legacy commands that write the index directly. That is GUIDANCE, not a
dependency-graph change — upstream's own advice now names `exclusive` first,
which is what this repo already does. The ban stays a CHOICE, still
deliberately not retired."""

[[tool.hk.watch]]
kind = "local"
ref = "hk-version-is-written-three-times"
note = """dotfiles' `hk_version_parity` step does not port — it exists because
that repo carries THREE pkl files whose hk pins can drift apart, and this repo has
exactly ONE (`hk.pkl`, verified 2026-07-31).

But a drift surface remains on a DIFFERENT axis: the version appears three times
across two files — `mise.toml`'s `hk` pin, and `hk.pkl`'s `amends` and `import`
URLs. A `mise.toml`-only bump runs a new BINARY against the old SCHEMAS. Bump all
three together, or the mismatch shows up as a pkl error with nothing pointing at
the pin.

RE-PROBED 2026-08-03 at the 1.52.0 -> 1.54.0 bump, and the method held: the
version occurred exactly TWICE in `hk.pkl` (`amends` + `import`) and once in
`mise.toml`. All three moved in one edit, asserted on the count rather than
replaced blindly, then `hk validate` (rc=0) and `mise run lint` (rc=0) confirmed
the new binary agrees with the new schemas — which is this item's whole point.

RE-PROBED 2026-08-08 at the 1.54.0 -> 1.54.1 bump, and the method held again:
the version occurred exactly TWICE in `hk.pkl` (`amends` + `import`) and once in
`mise.toml`. Asserted on the count before editing (2, with a control of 0 for a
version not present), moved all three in one change, then `hk validate` rc=0 and
`mise run lint` rc=0 confirmed the new binary agrees with the new schemas.

NEW this round, and it is the failure this item exists to prevent wearing a
different hat: after `mise install`, a bare `hk` still ran **1.54.0** while
`mise which hk` reported 1.54.1. `MISE_ENV_CACHE=1` and the stale install dirs
sit at PATH positions 4/5/8, ahead of the shims. So "did the bump take?" cannot
be answered with `hk version`; use `mise exec -- hk version` or the absolute
path. The engine's own `resolution` check reports this independently."""

# ---------------------------------------------------------------------------
# fnox — the credential tool the shell's secrets come from (#86)
# ---------------------------------------------------------------------------
# Ray's call, 2026-07-31: track it "like hk" — an ordinary pinned tool. So fnox
# is now pinned in `[tools]` too, and this block takes `mise_key`, NOT
# `[tool.mise]`'s self-managed `expected` shape.
#
# The problem it closes: fnox resolved from the user's GLOBAL mise, which
# installs it into a directory literally named `latest` and self-updates out of
# band. Installed 1.31.1 and upstream latest 1.31.1 (probed 2026-07-31, both
# arms), so there was no drift — only no way to notice any.
#
# Scope, so the `do-not.md` #11 tension is not re-derived from scratch: this
# tracks a VERSION and touches nothing under `~/.config/fnox`. fnox's real
# enforcement — the `env = "exec"` baseline and the `mde-py bootstrap_config()`
# wipe that silently drops the mode plus all four opt-ins — lives in dotfiles'
# `doctor.toml` as `fnox-baseline`, and stays there. Before this, NOTHING tracked
# fnox's version anywhere: dotfiles' `currency.toml` carries only `[tool.graphify]`
# (control arm: `mise` appears 8 times in that file, so the grep discriminates).
[tool.fnox]
mise_key = "fnox"
binary = "fnox"
github = "jdx/fnox"
# The ingested corpus must describe the release we actually run — the same
# invariant `[tool.graphify]` states above, and it is NOT optional here just
# because these manifests are newer.
#
# ⚠️ ADDED 2026-08-03 AFTER A COLD REVIEW CAUGHT ITS ABSENCE. `sources/fnox.manifest`
# landed 2026-08-02, but this table was never told about it — and
# `sync.py`'s manifest check turns an absent `ToolSpec.manifest` into **SKIP with
# the reason "this repo pins no source manifest for the tool"**. That reason was
# true when written and became false the day the manifest landed, so the checker
# reported a clean SKIP over a real drift: this repo bumped fnox in `mise.toml`
# while the manifest still pinned the previous release, and `kb-build` went on
# extracting the OLD source into the corpus.
#
# That is precisely the DRIFT/SKIP/OK collapse this engine refuses everywhere
# else, arriving through the one door nothing was watching: a SKIP whose stated
# reason is a fact about the repo that can silently stop being true.
manifest = "sources/fnox.manifest"

[[tool.fnox.watch]]
kind = "local"
ref = "pinned-here-global-stays-on-latest"
note = """Pinning fnox in this repo's `[tools]` means the shim resolves to the
pinned version INSIDE this directory while the global install stays on `latest`
— an accepted skew, chosen deliberately so this repo states the fnox it expects.
Bump the two together; a bump here alone narrows the skew rather than closing it,
and the global side is not this repo's to edit (`do-not.md` #11).

RE-PROBED 2026-08-03 at the 1.31.1 -> 1.32.0 bump: the skew is UNCHANGED and
still accepted. 1.32.0 is purely additive (credential proxy, `exec --replace`,
Azure App Configuration provider, AWS IAM role assumption) with no change to how
a pinned shim resolves. Checked and explicitly NOT true: it does not address
knowledge-base #74 (`env="exec"` silently emptying env-var credentials) —
`exec --replace` is a new process-replacement MODE, not a fix to that path, so
#74 stays open. **The global fnox bump is still owed** and is Ray's to make."""

[tool.skillopt]
# SkillOpt (microsoft/SkillOpt) — INGESTED, not installed, which is why this is the
# first `source_only` entry. Two distinct things ship from that one repo:
#
#   * the SkillOpt python package (PyPI `skillopt`), a research framework that
#     trains a SKILL DOCUMENT against a benchmark behind a held-out validation
#     gate. We do not install it and have no benchmark for our skills.
#   * SkillOpt-Sleep, the deployment-time companion, which IS a Claude Code
#     plugin — enabled project-scope in `.claude/settings.json` via a `github`
#     marketplace source. It runs from a git checkout and needs no `pip install`.
#
# So there is NO binary on PATH and no `[tools]` pin, and every binary-shaped
# check would report a permanent false red. `source_only` skips them and keeps
# the part that was actually asked for (Ray, 2026-08-03): tell us when a new
# release lands, the way graphify's workflow does.
#
# `pypi` is deliberately ABSENT even though the package exists there. PyPI is the
# installable truth only for something mise installs; here the plugin is fetched
# from git at `ref = main`, so a PyPI version would be a number we compare against
# and never act on. GitHub releases are both the version source and the narrative.
source_only = true
github = "microsoft/SkillOpt"
manifest = "sources/skillopt.manifest"

[[tool.skillopt.watch]]
kind = "local"
ref = "sleep-handoff-mode-needs-a-main-checkout"
note = """SkillOpt's own plugin README, read at commit 61735e39: "PyPI 0.2.0
provides the base Sleep CLI, but handoff mode and `--preferences` require a
source checkout from `main` until the next release."

Our marketplace entry uses a `github` source at `ref = main`, so we DO get the
source checkout — this is recorded so the condition travels with the fact rather
than being rediscovered. Re-check on the next release: once handoff mode ships to
PyPI the distinction stops mattering, and this item can be closed.

RE-PROBED 2026-08-05 at the v0.2.0 review: upstream's latest release is STILL
v0.2.0 (no "next release" yet), and the claim is still in the pinned clone at
61735e39 (`plugins/claude-code/README.md:59`). The `main` pin therefore remains
the required shape, and the engine's "'main' -> 'v0.2.0' could not be parsed"
ambiguity is a version-string artifact, not a pending upgrade: the pinned
commit post-dates the tag. Item stays open."""

[[tool.skillopt.watch]]
kind = "local"
ref = "sleep-writes-outside-this-project"
note = """SkillOpt-Sleep is the one adopted plugin that writes outside the repo.
Its SessionEnd hook appends to `~/.skillopt-sleep/session-end.log` (async, exit 0,
no API spend, verified by reading `hooks/on-session-end.sh` at 61735e39), and the
consolidation cycle proposes edits to `CLAUDE.md` / `SKILL.md` files.

Nothing is written live until a human runs `/skillopt-sleep adopt`, and every
adopt backs up the prior file. That review is the control: `do-not.md` #11 keeps
this repo out of `~/.claude`, and an unreviewed self-edit would route around it.
Re-read the hook on every version bump — a change from marker-append to anything
that spends budget or writes a tracked file is a different bargain.

RE-PROBED 2026-08-05 at the v0.2.0 review: `plugins/claude-code/hooks/
on-session-end.sh` re-read at the pinned 61735e39 — still exactly a
timestamp+PWD append to `~/.skillopt-sleep/session-end.log`, unconditional
`exit 0`, no API spend, no tracked-file write. Same bargain. Also noted from
the v0.2.0 notes: "Redact secrets before persisting cycle diagnostics" — a fix
in the right direction for the surface this item watches."""

# ─── Added 2026-08-08 (#242): the four tools with BOTH a pin and a manifest that
# this table had never heard of. Until now a currency run checked 7 tools while
# the repo pinned 11, so uv/ruff/codex/ty drifted in BOTH directions unwatched —
# the pin against upstream, and the manifest against the pin. Nothing reported a
# problem, because a tool absent from this file produces no row at all: not a
# DRIFT, not even a SKIP. That is the one failure mode this engine is otherwise
# built to refuse, arriving as silence rather than as a green tick.
#
# All four are ordinary pinned tools, so they take `mise_key` (like hk) rather
# than `expected` (like mise/claude-code, which self-update).
# ─────────────────────────────────────────────────────────────────────────────

[tool.uv]
mise_key = "uv"
binary = "uv"
github = "astral-sh/uv"
pypi = "uv"
# `uv --version` prints `uv 0.12.3 (5072309 2026-08-07 aarch64-apple-darwin)` —
# the last whitespace field is the target triple, so anchor rather than take the
# default heuristic. Same trap as mise and claude-code above.
version_pattern = '^uv (\d+\.\d+\.\d+)'
manifest = "sources/uv.manifest"

[tool.ruff]
# NOT a `[tools]` pin: ruff is a `dev` dependency in the root pyproject.toml
# (`ruff==0.16.2`), reached as `uv run ruff`. So there is no `mise_key` — the
# engine offers exactly three managers and none of them is uv, which is why this
# takes `expected` (the version we have REVIEWED) rather than pretending mise
# owns it. Bump `expected` and the pyproject pin in the same change, or this row
# asserts a review that did not happen.
expected = "0.16.2"
binary = "ruff"
github = "astral-sh/ruff"
pypi = "ruff"
version_pattern = '^ruff (\d+\.\d+\.\d+)'
manifest = "sources/ruff.manifest"

[tool.ty]
# Same shape as ruff: a `dev` dependency (`ty==0.0.69`), not a mise pin, so
# `expected` for the same reason. Pre-1.0 and moving fast, which is exactly why
# it needs a row rather than trust — a 0.0.x bump can carry a breaking change
# with no marker to trip gate 3.
expected = "0.0.69"
binary = "ty"
github = "astral-sh/ty"
pypi = "ty"
version_pattern = '^ty (\d+\.\d+\.\d+)'
manifest = "sources/ty.manifest"

[tool.codex]
mise_key = "codex"
binary = "codex"
github = "openai/codex"
# ⚠️ codex tags releases `rust-v<version>`, NOT `v<version>` — so
# `manifest.resolve_tag`'s `v<x>` / `<x>` pair resolves NEITHER, and an apply
# would abort rather than mispin. Recorded here so that abort reads as a known
# shape rather than a bug; advance `sources/codex.manifest` by hand.
#
# ⚠️ `mise ls-remote codex` is the WRONG instrument for "does this version
# exist" — the aqua registry lags GitHub by a day or more (mise.toml records the
# measurement: 0.146.1 was Latest upstream for ~4h and absent from all 277 rows).
# Verify a codex bump by attempting the install.
version_pattern = '^(?:codex-cli )?(\d+\.\d+\.\d+)'
# `manifest` is DELIBERATELY ABSENT, and this is the one row where that is the
# correct answer rather than the #242 hole this whole section closes.
#
# It was declared, run, and REFUTED by its own first output: the check compares
# the manifest ref to the installed version, and `rust-v0.147.0` != `0.147.0`,
# so it reported `the corpus describes code we do not run` for a manifest that
# is pinned exactly right. A permanent false DRIFT is worse than a SKIP — it
# trains a reader to ignore the line, which is how the real one gets missed.
# Same reasoning as `[tool.graphify]`'s absent `svg` artifact above.
#
# The fix belongs in the ENGINE (teach it a ref prefix), not in a row that lies
# in the meantime. Until then codex's manifest is advanced by hand, and this
# comment is what stops the next reader "fixing" the omission.
#
# THE SAME PREFIX ALSO DEFEATS VERSION TRACKING, and that one is KEPT. The first
# full run reported `codex 0.147.0, latest UNKNOWN` — the engine cannot read
# `rust-v0.147.0` as a version, so no upstream baseline is ever recorded.
#
# Keeping that row while deleting the manifest row is not inconsistent, and the
# difference is the whole doctrine of this engine: UNKNOWN is an HONEST answer
# ("checked, could not tell"), and the run renders it under `NOT CHECKED against
# upstream (this is not a pass)`. The manifest row produced a false DRIFT —
# an assertion that something was wrong when it was right. One is silence about
# a question; the other is a wrong answer to it. Only the second had to go.
#
# So codex sits alongside skillopt as a permanent, LABELLED unknown until the
# engine learns a `tag_prefix`. Tracked as a repo issue, not as a TODO here.
