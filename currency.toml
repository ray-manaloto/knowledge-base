the mechanism holds verbatim — 1.5s shared budget, per-hook `timeout` raises it,
ceiling still 60 — so the declared 60 stays correct. Two NEW facts on the same
paragraph: (1) `CLAUDE_CODE_SESSIONEND_HOOKS_TIMEOUT_MS` now overrides the
budget explicitly — an escape hatch, not needed here; (2) "Timeouts set on
plugin-provided hooks don't raise the budget" — our audit hook is declared in
`.claude/settings.json` (repo settings, not a plugin), so it still buys the 60;
