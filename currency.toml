# ---- ffmpeg: graphify's video extra depends on it, but it is not a pip dep ----
#
# `graphify add <youtube-url>` shells out to ffmpeg (via faster-whisper) to
# extract audio before transcription. It ships from conda, not PyPI, so nothing
# in graphify's own currency picture covers it — a missing or downgraded ffmpeg
# silently breaks youtube ingestion with no signal. Tracked here as a
# PRESENCE-ONLY tool: no `pypi`/`github`, so step 1 checks the pin resolves and
# the binary is reachable, and the upstream probe reports "not version-tracked"
# rather than manufacturing a permanent unreachable-upstream ambiguity.
[tool.ffmpeg]
mise_key = "conda:ffmpeg"
binary = "ffmpeg"
# Host-only, like graphify: on a Linux CI runner this reports not-applicable
# rather than failing, since the conda install lives on the Mac host.
os = ["macos"]

# ---- mise itself: the one dependency that gates every other one --------------
#
# Every workflow here is a `mise run` task, and mise is installed standalone at
# ~/.local/bin/mise and SELF-UPDATES out-of-band from any terminal on the host.
# Until this entry existed nothing noticed. The cost of that blind spot, from a
# review of all 13 published v2026.7.x releases (25 days): one silent breaking
# change needing no opt-in (Tera v1 -> v2, #10756) and a 12-release window where
# structured env files were shell-expanded, corrupting literals and pulling in
# ambient process values (#11269, fixed in 7.14). This repo escaped the second
# only by not using `env._.file` — luck, not design.
#
# SELF-MANAGED, so there is no `mise_key`. A `[tools] "ubi:jdx/mise"` pin was
# tried and reverted: it installs fine, but the pinned copy then SHADOWS the
# ambient binary that actually runs every task, so this check would compare
# pinned-against-pinned and report in sync forever (measured — `which(mise)`
# moved to the install dir the moment the pin was added). A pin that blinds the
# check it was meant to feed is worse than no pin.
#
# `expected` is therefore the version whose release notes we have READ. Drift
# means the host moved under us; the fix is to review the gap and then bump this
# line, which is what records that the review happened. `mise.toml`'s
# `min_version` is the other half and cannot do this job: both its keys compare
# "lower than", so a floor never fires on a self-update, which always moves up.
[tool.mise]
binary = "mise"
expected = "2026.7.16"
# `mise --version` prints `2026.7.16 macos-arm64 (2026-07-29)`, so the engine's
# default last-whitespace-field heuristic returns the build DATE. Anchored at the
# start so it reads the version and not some later digit run.
# TOML literal string: a basic "..." would need doubled backslashes
version_pattern = '^v?(\d+\.\d+\.\d+)'
# Releases only — mise is not on PyPI, and GitHub is where the notes live.
github = "jdx/mise"
# No `os` restriction: unlike graphify and ffmpeg, mise is required everywhere
# this repo is checked out, so "absent" is a real failure on any platform.

[[tool.mise.watch]]
kind = "local"
ref = "min-version-floor-vs-reviewed-version"
note = """Two versions are declared and they mean different things. Keep them
straight on every bump: `currency.toml` `expected` = the version whose notes we
have read (moves every time we review); `mise.toml` `min_version.soft` = the
version we are verified against; `min_version.hard` = the oldest we will run at
all (2026.7.14, where #11269/#11288/#11296 landed). soft must stay ABOVE hard or
it is inert — hard errors across exactly the range soft would warn in."""

[[tool.mise.watch]]
kind = "local"
ref = "dotfiles-command-deprecation"
note = """v2026.7.16 (#11436) consolidated dotfiles management under
`mise bootstrap dotfiles` and DEPRECATED the top-level `mise dotfiles` (hidden
now, warnings in 2027.2.0, removal in 2028.2.0). This is the marker that stopped
the 7.16 gate, and it is INERT here: 0 uses of `mise dotfiles` in this repo
(control arm — `mise run` greps to 24 hits in mise.toml, so the probe
discriminates). Recorded like the Tera item so the 2027.2.0 and 2028.2.0
releases are not read as routine, and so a future session does not have to
re-derive that the marker was harmless."""

[[tool.mise.watch]]
kind = "local"
ref = "remote-version-fetch-failure-reporting"
note = """Before v2026.7.16 (#11391) a NETWORK FAILURE while listing remote
versions was reported as "no versions found matching date filter" — an outage
wearing an authoritative empty answer's clothes, which is the exact shape
`.claude/rules/probes-need-a-control-arm.md` exists to catch. Fixed in 7.16
(reported as a fetch failure, and memoized per process). Kept as a watch item
because any host still BELOW 7.16 will show the misleading form, so the
signature table in `persistence-gate-retry.md` has to keep both."""

[[tool.mise.watch]]
kind = "local"
ref = "tera-v1-escape-hatch-removal"
note = """mise moved templates from Tera v1 to v2 in v2026.7.1 (#10756) with a
`tera_v1` / `MISE_TERA_V1` escape hatch scheduled for REMOVAL in 2027.4.0
(#10817). This repo sets neither, so it is already on v2 — the item is here so
the 2027.4.0 release is not read as routine."""

[tool.claude-code]
# The harness itself. Tracked NOT for a mise pin — Claude Code manages its own
# updates and is not in `[tools]` — but because `docs_watch` below is the only
# mechanism that notices when a FEATURE's semantics change. `/goal` lives
# entirely in its docs page: Anthropic can revise it any day without a release
# that looks relevant, and every goal+rider pair under `docs/goals/` plus the
# `goal-engineering` skill is built on what that page says.
#
# `expected` (self-managed, like mise) rather than `mise_key`: pinning the
# harness that runs the session is not a thing this repo can or should do. Bump
# it after reviewing the release notes — that act IS the gap analysis.
expected = "2.1.220"
binary = "claude"
github = "anthropics/claude-code"
# `claude --version` prints `2.1.220 (Claude Code)`, whose last whitespace field
# is `Code)` — the same trap mise's `2026.7.15 macos-arm64 (2026-07-27)` set,
# where the default heuristic returned the build DATE. Capture explicitly.
version_pattern = '^(\d+\.\d+\.\d+)'
# Fingerprinted pages. goal.md is the primary interface for the goal-engineering
# skill; hooks.md defines the Stop-hook contract /goal is built on (it is "a
# built-in shortcut for a session-scoped prompt-based Stop hook"), so a change
# there can alter goal behaviour without goal.md moving at all.
docs_watch = [
  "https://code.claude.com/docs/en/goal.md",
  "https://code.claude.com/docs/en/hooks.md",
  "https://code.claude.com/docs/en/skills.md",
]

[[tool.claude-code.watch]]
kind = "local"
ref = "sessionend-hooks-share-a-1.5s-budget"
note = """hooks.md gained this on 2026-07-30 (#76): "`SessionEnd` hooks share a
1.5-second budget; if your settings set a longer per-hook `timeout`, Claude Code
raises the budget to match, up to 60 seconds."

THE TIMEOUT IS LOAD-BEARING, and not for the reason it looks. Without any
`timeout` our SessionEnd `brain-transcript-audit` would get **1.5s** — a
transcript scan cannot finish in that, and a killed SessionEnd hook is silent, so
the failure mode is an audit that simply stops existing. The declared number is
what buys the budget.

`.claude/settings.json` declared **120**, which the documented ceiling can never
grant; lowered to **60** so the config states what it can actually get. Do not
read the change as a reduction — the effective budget is identical, and 60 is the
documented maximum. Do not delete the field to "use the default": that is the one
edit that would silently cost the audit ~58 of its 60 seconds.

Re-probe on each docs review: if the ceiling moves, this number moves with it."""

[[tool.claude-code.watch]]
kind = "local"
ref = "goal-evaluator-model-is-not-always-haiku"
note = """goal.md, same 2026-07-30 revision. Was "defaults to Haiku"; now
"defaults to Haiku ON THE CLAUDE API; on a third-party provider, check your
provider page", plus a new `ANTHROPIC_DEFAULT_HAIKU_MODEL` override whose scope is
GLOBAL — it also rebinds the `haiku` alias and background functionality such as
conversation summarization.

Why it is tracked rather than absorbed: the goal-engineering skill's central rule
is that a clause must be settleable by "a Haiku-class reader, given the transcript
and nothing else". That phrasing survives — it is now a FLOOR rather than a
description of the deployed model. The risk this guards against is the inverse of
the obvious one: not that the evaluator is weaker than assumed, but that someone
observes a smart evaluator judging a vague clause correctly and concludes the
clause was fine.

Consequence for recorded outcomes: `kb-goal-outcome` results are conditional on
the evaluator that produced them. A `stalled` under one model is not evidence
about another (`verify-before-advancing.md`, "carry a fact's CONDITION").

UNCHANGED and re-verified the same day, which is the reason the skill needed no
structural edit: the transcript-only/no-tools constraint (quoted verbatim in
`references/rubric.md`), the **4,000-character** cap (`goal.py:GOAL_CHAR_CAP`),
one goal per session, "setting a goal starts a turn with the condition as the
directive" (T12's entire basis), the turn-clause bound, the `clear` aliases and
the resume semantics."""

[[tool.claude-code.watch]]
kind = "local"
ref = "nested-project-skills-are-not-loaded-at-startup"
note = """skills.md, same 2026-07-30 revision, and it REVERSED a claim rather than
refining one. Was: "Claude Code also discovers skills from nested `.claude/skills/`
directories on demand." Now: they "aren't loaded at startup … Until then, those
skills don't appear in autocomplete and can't be invoked by name" — they load only
once Claude reads or edits a file inside that subdirectory.

NO IMPACT HERE, stated so the next session does not re-derive it: every skill in
this repo lives at the repo-root `.claude/skills/`, which loads at startup. Recorded
because the failure it now describes is invisible — a nested skill is not missing,
it is merely un-invocable until an unrelated file read happens to arm it, so
"the skill did not fire" would read as a description problem.

Same revision, no action: `/verify` records its own recipe to
`.claude/skills/verify/SKILL.md` (v2.1.200+, edit behaviour narrowed in v2.1.205),
and the cloud-session doc anchor moved from `claude-code-on-the-web` to
`cloud-environments`."""

[[tool.claude-code.watch]]
kind = "local"
ref = "permissionrequest-now-fires-where-nobody-can-be-asked"
note = """hooks.md, same 2026-07-30 revision. Was: "Runs when the user is shown a
permission dialog." Now it also runs in sessions that CANNOT show one — background
subagents in non-interactive mode — and "if no hook returns a decision, it denies
the tool call."

Tracked because the old sentence made the event sound unreachable in headless
work, so a `PermissionRequest` hook would look like the wrong tool for gating an
unattended lane. It is now the opposite: in headless mode the DEFAULT is deny, and
a hook is what can allow. This repo registers no `PermissionRequest` hook (its
three PreToolUse guards are the enforcement layer, `mise-tasks-only.md`), so
nothing changes today.

NOT changed, control-armed the same day because the graph records a standing
disagreement about it: the "Claude Code overrides the hook and ends the turn after
8 consecutive blocks" Stop-hook cap is still present — 1 occurrence in both the
2026-07-27 baseline and the current page, against a bogus term at 0. goal.md still
never mentions a cap. The unreconciled-doc-disagreement node stays TRUE; do not
re-derive it."""

# ---------------------------------------------------------------------------
# hk — the git-hook gate this repo's `mise run lint` IS (#87)
# ---------------------------------------------------------------------------
# The ordinary PINNED-tool shape, not `[tool.mise]`'s self-managed one: hk is in
# this repo's `[tools]`, so `mise_key` resolves and `expected` is deliberately
# ABSENT — the engine reads `expected` as "self-managed", which hk is not.
#
# No `version_pattern`: `hk --version` prints exactly `hk 1.52.0`, so the
# engine's default `text.split()[-1].lstrip("v")` returns `1.52.0` already.
# mise and claude-code need patterns because their output carries a platform and
# a build date after the version; adding one here would only create a way for
# the match to stop working.
#
# On `kind = "issue"` for hk — read this before adding one. `jdx/hk` has
# `has_issues: false`; its tracker is DISCUSSIONS (probed 2026-07-31; control
# arm: this repo returns `has_issues: true`, so the probe discriminates).
#
# That does NOT make `kind = "issue"` universally impossible here, and an earlier
# version of this comment wrongly said it did. Measured, three arms:
#
#   repos/jdx/hk/issues/1099   -> 200  (a PR — the issues endpoint serves PRs)
#   repos/jdx/hk/issues/1098   -> 404  (a DISCUSSION — not on that endpoint)
#   repos/jdx/hk/issues/999999 -> 404  (control)
#
# So a watch pointing at a hk PR NUMBER would resolve, and `issues.py` never
# checks `has_issues` before fetching, so nothing pre-empts it either way. What
# cannot be watched is hk's actual tracker: a discussion 404s permanently, and a
# watch whose lookup always fails blocks the unambiguous-bump gate forever rather
# than failing loudly.
#
# The two items below are `local` for a different and simpler reason: neither is
# an upstream item whose state we are waiting on. One records a DECISION (the
# depends ban stays) and one a fact about this repo's SHAPE (the version is
# written in three places). Nothing upstream will ever close them.
[tool.hk]
mise_key = "hk"
binary = "hk"
github = "jdx/hk"

[[tool.hk.watch]]
kind = "local"
ref = "depends-ban-is-now-a-choice-not-a-workaround"
note = """`hk.pkl` bans `depends` in favour of `exclusive = true` because a failed
dependency used to deadlock every dependent (`hk.pkl:152`, and the same doctrine
in `long-running-command-hangs.md` rule 5 + dotfiles' `no_hk_depends` step). The
trigger condition is `fail_fast = false` AND a step carrying `depends`. This
repo sets the first at `hk.pkl:12` and, because of this very ban, has ZERO of the
second — the only occurrence of `depends` in `hk.pkl` is the comment forbidding
it. So the deadlock could never have fired here; the ban is what made it
unreachable, which is the point rather than a caveat to it.

**Upstream FIXED it in v1.53.0 (#1099): dependents no longer hang after a failed
dependency.** So the ban is no longer a workaround for a live defect — it is a
choice, and `tool-currency-and-native-first.md` says custom avoidance kept alive
by a fixed defect is exactly what to re-examine.

Deliberately NOT retired (Ray, 2026-07-31): `exclusive` works, the doctrine spans
both repos, and dotfiles machine-enforces it — retiring it here alone would split
the two repos' rules. Recorded WITH its version condition so a future reader knows
which of the two it is, and so any revival is a decision rather than a rediscovery."""

[[tool.hk.watch]]
kind = "local"
ref = "hk-version-is-written-three-times"
note = """dotfiles' `hk_version_parity` step does not port — it exists because
that repo carries THREE pkl files whose hk pins can drift apart, and this repo has
exactly ONE (`hk.pkl`, verified 2026-07-31).

But a drift surface remains on a DIFFERENT axis: the version appears three times
across two files — `mise.toml`'s `hk` pin, and `hk.pkl`'s `amends` and `import`
URLs. A `mise.toml`-only bump runs a new BINARY against the old SCHEMAS. Bump all
three together, or the mismatch shows up as a pkl error with nothing pointing at
the pin."""

# ---------------------------------------------------------------------------
# fnox — the credential tool the shell's secrets come from (#86)
# ---------------------------------------------------------------------------
# Ray's call, 2026-07-31: track it "like hk" — an ordinary pinned tool. So fnox
# is now pinned in `[tools]` too, and this block takes `mise_key`, NOT
# `[tool.mise]`'s self-managed `expected` shape.
#
# The problem it closes: fnox resolved from the user's GLOBAL mise, which
# installs it into a directory literally named `latest` and self-updates out of
# band. Installed 1.31.1 and upstream latest 1.31.1 (probed 2026-07-31, both
# arms), so there was no drift — only no way to notice any.
#
# Scope, so the `do-not.md` #11 tension is not re-derived from scratch: this
# tracks a VERSION and touches nothing under `~/.config/fnox`. fnox's real
# enforcement — the `env = "exec"` baseline and the `mde-py bootstrap_config()`
# wipe that silently drops the mode plus all four opt-ins — lives in dotfiles'
# `doctor.toml` as `fnox-baseline`, and stays there. Before this, NOTHING tracked
# fnox's version anywhere: dotfiles' `currency.toml` carries only `[tool.graphify]`
# (control arm: `mise` appears 8 times in that file, so the grep discriminates).
[tool.fnox]
mise_key = "fnox"
binary = "fnox"
github = "jdx/fnox"

[[tool.fnox.watch]]
kind = "local"
ref = "pinned-here-global-stays-on-latest"
note = """Pinning fnox in this repo's `[tools]` means the shim resolves to the
pinned version INSIDE this directory while the global install stays on `latest`
— an accepted skew, chosen deliberately so this repo states the fnox it expects.
Bump the two together; a bump here alone narrows the skew rather than closing it,
and the global side is not this repo's to edit (`do-not.md` #11)."""
