# Tool-currency config — what `kb-setup currency` checks in THIS repo.
#
# One `[tool.<name>]` table per tracked tool. graphify is the pilot; mise, hk,
# uv, ruff and ty adopt the same shape with no engine change, which is the whole
# reason this is config and not code.
#
# Each repo carries its own config and runs independently (decided 2026-07-23).
# There is deliberately NO cross-repo assertion here: this repo must never learn
# anything about a consumer, which is the same rule that had
# `sources/dotfiles.manifest` reverted.

[tool.graphify]
# The mise pin this tool is installed from. Both the bare-string and table forms
# of a pin are read, because both are in use across these repos.
mise_key = "pipx:graphifyy"
binary = "graphify"
# mise's pipx backend installs from PyPI, so PyPI — not the newest GitHub tag —
# is the installable truth. On 2026-07-23 v1.0.0 was tagged on GitHub while PyPI
# was still 0.9.25; tracking the tag would have pinned something uninstallable.
pypi = "graphifyy"
github = "Graphify-Labs/graphify"
extras = ["all"]
# Packages the `all` extra must ACTUALLY deliver — comparing two config files
# cannot tell you the install is intact. Deliberately NOT the full extra set:
# graspologic/leidenalg/igraph auto-skip by PEP 508 marker on Python 3.14 (the
# accepted Louvain fallback), so demanding them would report drift that is not
# drift. Verified present on this host 2026-07-24.
extra_probes = ["faster_whisper", "tree_sitter", "tree_sitter_cpp"]
# The ingested corpus must describe the release we actually run.
manifest = "sources/graphify.manifest"
# The project-scoped `/graphify` skill, refreshed by `currency.apply` in the SAME
# step that moves the pin — so the skill can never describe a version we stopped
# running. It sat at 0.9.23 while the pin reached 0.9.32: eight releases of drift
# that nothing reported, because `.graphify_version` is gitignored (`.gitignore:72`)
# and therefore leaves no tracked trace.
#
# `--project` is load-bearing and is spelled out here on purpose (`do-not.md` #1):
# WITHOUT it the installer mutates `~/.claude`, appends a `# graphify` H1 to
# `~/.claude/CLAUDE.md`, and sprays version stamps into every other platform's
# user skill dir. With it, control-armed 2026-08-03, home is untouched.
skill_dir = ".claude/skills/graphify"
# `mise exec --` and NOT a bare `graphify`, which is the whole point. Measured
# 2026-08-03, minutes after this field was first written with the bare name:
# `command -v graphify` reached
# `~/.local/share/mise/installs/pipx-graphifyy/0.9.31/bin/graphify` while the pin
# was already 0.9.32, so the refresh reinstalled the OLD skill and the stamp came
# back reading 0.9.31 — a refresh that ran, reported success, and changed nothing.
# That is the same stale-install-dir-ahead-of-the-shims defect this whole currency
# engine was written for (`sync.py`'s module docstring), reached through the one
# path `graphify_env.graphify_exe` cannot cover: an argv in a config file.
skill_install = ["mise", "exec", "--", "graphify", "install", "--project"]
# graphify stamps no version into its own output (`export.to_json()` writes only
# `built_at_commit`), so the build task writes this sidecar instead — otherwise
# "which version built this graph?" is unanswerable from the artifact.
artifact = "graphify-out/graph.json"
# The GENERATED outputs `kb-artifacts` derives from the graph. Ray's step 1 said
# "in sync with the graph AND generated outputs", so the stamp fingerprints
# these too (a stat, so it is cheap) and step 1 flags one that MOVED — was
# rewritten, or went missing — the same way it flags a stale graph.
# `kb-artifacts` re-stamps them.
#
# It cannot flag one that is stale precisely BECAUSE nothing regenerated it: such
# a view never moves, so `size:mtime_ns` reads OK for it forever (#182, measured —
# graphml and wiki sat ~11h behind the graph with every row green). That question
# is answered separately by `kb_setup.currency.views`, off the `views` map this
# same stamp now carries, and it reports under its own `[views]` header.
#
# Directories (wiki/) are fingerprinted HERE by their own mtime/size — cheap
# enough for a per-session hook, and it catches a regeneration that adds or
# removes a page. It does NOT catch one that rewrites the same page names in
# place: a directory's mtime only moves when an entry is added or removed
# (measured). `views` therefore uses `sync.deep_artifact_fingerprint` instead,
# which walks the tree — 35.6-63.3 ms over this wiki — and is paid only at STAMP
# time, never on the hook path.
#
# svg is DELIBERATELY absent, though the handoff suggested it. `kb-artifacts`
# skips svg above 5,000 nodes (unreadable hairball + a mathtext `$` crash), and
# this graph is ~128k nodes — so svg is never regenerated here. Declaring it
# would make step 1 report a permanent "missing/stale svg" for an output the
# build correctly never produces: the exact absence-of-evidence false-drift this
# engine exists to avoid. Re-add it only for a repo whose graph stays under the
# limit. (Control-armed 2026-07-24: graph.json is 128,205 nodes.)
artifacts = [
  "graphify-out/GRAPH_REPORT.md",
  "graphify-out/graph.graphml",
  "graphify-out/wiki",
]
# The committed INPUTS `kb_setup.graph.build()` actually reads — the two globs
# and no more. Digested (sha256) into the same stamp, so step 1 can answer the
# question nothing could answer before: does the built graph still match the
# corpus it was built from? Editing a manifest or landing an extraction chunk
# previously left a graph describing an older corpus with every check green.
#
# sha256 here while `artifacts` above stays `size:mtime_ns`, and the asymmetry is
# measured, not stylistic: the inputs are 2.4 MB against the outputs' 341 MB
# (142x), and a stat CANNOT discriminate on the input side — `git checkout --`,
# a branch round-trip touching `sources/`, and a stash+pop each move it on
# byte-identical files, firing on every row of that class
# (docs/research/reports/2026-07-31-size-mtime-false-drift.md). sha256 is clean
# on all three, still fires on a real edit, and costs 1.8 ms over 43 files.
# `git hash-object` was checked as the tool built-in and is ~480x slower here
# (subprocess start-up dominates a 2.4 MB hash) — recorded so nobody re-runs it.
#
# The CLONES under `sources/<name>/` are deliberately absent: they are gitignored
# and re-fetched from the manifest's pinned SHA, so the manifest IS their
# identity. Fingerprinting them would report drift every time a clone was
# refreshed at the same pin.
inputs = ["sources/*.manifest", "sources/extractions/*.json"]
stamp = "graphify-out/.currency-stamp.json"
# graphify is host-only here. On a Linux CI runner these checks must report
# NOT-APPLICABLE rather than fail: "cannot check here" and "checked and wrong"
# are different answers.
os = ["macos"]

# ---- Step 4: what we are tracking upstream, and what we owe ourselves --------

[[tool.graphify.watch]]
kind = "local"
ref = "label-communities-schema-gap"
note = """`label_communities` (llm.py) has no JSON-schema constant, unlike
`_EXTRACTION_JSON_SCHEMA`. Extraction is fixed; LABELLING is still broken —
probed on 0.9.25, 42/42 batches failed. Community names come from the free
deterministic `label_communities_by_hub` instead. Re-probe on each bump.

STILL PRESENT on 0.9.30 (re-probed 2026-07-29). Counts unchanged —
`_EXTRACTION_JSON_SCHEMA` x2, label-side schema constant x0,
`def label_communities` x1 — with a bogus symbol at 0 in the same file, so the
zero is an absence rather than a broken probe.

The cheap byte-identical arm did NOT settle it this time: `llm.py` grew
3070 -> 3115 lines between 0.9.26 and 0.9.30. Reading the diff did: every
changed line is on the BEDROCK path (`_bedrock_response_text` for #2287, and
the botocore timeout/retry config for #2284). **Zero** label-touching diff
lines, so the gap provably cannot have moved — and Bedrock is a backend this
repo forbids anyway (`AWS_REGION` is stripped by `graphify_env.clean_env()`).

Method for the next bump, in order: diff `llm.py`; if it changed, grep the diff
for `label` before assuming anything; only run the 42-batch probe if a
label-touching line actually moved.

RE-PROBED 2026-08-03 for 0.9.32, by exactly that method, from the pinned clone:
`git diff v0.9.31..v0.9.32 -- graphify/llm.py` reports **0 changed lines** and 0
label-touching lines. Control arm on the SAME diff — `graphify/build.py` +168/-27
and `extractors/engine.py` +168/-10 — so the command discriminates rather than
returning empty for every input. The 42-batch probe was therefore NOT run: with
zero changed lines the gap cannot have moved. STILL PRESENT on 0.9.32.

RE-PROBED 2026-08-05 for 0.9.34, same method, via the GitHub compare API
(`gh api .../compare/v0.9.33...v0.9.34`) because the local clone was absent at
probe time. `graphify/llm.py` +12/-0 — the first llm.py movement since 0.9.30,
so the cheap zero-diff arm did NOT settle it this time. Reading the patch did:
all 12 added lines are the #2486 hyperedge member-ref coercion in
`_sanitize_fragment`, zero label-touching lines. Control arm on the SAME
compare — `graphify/build.py` +117/-21 and `cli.py` +78/-11 — so the probe
discriminates. The 42-batch probe was therefore NOT run. STILL PRESENT on
0.9.34.

RE-PROBED 2026-08-07 for 0.9.35, from `graphify/llm.py` at tag v0.9.35
(raw.githubusercontent; the clone was absent at probe time). Counts unchanged:
`_EXTRACTION_JSON_SCHEMA` x2, `def label_communities` x1, label-side schema
constant x0 — with a bogus symbol at x0 in the same file, so the zero is an
absence rather than a broken probe. `llm.py` grew 3115 -> 3127 lines. The
42-batch probe was NOT run, per this item's own recorded method. STILL PRESENT
on 0.9.35.

RE-PROBED 2026-08-08 for 0.9.36. The cheap zero-diff arm did NOT settle it:
`gh api .../compare/v0.9.35...v0.9.36` reports `graphify/llm.py` +6/-1 AND
`tests/test_labeling.py` +70/-6, so a label-touching line moved for the first
time since 0.9.30. Control arm on the SAME compare — `dedup.py` +87/-7,
`cli.py` +66/-16 — so the command discriminates.

Reading the patch settled it, and it is a DIFFERENT label defect: #2534, the
community-label prompt colliding with the discard sentinel. `_community_label_lines`
changed `f"Community {cid}: ..."` to a bare `f"{cid}: ..."` because the old
string doubled as `_placeholder_community_labels`' sentinel, so a model echoing
the key back produced a name the caller's filter dropped. The prompt gained one
