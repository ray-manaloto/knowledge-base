raises the budget to match, up to 60 seconds."

THE TIMEOUT IS LOAD-BEARING, and not for the reason it looks. Without any
`timeout` our SessionEnd `brain-transcript-audit` would get **1.5s** — a
transcript scan cannot finish in that, and a killed SessionEnd hook is silent, so
the failure mode is an audit that simply stops existing. The declared number is
what buys the budget.

`.claude/settings.json` declared **120**, which the documented ceiling can never
grant; lowered to **60** so the config states what it can actually get. Do not
read the change as a reduction — the effective budget is identical, and 60 is the
documented maximum. Do not delete the field to "use the default": that is the one
edit that would silently cost the audit ~58 of its 60 seconds.

Re-probe on each docs review: if the ceiling moves, this number moves with it.

