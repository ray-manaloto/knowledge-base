[tool.claude-code]
# The harness itself. Tracked NOT for a mise pin — Claude Code manages its own
# updates and is not in `[tools]` — but because `docs_watch` below is the only
# mechanism that notices when a FEATURE's semantics change. `/goal` lives
# entirely in its docs page: Anthropic can revise it any day without a release
# that looks relevant, and every goal+rider pair under `docs/goals/` plus the
# `goal-engineering` skill is built on what that page says.
#
# `expected` (self-managed, like mise) rather than `mise_key`: pinning the
# harness that runs the session is not a thing this repo can or should do. Bump
# it after reviewing the release notes — that act IS the gap analysis.
expected = "2.1.226"
binary = "claude"
github = "anthropics/claude-code"
# ADDED 2026-08-08 (#242), same reason as `[tool.mise]`. This one drifted
# furthest — the manifest sat at v2.1.222 against an installed 2.1.226 — and it
# is the manifest that matters most, because `sources/agent-harness-docs` and
# this pin are what a "what does Claude Code do?" query reads.
manifest = "sources/claude-code.manifest"
# `claude --version` prints `2.1.220 (Claude Code)`, whose last whitespace field
# is `Code)` — the same trap mise's `2026.7.15 macos-arm64 (2026-07-27)` set,
# where the default heuristic returned the build DATE. Capture explicitly.
version_pattern = '^(\d+\.\d+\.\d+)'
# Fingerprinted pages. goal.md is the primary interface for the goal-engineering
# skill; hooks.md defines the Stop-hook contract /goal is built on (it is "a
# built-in shortcut for a session-scoped prompt-based Stop hook"), so a change
# there can alter goal behaviour without goal.md moving at all.
docs_watch = [
  "https://code.claude.com/docs/en/goal.md",
  "https://code.claude.com/docs/en/hooks.md",
  "https://code.claude.com/docs/en/skills.md",
]

[[tool.claude-code.watch]]
kind = "local"
ref = "sessionend-hooks-share-a-1.5s-budget"
note = """hooks.md gained this on 2026-07-30 (#76): "`SessionEnd` hooks share a
1.5-second budget; if your settings set a longer per-hook `timeout`, Claude Code
raises the budget to match, up to 60 seconds."

THE TIMEOUT IS LOAD-BEARING, and not for the reason it looks. Without any
`timeout` our SessionEnd `brain-transcript-audit` would get **1.5s** — a
transcript scan cannot finish in that, and a killed SessionEnd hook is silent, so
the failure mode is an audit that simply stops existing. The declared number is
what buys the budget.

`.claude/settings.json` declared **120**, which the documented ceiling can never
grant; lowered to **60** so the config states what it can actually get. Do not
read the change as a reduction — the effective budget is identical, and 60 is the
documented maximum. Do not delete the field to "use the default": that is the one
edit that would silently cost the audit ~58 of its 60 seconds.

Re-probe on each docs review: if the ceiling moves, this number moves with it.

RE-PROBED 2026-08-05 (hooks.md flagged CHANGED at the 2.1.220 -> 2.1.222 review):
the mechanism holds verbatim — 1.5s shared budget, per-hook `timeout` raises it,
ceiling still 60 — so the declared 60 stays correct. Two NEW facts on the same
paragraph: (1) `CLAUDE_CODE_SESSIONEND_HOOKS_TIMEOUT_MS` now overrides the
budget explicitly — an escape hatch, not needed here; (2) "Timeouts set on
plugin-provided hooks don't raise the budget" — our audit hook is declared in
`.claude/settings.json` (repo settings, not a plugin), so it still buys the 60;
skillopt-sleep's SessionEnd hook IS plugin-provided, but it is an async
marker-append that needs no budget. No config change.

RE-PROBED 2026-08-08 (hooks.md flagged CHANGED at the 2.1.224 -> 2.1.226
review): the mechanism holds VERBATIM at `hooks.md:2856` — 1.5 s shared budget,
per-hook `timeout` raises it, ceiling still 60, plugin-provided timeouts still
do not raise it, `CLAUDE_CODE_SESSIONEND_HOOKS_TIMEOUT_MS` still the explicit
override. `.claude/settings.json` still declares `timeout: 60`, which remains
the documented maximum. Control: a bogus term x0 on the same page.

NEW on the same page (`hooks.md:415`), recorded because it is the surrounding
context this item's number lives in: the per-hook `timeout` DEFAULTS are now
tabulated — 600 s for `command`/`http`/`mcp_tool`, 30 for `prompt`, 60 for
`agent`; `UserPromptSubmit` lowers the first three to 30 and `MessageDisplay`
to 10. None of that changes the SessionEnd figure, which is governed by the
shared-budget rule rather than by the default. No config change."""

